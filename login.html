<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="description" content="ARVEXA School - Connexion">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png" type="image/png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       ROOT — Design system ARVEXA
       ============================================================ */
    :root {
      --primary: #1A3A2A;
      --primary-dark: #0A1A12;
      --primary-light: #2A5A3A;
      --accent: #B8860B;
      --accent-bright: #E0B84A;
      --accent-dim: rgba(184, 134, 11, 0.08);
      --success: #2D7D5A;
      --danger: #B85C3A;
      --bg-dark: #0A0A0A;
      --bg-surface: #141414;
      --bg-card: rgba(20, 20, 20, 0.7);
      --text-light: #F5F0E8;
      --text-dim: #8A8A7A;
      --text-muted: #5A5A4A;
      --card-border: rgba(184, 134, 11, 0.08);
      --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --radius: 16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html { scroll-behavior: smooth; width: 100%; overflow-x: hidden; }

    body {
      font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      width: 100%;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }

    /* ===== BACKGROUND ===== */
    .gradient-bg {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
      background: radial-gradient(ellipse 50% 35% at 30% 15%, rgba(26, 58, 42, 0.16) 0%, transparent 70%),
                  radial-gradient(ellipse 40% 25% at 70% 85%, rgba(184, 134, 11, 0.05) 0%, transparent 60%),
                  linear-gradient(180deg, #0A0A0A 0%, #060606 100%);
    }
    .glow {
      position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: -1;
      opacity: 0.15; animation: glowMove 10s ease-in-out infinite alternate;
    }
    .glow-1 { width: 350px; height: 350px; background: rgba(26,58,42,0.18); top: -80px; right: -80px; }
    .glow-2 { width: 200px; height: 200px; background: rgba(184,134,11,0.05); bottom: 0; left: 0; animation-delay: -4s; }
    @keyframes glowMove { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(30px,-20px) scale(1.1); } }

    /* ============================================================
       CONTAINER
       ============================================================ */
    .login-container {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      animation: fadeInUp 0.5s ease-out;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ============================================================
       LOGO
       ============================================================ */
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--text-light);
      font-size: 26px;
      font-weight: 700;
      font-family: 'Playfair Display', 'Georgia', serif;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    .logo span {
      background: linear-gradient(90deg, var(--accent), var(--accent-bright), var(--accent));
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-style: italic;
      animation: shimmerText 4s linear infinite;
    }
    @keyframes shimmerText { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }

    .logo-sub {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 28px;
      font-weight: 300;
      letter-spacing: 1px;
    }

    /* ============================================================
       CARD
       ============================================================ */
    .login-card {
      background: var(--bg-card);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 32px 28px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }
    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent-bright), var(--accent));
    }

    .login-title {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-title h1 {
      font-size: 22px;
      font-weight: 700;
      font-family: 'Playfair Display', serif;
      color: var(--text-light);
    }
    .login-title h1 span { color: var(--accent-bright); }
    .login-title p {
      font-size: 13px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    /* ============================================================
       FORMULAIRE
       ============================================================ */
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-dim);
      margin-bottom: 4px;
    }
    .form-group .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      transition: var(--transition);
      overflow: hidden;
    }
    .form-group .input-wrap:focus-within {
      border-color: rgba(184, 134, 11, 0.2);
      box-shadow: 0 0 0 3px rgba(184, 134, 11, 0.05);
    }
    .form-group .input-wrap.error {
      border-color: var(--danger);
      box-shadow: 0 0 0 3px rgba(184, 92, 58, 0.05);
    }
    .form-group .input-wrap .icon {
      padding: 0 4px 0 14px;
      color: var(--text-muted);
      font-size: 14px;
    }
    .form-group .input-wrap input {
      width: 100%;
      padding: 12px 14px 12px 8px;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-light);
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      font-weight: 400;
    }
    .form-group .input-wrap input::placeholder {
      color: var(--text-muted);
      font-weight: 300;
    }
    .form-group .input-wrap .toggle-password {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      padding: 4px;
      transition: var(--transition);
    }
    .form-group .input-wrap .toggle-password:hover { color: var(--text-light); }
    .form-group .error-message {
      display: none;
      font-size: 11px;
      color: var(--danger);
      margin-top: 4px;
    }
    .form-group .error-message.visible { display: block; }

    /* ============================================================
       BOUTONS
       ============================================================ */
    .btn-login {
      width: 100%;
      padding: 14px;
      border-radius: 30px;
      border: none;
      background: linear-gradient(135deg, var(--accent-bright), var(--accent));
      color: #0A0A0A;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 4px;
      position: relative;
      overflow: hidden;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 30px rgba(184, 134, 11, 0.25);
    }
    .btn-login:active { transform: scale(0.97); }
    .btn-login:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .btn-login .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(10,10,10,0.15);
      border-top-color: #0A0A0A;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .btn-login.loading .spinner { display: block; }
    .btn-login.loading .btn-text { display: none; }
    .btn-login.loading .btn-icon { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 20px 0 18px;
    }
    .divider .line {
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.06);
    }
    .divider .text {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 300;
      white-space: nowrap;
    }

    .btn-register {
      width: 100%;
      padding: 12px;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.06);
      background: transparent;
      color: var(--text-dim);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      font-family: 'Inter', sans-serif;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-register:hover {
      border-color: rgba(184, 134, 11, 0.1);
      color: var(--text-light);
      background: rgba(255,255,255,0.03);
    }

    .btn-forgot {
      display: block;
      text-align: right;
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: none;
      margin-top: 4px;
      transition: var(--transition);
    }
    .btn-forgot:hover { color: var(--accent-bright); }

    /* ============================================================
       SECURE
       ============================================================ */
    .secure {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 16px;
    }
    .secure i { color: var(--success); margin-right: 4px; }

    /* ============================================================
       TOAST
       ============================================================ */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      padding: 12px 20px;
      border-radius: 12px;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      color: var(--text-light);
      font-size: 13px;
      z-index: 200;
      opacity: 0;
      transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      max-width: 90%;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: rgba(45, 125, 90, 0.25); }
    .toast.error { border-color: rgba(184, 92, 58, 0.3); }
    .toast .toast-icon { margin-right: 8px; }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 480px) {
      body { padding: 16px 12px; }
      .login-card { padding: 24px 18px; }
      .logo { font-size: 22px; }
      .login-title h1 { font-size: 20px; }
    }

    @media (max-width: 360px) {
      .login-card { padding: 20px 14px; }
      .logo { font-size: 18px; }
      .form-group .input-wrap input { font-size: 13px; padding: 10px 12px 10px 6px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    a:focus-visible, button:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 6px;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(184, 134, 11, 0.25); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(184, 134, 11, 0.4); }
  </style>
</head>
<body>

<!-- ===== BACKGROUND ===== -->
<div class="gradient-bg"></div>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>

<!-- ===== CONTAINER ===== -->
<div class="login-container">

  <!-- Logo -->
  <a href="bienvenue.html" class="logo">ARVE<span>XA<span> School</span></a>
  <div class="logo-sub">Apprendre · S'entraîner · Progresser</div>

  <!-- Login Card -->
  <div class="login-card">
    <div class="login-title">
      <h1>🔐 Se <span>connecter</span></h1>
      <p>Retrouve ton espace personnel</p>
    </div>

    <!-- Formulaire -->
    <form id="loginForm" novalidate>

      <!-- Email -->
      <div class="form-group">
        <label for="emailInput">Adresse e-mail</label>
        <div class="input-wrap" id="emailWrap">
          <span class="icon"><i class="fas fa-envelope"></i></span>
          <input type="email" id="emailInput" placeholder="exemple@email.com" autocomplete="email" required>
        </div>
        <div class="error-message" id="emailError">Adresse e-mail invalide.</div>
      </div>

      <!-- Mot de passe -->
      <div class="form-group">
        <label for="passwordInput">Mot de passe</label>
        <div class="input-wrap" id="passwordWrap">
          <span class="icon"><i class="fas fa-lock"></i></span>
          <input type="password" id="passwordInput" placeholder="Entrer ton mot de passe" autocomplete="current-password" required>
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Afficher/masquer le mot de passe">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        <div class="error-message" id="passwordError">Ce champ est obligatoire.</div>
      </div>

      <!-- Mot de passe oublié -->
      <a href="forgot-password.html" class="btn-forgot">Mot de passe oublié ?</a>

      <!-- Bouton Connexion -->
      <button type="submit" class="btn-login" id="loginBtn">
        <span class="btn-icon"><i class="fas fa-sign-in-alt"></i></span>
        <span class="btn-text">Se connecter</span>
        <span class="spinner"></span>
      </button>

    </form>

    <!-- Divider -->
    <div class="divider">
      <span class="line"></span>
      <span class="text">ou</span>
      <span class="line"></span>
    </div>

    <!-- Bouton Créer un compte -->
    <a href="register.html" class="btn-register">
      <i class="fas fa-user-plus"></i> Créer un compte
    </a>

    <div class="secure">
      <i class="fas fa-lock"></i> Connexion sécurisée
    </div>
  </div>

</div>

<!-- ===== TOAST ===== -->
<div class="toast" id="toast">
  <span class="toast-icon"><i class="fas fa-check-circle"></i></span>
  <span class="toast-message"></span>
</div>

<!-- ============================================================ -->
<!-- SCRIPTS -->
<!-- ============================================================ -->
<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js"
  }
}
</script>

<script type="module">
// ================================================================
// login.html - Page de connexion
// ================================================================
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";
import { protectPage } from './auth.js';

// ================================================================
// FIREBASE CONFIG
// ================================================================
const firebaseConfig = {
  apiKey: "AIzaSyDHscOXw3rLuhV6z1Cny-bdYCumqpnG7QE",
  authDomain: "arvexa-fbf10.firebaseapp.com",
  projectId: "arvexa-fbf10",
  storageBucket: "arvexa-fbf10.firebasestorage.app",
  messagingSenderId: "920108330053",
  appId: "1:920108330053:web:f532d71cbc2c824bc7472c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Persistance
await setPersistence(auth, browserLocalPersistence);

// ================================================================
// DOM
// ================================================================
const form = document.getElementById('loginForm');
const emailInput = document.getElementById('emailInput');
const passwordInput = document.getElementById('passwordInput');
const loginBtn = document.getElementById('loginBtn');
const emailWrap = document.getElementById('emailWrap');
const passwordWrap = document.getElementById('passwordWrap');
const emailError = document.getElementById('emailError');
const passwordError = document.getElementById('passwordError');
const togglePassword = document.getElementById('togglePassword');
const toast = document.getElementById('toast');
const toastMessage = document.querySelector('.toast-message');
const toastIcon = document.querySelector('.toast-icon i');

// ================================================================
// FONCTIONS
// ================================================================

function showToast(message, type = 'success') {
  toastMessage.textContent = message;
  toast.className = `toast ${type}`;
  toastIcon.className = type === 'success' ? 'fas fa-check-circle' : 'fas fa-exclamation-circle';
  toast.classList.add('show');
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => toast.classList.remove('show'), 4000);
}

function validateEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function validateForm() {
  const email = emailInput.value.trim();
  const password = passwordInput.value.trim();
  let isValid = true;

  if (!email || !validateEmail(email)) {
    emailWrap.classList.add('error');
    emailError.classList.add('visible');
    isValid = false;
  } else {
    emailWrap.classList.remove('error');
    emailError.classList.remove('visible');
  }

  if (!password || password.length < 6) {
    passwordWrap.classList.add('error');
    passwordError.classList.add('visible');
    isValid = false;
  } else {
    passwordWrap.classList.remove('error');
    passwordError.classList.remove('visible');
  }

  return isValid;
}

// ================================================================
// ÉVÉNEMENTS
// ================================================================

emailInput.addEventListener('input', () => {
  const email = emailInput.value.trim();
  if (email && validateEmail(email)) {
    emailWrap.classList.remove('error');
    emailError.classList.remove('visible');
  }
  loginBtn.disabled = !validateForm();
});

passwordInput.addEventListener('input', () => {
  const password = passwordInput.value.trim();
  if (password && password.length >= 6) {
    passwordWrap.classList.remove('error');
    passwordError.classList.remove('visible');
  }
  loginBtn.disabled = !validateForm();
});

togglePassword.addEventListener('click', () => {
  const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
  passwordInput.setAttribute('type', type);
  togglePassword.querySelector('i').className = type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!validateForm()) return;

  const email = emailInput.value.trim();
  const password = passwordInput.value.trim();

  loginBtn.disabled = true;
  loginBtn.classList.add('loading');

  try {
    const userCredential = await signInWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;

    const userDoc = await getDoc(doc(db, 'users', user.uid));
    if (!userDoc.exists()) {
      showToast('⚠️ Profil utilisateur introuvable.', 'error');
      loginBtn.disabled = false;
      loginBtn.classList.remove('loading');
      return;
    }

    const userData = userDoc.data();

    if (!userData.onboardingCompleted) {
      showToast('✅ Connexion réussie ! Redirection...', 'success');
      setTimeout(() => window.location.href = 'onboarding.html', 1000);
    } else {
      showToast('✅ Bon retour, ' + (userData.firstName || '') + ' !', 'success');
      setTimeout(() => window.location.href = 'index.html', 1000);
    }

  } catch (error) {
    console.error('❌ Erreur connexion:', error);
    let message = 'Une erreur est survenue.';
    switch (error.code) {
      case 'auth/user-not-found': message = '❌ Aucun compte trouvé avec cette adresse.'; break;
      case 'auth/wrong-password': message = '❌ Mot de passe incorrect.'; break;
      case 'auth/invalid-email': message = '❌ Adresse e-mail invalide.'; break;
      case 'auth/too-many-requests': message = '⏳ Trop de tentatives. Réessaie dans quelques minutes.'; break;
      case 'auth/network-request-failed': message = '📶 Problème de connexion réseau.'; break;
      default: message = '❌ ' + error.message;
    }
    showToast(message, 'error');
    loginBtn.disabled = false;
    loginBtn.classList.remove('loading');
  }
});

// ================================================================
// PROTECTION
// ================================================================

// Login est une page publique : si déjà connecté, redirige vers index
protectPage();

console.log('🚀 ARVEXA — Page Connexion');
</script>

</body>
</html>
