<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="description" content="ARVEXA School - Chapitre">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png" type="image/png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #1A3A2A;
      --primary-dark: #0A1A12;
      --primary-light: #2A5A3A;
      --accent: #B8860B;
      --accent-bright: #E0B84A;
      --accent-dim: rgba(184, 134, 11, 0.08);
      --success: #2D7D5A;
      --danger: #B85C3A;
      --warning: #D4A017;
      --bg-dark: #0A0A0A;
      --bg-surface: #141414;
      --bg-card: rgba(20,20,20,0.7);
      --text-light: #F5F0E8;
      --text-dim: #8A8A7A;
      --text-muted: #5A5A4A;
      --card-border: rgba(184,134,11,0.08);
      --transition: all 0.3s cubic-bezier(0.25,1,0.5,1);
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
      --radius: 16px;
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html { scroll-behavior: smooth; width: 100%; overflow-x: hidden; }
    body {
      font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      width: 100%;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
    }
    .gradient-bg {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
      background: radial-gradient(ellipse 40% 30% at 30% 15%, rgba(26, 58, 42, 0.16) 0%, transparent 70%),
                  radial-gradient(ellipse 35% 25% at 75% 85%, rgba(184, 134, 11, 0.05) 0%, transparent 60%),
                  linear-gradient(180deg, #0A0A0A 0%, #060606 100%);
    }
    .glow {
      position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: -1;
      opacity: 0.15; animation: glowMove 10s ease-in-out infinite alternate;
    }
    .glow-1 { width: 300px; height: 300px; background: rgba(26,58,42,0.18); top: -80px; right: -80px; }
    .glow-2 { width: 180px; height: 180px; background: rgba(184,134,11,0.05); bottom: 0; left: 0; animation-delay: -4s; }
    @keyframes glowMove { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(30px,-20px) scale(1.1); } }

    /* ===== HEADER ===== */
    .header {
      position: sticky; top: 0; z-index: 50; display: flex; align-items: center;
      justify-content: space-between; padding: 10px 16px; background: rgba(10,10,10,0.92);
      backdrop-filter: blur(12px); border-bottom: 1px solid rgba(184,134,11,0.06);
      gap: 12px; min-height: 56px;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .back-btn {
      display: flex; align-items: center; justify-content: center; width: 36px; height: 36px;
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); background: transparent;
      color: var(--text-dim); cursor: pointer; transition: var(--transition); font-size: 16px;
      text-decoration: none;
    }
    .back-btn:hover { border-color: rgba(184,134,11,0.14); color: var(--text-light); }
    .page-title {
      font-size: 14px; font-weight: 600; color: var(--text-light);
      font-family: 'Playfair Display', serif;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px;
    }
    .page-title i { color: var(--accent-bright); margin-right: 6px; font-size: 13px; }
    .header-right { display: flex; align-items: center; gap: 6px; }
    .chap-nav-btn {
      display: flex; align-items: center; justify-content: center; width: 32px; height: 32px;
      border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); background: transparent;
      color: var(--text-dim); cursor: pointer; transition: var(--transition); font-size: 12px;
      text-decoration: none;
    }
    .chap-nav-btn:hover { border-color: rgba(184,134,11,0.14); color: var(--text-light); }
    .chap-nav-btn:disabled { opacity: 0.2; cursor: not-allowed; pointer-events: none; }

    /* ===== CONTAINER ===== */
    .container { max-width: 640px; margin: 0 auto; padding: 12px 12px 32px; width: 100%; display: flex; flex-direction: column; gap: 12px; flex: 1; }

    /* ===== CHAPTER INFO ===== */
    .chapter-info {
      display: flex; align-items: center; gap: 12px; padding: 14px 16px;
      border-radius: var(--radius); background: var(--bg-card); backdrop-filter: blur(10px);
      border: 1px solid var(--card-border); position: relative; overflow: hidden;
    }
    .chapter-info::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--success), var(--accent));
    }
    .ci-num {
      width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center;
      justify-content: center; font-size: 16px; font-weight: 700; flex-shrink: 0;
      font-family: 'Playfair Display', serif;
      background: rgba(184,134,11,0.1); color: var(--accent-bright);
      border: 1px solid rgba(184,134,11,0.12);
    }
    .ci-num.completed { background: rgba(45,125,90,0.15); border-color: rgba(45,125,90,0.2); color: var(--success); }
    .ci-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
    .ci-title { font-size: 15px; font-weight: 600; color: var(--text-light); line-height: 1.3; }
    .ci-sub { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .ci-sub .ci-status {
      font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 10px;
    }
    .ci-sub .ci-status.premium { background: rgba(184,134,11,0.1); color: var(--accent-bright); }
    .ci-sub .ci-status.free { background: rgba(45,125,90,0.1); color: var(--success); }
    .ci-sub .ci-status.locked { background: rgba(184,92,58,0.1); color: var(--danger); }
    .ci-sub .ci-status.completed { background: rgba(45,125,90,0.1); color: var(--success); }
    .ci-progress { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--accent-bright); font-family: 'Playfair Display', serif; }

    /* ===== TABS ===== */
    .tabs {
      display: flex; gap: 4px; background: rgba(255,255,255,0.02); border-radius: 12px;
      padding: 4px; border: 1px solid rgba(255,255,255,0.04);
    }
    .tab-btn {
      flex: 1; padding: 10px 8px; border: none; border-radius: 10px; background: transparent;
      color: var(--text-muted); font-size: 12px; font-weight: 600; cursor: pointer;
      transition: var(--transition); font-family: 'Inter', sans-serif;
      display: flex; align-items: center; justify-content: center; gap: 6px; position: relative;
    }
    .tab-btn i { font-size: 12px; }
    .tab-btn.active {
      background: rgba(184,134,11,0.1); color: var(--accent-bright);
      border: 1px solid rgba(184,134,11,0.12);
    }
    .tab-btn:not(.active) { border: 1px solid transparent; }
    .tab-btn:hover:not(.active) { color: var(--text-dim); }
    .tab-btn .tab-badge {
      position: absolute; top: -4px; right: -4px; font-size: 8px;
      background: var(--success); color: #fff; border-radius: 50%; width: 16px; height: 16px;
      display: flex; align-items: center; justify-content: center; font-weight: 700;
      display: none;
    }
    .tab-btn .tab-badge.show { display: flex; }

    /* ===== CARDS VIEW ===== */
    .cards-view { display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .part-card {
      background: var(--bg-card); backdrop-filter: blur(10px);
      border: 1px solid var(--card-border); border-radius: var(--radius);
      padding: 16px 18px; cursor: pointer; transition: var(--transition);
      display: flex; align-items: center; gap: 14px; position: relative; overflow: hidden;
      text-decoration: none; color: inherit;
    }
    .part-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0; transition: opacity 0.3s ease;
    }
    .part-card:hover { border-color: rgba(184,134,11,0.15); transform: translateY(-1px); }
    .part-card:hover::before { opacity: 1; }
    .part-card:active { transform: scale(0.98); }
    .part-card.locked { opacity: 0.7; }
    .part-card.locked:hover { opacity: 0.9; }
    .part-card.completed { border-color: rgba(45,125,90,0.15); }
    .part-card.completed::before { background: linear-gradient(90deg, transparent, var(--success), transparent); opacity: 1; }

    .pc-icon {
      width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center;
      justify-content: center; font-size: 18px; flex-shrink: 0;
      background: rgba(184,134,11,0.06); color: var(--accent-bright);
      border: 1px solid rgba(184,134,11,0.08);
    }
    .pc-icon.exo { background: rgba(45,125,90,0.06); color: var(--success); border-color: rgba(45,125,90,0.08); }
    .pc-icon.corr { background: rgba(74,175,224,0.06); color: #4AAFE0; border-color: rgba(74,175,224,0.08); }
    .pc-icon.completed { background: rgba(45,125,90,0.12); color: var(--success); border-color: rgba(45,125,90,0.2); }
    .pc-info { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
    .pc-title { font-size: 14px; font-weight: 600; color: var(--text-light); line-height: 1.4; }
    .pc-sub { font-size: 11px; color: var(--text-muted); }
    .pc-arrow {
      display: flex; align-items: center; justify-content: center; width: 28px; height: 28px;
      border-radius: 8px; background: rgba(255,255,255,0.03); color: var(--text-muted);
      flex-shrink: 0; transition: var(--transition); font-size: 11px;
    }
    .part-card:hover .pc-arrow { color: var(--accent-bright); background: rgba(184,134,11,0.08); }

    /* ===== CONTENT VIEW ===== */
    .content-view { display: none; flex-direction: column; gap: 10px; flex: 1; }
    .content-view.active { display: flex; }
    .cards-view.hidden { display: none; }

    .content-back {
      display: flex; align-items: center; gap: 8px; padding: 8px 0;
      color: var(--accent-bright); font-size: 13px; font-weight: 600;
      cursor: pointer; transition: var(--transition); border: none; background: none;
      font-family: 'Inter', sans-serif; width: fit-content;
    }
    .content-back:hover { opacity: 0.7; }
    .content-back i { font-size: 12px; }

    .content-card {
      background: var(--bg-card); backdrop-filter: blur(10px);
      border: 1px solid var(--card-border); border-radius: var(--radius);
      overflow: hidden; flex: 1;
    }
    .content-card-header {
      padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,0.04);
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
    }
    .cch-left { display: flex; align-items: center; gap: 12px; }
    .cch-title { font-size: 14px; font-weight: 600; color: var(--text-light); font-family: 'Playfair Display', serif; }
    .cch-status {
      font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 10px;
    }
    .cch-status.completed { background: rgba(45,125,90,0.1); color: var(--success); }
    .cch-status.in-progress { background: rgba(212,160,23,0.1); color: var(--warning); }
    .cch-status.not-started { background: rgba(255,255,255,0.04); color: var(--text-muted); }
    .cch-nav { display: flex; gap: 6px; }
    .cch-nav-btn {
      display: flex; align-items: center; justify-content: center; width: 30px; height: 30px;
      border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); background: transparent;
      color: var(--text-dim); cursor: pointer; transition: var(--transition); font-size: 11px;
    }
    .cch-nav-btn:hover { border-color: rgba(184,134,11,0.14); color: var(--text-light); }
    .cch-nav-btn:disabled { opacity: 0.2; cursor: not-allowed; pointer-events: none; }
    .cch-actions { display: flex; gap: 6px; }
    .cch-actions .action-btn {
      width: 30px; height: 30px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);
      background: transparent; color: var(--text-muted); cursor: pointer; transition: var(--transition);
      font-size: 12px;
    }
    .cch-actions .action-btn:hover { border-color: rgba(184,134,11,0.14); color: var(--text-light); }
    .cch-actions .action-btn.active { color: var(--accent-bright); border-color: rgba(184,134,11,0.2); }

    .content-card-body {
      padding: 20px 18px; min-height: 300px; max-height: calc(100vh - 320px); overflow-y: auto;
    }
    .content-card-body::-webkit-scrollbar { width: 3px; }
    .content-card-body::-webkit-scrollbar-thumb { background: rgba(184,134,11,0.2); border-radius: 10px; }

    /* ===== CONTENT STYLING ===== */
    .content-card-body h1, .content-card-body h2, .content-card-body h3, .content-card-body h4 {
      color: var(--text-light); font-family: 'Playfair Display', serif; margin: 20px 0 10px;
    }
    .content-card-body h1 { font-size: 20px; }
    .content-card-body h2 { font-size: 18px; padding-bottom: 8px; border-bottom: 1px solid rgba(184,134,11,0.1); }
    .content-card-body h3 { font-size: 16px; }
    .content-card-body h4 { font-size: 15px; }
    .content-card-body p { margin-bottom: 12px; line-height: 1.8; }
    .content-card-body ul, .content-card-body ol { margin: 8px 0 12px 20px; }
    .content-card-body li { margin-bottom: 4px; line-height: 1.7; }
    .content-card-body strong { color: var(--accent-bright); }
    .content-card-body em { color: var(--text-dim); }
    .content-card-body code { background: rgba(184,134,11,0.08); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
    .content-card-body pre {
      background: rgba(10,10,10,0.6); padding: 14px; border-radius: 10px; overflow-x: auto;
      border: 1px solid rgba(255,255,255,0.04); margin: 12px 0; font-size: 13px;
    }
    .content-card-body pre code { background: none; padding: 0; }
    .content-card-body .formula {
      background: rgba(184,134,11,0.06); border: 1px solid rgba(184,134,11,0.1);
      padding: 14px 16px; border-radius: 10px; text-align: center; font-size: 16px;
      margin: 14px 0; font-family: 'Playfair Display', serif; color: var(--accent-bright);
    }
    .content-card-body .note {
      background: rgba(184,134,11,0.06); border-left: 3px solid var(--accent);
      padding: 12px 16px; border-radius: 0 10px 10px 0; margin: 14px 0; font-size: 13px;
    }
    .content-card-body .important {
      background: rgba(184,92,58,0.06); border-left: 3px solid var(--danger);
      padding: 12px 16px; border-radius: 0 10px 10px 0; margin: 14px 0; font-size: 13px;
    }

    /* ===== TIMER ===== */
    .timer-display {
      display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-muted);
      padding: 2px 8px; border-radius: 8px; background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.04);
    }
    .timer-display i { color: var(--accent-bright); font-size: 10px; }
    .timer-display .time { font-weight: 600; color: var(--text-light); font-family: 'Inter', monospace; min-width: 50px; }

    /* ===== NOTES ===== */
    .notes-section {
      margin-top: 12px; padding: 12px 16px; border-radius: var(--radius);
      background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04);
      display: none;
    }
    .notes-section.show { display: block; }
    .notes-section .notes-label {
      font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px;
      display: flex; align-items: center; gap: 6px;
    }
    .notes-section .notes-label i { color: var(--accent-bright); }
    .notes-section textarea {
      width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.02); color: var(--text-light); font-size: 13px;
      font-family: 'Inter', sans-serif; resize: vertical; min-height: 60px; transition: var(--transition);
    }
    .notes-section textarea:focus { outline: none; border-color: rgba(184,134,11,0.2); }
    .notes-section textarea::placeholder { color: var(--text-muted); }
    .notes-section .notes-saved {
      font-size: 10px; color: var(--success); display: none; margin-top: 2px; text-align: right;
    }
    .notes-section .notes-saved.show { display: block; }

    /* ===== LOADING & EMPTY ===== */
    .loading-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 60px 20px; gap: 12px; min-height: 300px;
    }
    .spinner {
      width: 32px; height: 32px; border: 3px solid rgba(184,134,11,0.15);
      border-top-color: var(--accent-bright); border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-state p { font-size: 13px; color: var(--text-muted); }

    .empty-state {
      text-align: center; padding: 60px 24px; display: flex; flex-direction: column;
      align-items: center; gap: 14px;
    }
    .empty-state .es-icon {
      width: 64px; height: 64px; border-radius: 18px; display: flex; align-items: center;
      justify-content: center; background: rgba(184,134,11,0.06); border: 1px solid rgba(184,134,11,0.08);
      font-size: 24px; color: var(--text-muted);
    }
    .empty-state h4 { font-size: 16px; color: var(--text-dim); font-weight: 600; }
    .empty-state p { font-size: 13px; color: var(--text-muted); max-width: 300px; line-height: 1.6; }

    /* ===== TOAST ===== */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
      padding: 12px 20px; border-radius: 12px; background: rgba(20,20,20,0.95);
      backdrop-filter: blur(16px); border: 1px solid rgba(184,134,11,0.15);
      color: var(--text-light); font-size: 13px; font-weight: 500; z-index: 300;
      opacity: 0; transition: all 0.4s cubic-bezier(0.25,1,0.5,1);
      display: flex; align-items: center; gap: 8px;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast i { color: var(--accent-bright); }
    .toast.success { border-color: rgba(45,125,90,0.2); }
    .toast.success i { color: var(--success); }
    .toast.error { border-color: rgba(184,92,58,0.2); }
    .toast.error i { color: var(--danger); }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      .container { padding: 10px 10px 24px; }
      .page-title { max-width: 140px; font-size: 13px; }
      .ci-title { font-size: 14px; }
      .tab-btn { font-size: 11px; padding: 9px 6px; }
      .content-card-body { padding: 16px 14px; }
      .cch-title { font-size: 13px; }
      .timer-display { font-size: 10px; }
      .cch-actions .action-btn { width: 26px; height: 26px; font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
    a:focus-visible, button:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(184,134,11,0.25); border-radius: 10px; }
  </style>
</head>
<body>

  <div class="gradient-bg"></div>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

    <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="header-left">
      <a href="#" class="back-btn" id="backBtn"><i class="fas fa-arrow-left"></i></a>
      <h1 class="page-title" id="pageTitle">Chapitre</h1>
    </div>
    <div class="header-right" id="headerNav">
      <button class="chap-nav-btn" id="prevChapBtn" title="Chapitre précédent"><i class="fas fa-chevron-left"></i></button>
      <button class="chap-nav-btn" id="nextChapBtn" title="Chapitre suivant"><i class="fas fa-chevron-right"></i></button>
    </div>
  </header>

  <!-- ===== CONTAINER ===== -->
  <main class="container">

    <!-- ===== CHAPTER INFO ===== -->
    <div class="chapter-info">
      <div class="ci-num" id="chapNum">1</div>
      <div class="ci-text">
        <div class="ci-title" id="chapTitle">Chargement...</div>
        <div class="ci-sub">
          <span id="chapSub"></span>
          <span class="ci-status" id="chapStatus">Gratuit</span>
        </div>
      </div>
      <div class="ci-progress" id="chapProgress">0%</div>
    </div>

    <!-- ===== TABS ===== -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="cours" id="tabCours">
        <i class="fas fa-book-open"></i> Chapitre
        <span class="tab-badge" id="badgeCours"></span>
      </button>
      <button class="tab-btn" data-tab="exercices" id="tabExercices">
        <i class="fas fa-pen-to-square"></i> Exercices
        <span class="tab-badge" id="badgeExercices"></span>
      </button>
      <button class="tab-btn" data-tab="corrections" id="tabCorrections">
        <i class="fas fa-check-double"></i> Corrections
        <span class="tab-badge" id="badgeCorrections"></span>
      </button>
    </div>

    <!-- ===== CARDS VIEW ===== -->
    <div class="cards-view" id="cardsView">

  // ================================================================

  // ================================================================

  function showToast(message, type = 'info') {
    toastText.textContent = message;

  // ================================================================
  // ÉTAT
  // ================================================================
  let subjectConfig = null;
  let chapters = [];
  let chapterProgress = {};
  let isPremium = false;
  let userData = null;
  let currentTab = 'cours';
  let currentParts = [];
  let currentPartIndex = -1;

  // ================================================================
  // FONCTIONS UTILITAIRES
  // ================================================================
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function computeExamCountdown() {
    const now = new Date();
    let target = new Date(now.getFullYear(), 5, 17);
    if (target < now) target = new Date(now.getFullYear() + 1, 5, 17);
    const diffMs = target - now;
    return Math.max(0, Math.ceil(diffMs / (1000 * 60 * 60 * 24)));
  }

  function getLevel(completed, total) {
    if (!total || total === 0) return '🌱 Débutant';
    const ratio = completed / total;
    if (ratio === 0) return '🌱 Débutant';
    if (ratio < 0.25) return '📖 Apprenti';
    if (ratio < 0.50) return '⚡ En progression';
    if (ratio < 0.75) return '🔥 Enflammé';
    if (ratio < 1) return '⭐ Expert';
    return '👑 Maître ARVEXA';
  }

  // ================================================================
  // NAVIGATION ENTRE CHAPITRES
  // ================================================================
  function navigateToChapter(newChap) {
    if (newChap < 0 || newChap >= chapters.length) return;
    window.location.href = 'chapitre.html?subject=' + subjectKey + '&chapter=' + newChap + '&tab=' + currentTab;
  }

  // ================================================================
  // TIMER
  // ================================================================
  let timerSeconds = 0;
  let timerInterval = null;
  let timerStartTime = null;

  function startTimer() {
    if (timerInterval) return;
    const savedTime = localStorage.getItem('arvexa_chapter_timer_' + subjectKey + '_' + chapIdx);
    if (savedTime) timerSeconds = parseInt(savedTime) || 0;
    timerStartTime = Date.now() - (timerSeconds * 1000);
    timerInterval = setInterval(() => {
      timerSeconds = Math.floor((Date.now() - timerStartTime) / 1000);
      updateTimerDisplay();
      if (timerSeconds % 30 === 0) {
        localStorage.setItem('arvexa_chapter_timer_' + subjectKey + '_' + chapIdx, timerSeconds);
        saveStudyTime(timerSeconds);
      }
    }, 1000);
    updateTimerDisplay();
  }

  function stopTimer() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
      localStorage.setItem('arvexa_chapter_timer_' + subjectKey + '_' + chapIdx, timerSeconds);
      saveStudyTime(timerSeconds);
    }
  }

  function updateTimerDisplay() {
    const display = document.getElementById('timerDisplay');
    if (display) {
      const mins = Math.floor(timerSeconds / 60);
      const secs = timerSeconds % 60;
      display.textContent = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
    }
  }

  async function saveStudyTime(seconds) {
    // Non bloquant
  }

  // ================================================================
  // PROGRESSION
  // ================================================================
  function markPartCompleted(tab, index) {
    // Sauvegarder la progression dans Firestore
    if (!userData) return;
    try {
      const progressRef = doc(db, 'users', userData.uid, 'progress', 'overall');
      updateDoc(progressRef, {
        [`subjects.${subjectKey}.chapters.progress.${chapIdx}`]: 100
      }).catch(() => {});
    } catch (e) {}
  }

  function isPartCompleted(tab, index) {
    // Pour simplifier, on utilise le progrès global du chapitre
    return chapterProgress[chapIdx] >= 100;
  }

  // ================================================================
  // CHARGEMENT DU MANIFEST (parties du chapitre)
  // ================================================================
  function loadManifest() {
    const suffix = currentTab === 'cours' ? 'cours' : (currentTab === 'exercices' ? 'exo' : 'corr');
    const manifestPath = 'cours/' + subjectKey + '/ch' + chapIdx + '_' + suffix + '.json';
    const container = document.getElementById('cardsView');
    container.innerHTML = '<div class="loading-state"><div class="spinner"></div><p>Chargement...</p></div>';

    fetch(manifestPath)
      .then(r => { if (!r.ok) throw new Error('not found'); return r.json(); })
      .then(data => {
        currentParts = data.parts || [];
        renderCards();
      })
      .catch(() => {
        currentParts = [];
        renderEmpty();
      });
  }

  function renderCards() {
    const container = document.getElementById('cardsView');
    if (currentParts.length === 0) {
      renderEmpty();
      return;
    }

    const tabLabels = { cours: 'Partie', exercices: 'Exercice', corrections: 'Correction' };
    const tabIcons = { cours: 'fa-book-open', exercices: 'fa-pen-to-square', corrections: 'fa-check-double' };
    const iconClass = { cours: '', exercices: 'exo', corrections: 'corr' };
    const label = tabLabels[currentTab] || 'Partie';
    const icon = tabIcons[currentTab] || 'fa-file';
    const ic = iconClass[currentTab] || '';

    container.innerHTML = currentParts.map((part, i) => {
      const filePath = `cours/${subjectKey}/${part.file}`;
      const completed = isPartCompleted(currentTab, i);
      const partType = currentTab === 'cours' ? 'cours' : (currentTab === 'exercices' ? 'exercices' : 'correction');

      return `
        <div class="part-card ${completed ? 'completed' : ''}" onclick="openPart(${i})">
          <div class="pc-icon ${ic} ${completed ? 'completed' : ''}">
            <i class="fas ${completed ? 'fa-check-circle' : icon}"></i>
          </div>
          <div class="pc-info">
            <div class="pc-title">${escapeHtml(part.title)} ${completed ? '✅' : ''}</div>
            <div class="pc-sub">${label} ${i + 1} — ${subjectConfig ? subjectConfig.name : ''}</div>
          </div>
          <div class="pc-arrow"><i class="fas fa-chevron-right"></i></div>
        </div>
      `;
    }).join('');

    // Mettre à jour les badges des onglets
    updateBadges();
  }

  function renderEmpty() {
    const container = document.getElementById('cardsView');
    const tabNames = { cours: 'cours', exercices: 'exercices', corrections: 'corrections' };
    container.innerHTML = `
      <div class="empty-state">
        <div class="es-icon"><i class="fas fa-folder-open"></i></div>
        <h4>Aucun ${tabNames[currentTab] || 'contenu'} disponible</h4>
        <p>Le contenu sera ajouté prochainement.</p>
      </div>
    `;
  }

  function updateBadges() {
    ['cours', 'exercices', 'corrections'].forEach(tab => {
      const badge = document.getElementById('badge' + tab.charAt(0).toUpperCase() + tab.slice(1));
      if (badge) {
        // Pour simplifier, on affiche le badge si le chapitre est terminé
        if (chapterProgress[chapIdx] >= 100) {
          badge.textContent = '✓';
          badge.className = 'tab-badge show';
        } else {
          badge.className = 'tab-badge';
        }
      }
    });
  }

  // ================================================================
  // OUVERTURE D'UNE PARTIE
  // ================================================================
  window.openPart = function(index) {
    if (index < 0 || index >= currentParts.length) return;
    currentPartIndex = index;
    const part = currentParts[index];
    const filePath = `cours/${subjectKey}/${part.file}`;

    // Afficher la vue de contenu
    document.getElementById('cardsView').classList.add('hidden');
    document.getElementById('contentView').classList.add('active');

    contentTitle.textContent = part.title;
    contentStatus.textContent = '📖 En cours';
    contentStatus.className = 'cch-status in-progress';

    // Charger le contenu
    contentBody.innerHTML = '<div class="loading-state"><div class="spinner"></div><p>Chargement du contenu...</p></div>';

    fetch(filePath)
      .then(r => { if (!r.ok) throw new Error('not found'); return r.text(); })
      .then(html => {
        contentBody.innerHTML = html;
        // Marquer comme terminé
        if (!isPartCompleted(currentTab, index)) {
          markPartCompleted(currentTab, index);
          contentStatus.textContent = '✅ Terminé';
          contentStatus.className = 'cch-status completed';
          // Recharger les cartes
          renderCards();
          showToast('✅ Partie terminée !', 'success');
        }
        startTimer();
      })
      .catch(() => {
        contentBody.innerHTML = `
          <div class="empty-state">
            <div class="es-icon"><i class="fas fa-exclamation-triangle"></i></div>
            <h4>Contenu non disponible</h4>
            <p>Le contenu de cette partie n'est pas encore disponible.</p>
          </div>
        `;
      });

    // Navigation entre parties
    setupContentNavigation();
    loadNotes();
  };

  window._backToCards = function() {
    currentPartIndex = -1;
    document.getElementById('cardsView').classList.remove('hidden');
    document.getElementById('contentView').classList.remove('active');
  };

  window._navContent = function(dir) {
    let newIdx = currentPartIndex + dir;
    if (newIdx >= 0 && newIdx < currentParts.length) {
      window.openPart(newIdx);
    }
  };

  function setupContentNavigation() {
    const prevBtn = document.getElementById('contentPrevBtn');
    const nextBtn = document.getElementById('contentNextBtn');

    if (prevBtn) {
      const newPrev = prevBtn.cloneNode(true);
      prevBtn.parentNode.replaceChild(newPrev, prevBtn);
      newPrev.disabled = currentPartIndex <= 0;
      newPrev.addEventListener('click', () => window._navContent(-1));
    }
    if (nextBtn) {
      const newNext = nextBtn.cloneNode(true);
      nextBtn.parentNode.replaceChild(newNext, nextBtn);
      newNext.disabled = currentPartIndex >= currentParts.length - 1;
      newNext.addEventListener('click', () => window._navContent(1));
    }

    const backBtn = document.getElementById('contentBackBtn');
    if (backBtn) {
      const newBack = backBtn.cloneNode(true);
      backBtn.parentNode.replaceChild(newBack, backBtn);
      newBack.addEventListener('click', window._backToCards);
    }
  }

  // ================================================================
  // NOTES
  // ================================================================
  function loadNotes() {
    const notesKey = 'arvexa_notes_' + subjectKey + '_' + chapIdx;
    const content = localStorage.getItem(notesKey) || '';
    const textarea = document.getElementById('notesTextarea');
    if (textarea) textarea.value = content;
  }

  function setupNotes() {
    const textarea = document.getElementById('notesTextarea');
    const savedEl = document.getElementById('notesSaved');
    if (!textarea) return;

    textarea.addEventListener('input', () => {
      const content = textarea.value;
      const notesKey = 'arvexa_notes_' + subjectKey + '_' + chapIdx;
      if (savedEl) savedEl.classList.remove('show');
      clearTimeout(textarea._saveTimeout);
      textarea._saveTimeout = setTimeout(() => {
        localStorage.setItem(notesKey, content);
        if (savedEl) {
          savedEl.classList.add('show');
          setTimeout(() => savedEl.classList.remove('show'), 2000);
        }
      }, 1000);
    });

    const toggleBtn = document.getElementById('notesToggleBtn');
    const notesSection = document.getElementById('notesSection');
    if (toggleBtn && notesSection) {
      toggleBtn.addEventListener('click', () => {
        notesSection.classList.toggle('show');
        toggleBtn.classList.toggle('active');
      });
    }
  }

  // ================================================================
  // MARQUE-PAGES
  // ================================================================
  function setupBookmark() {
    const btn = document.getElementById('bookmarkBtn');
    if (!btn) return;
    const bookmarkKey = 'arvexa_bookmark_' + subjectKey + '_' + chapIdx + '_' + currentTab + '_' + currentPartIndex;
    const isBookmarked = localStorage.getItem(bookmarkKey) === 'true';
    if (isBookmarked) btn.classList.add('active');

    btn.addEventListener('click', () => {
      const newState = !btn.classList.contains('active');
      btn.classList.toggle('active');
      localStorage.setItem(bookmarkKey, newState ? 'true' : 'false');
      showToast(newState ? '📌 Section marquée !' : '🔖 Marque-page retiré', 'info');
    });
  }

  // ================================================================
  // RENDU DE LA PAGE
  // ================================================================
  function renderPage() {
    if (!subjectConfig || !chapters.length) return;

    const title = chapters[chapIdx] || 'Chapitre ' + (chapIdx + 1);
    document.title = 'ARVEXA - ' + title;
    document.getElementById('pageTitle').innerHTML = '<i class="fas ' + subjectConfig.icon + '"></i> ' + title;
    document.getElementById('backBtn').href = 'matiere.html?subject=' + subjectKey;

    const isFree = chapIdx === 0;
    const statusEl = document.getElementById('chapStatus');
    const completed = chapterProgress[chapIdx] >= 100;

    document.getElementById('chapNum').textContent = chapIdx + 1;
    document.getElementById('chapNum').className = 'ci-num' + (completed ? ' completed' : '');
    document.getElementById('chapTitle').textContent = title;
    document.getElementById('chapSub').textContent = subjectConfig.name + ' — Chapitre ' + (chapIdx + 1) + ' / ' + chapters.length;
    document.getElementById('chapProgress').textContent = (chapterProgress[chapIdx] || 0) + '%';

    if (completed) {
      statusEl.textContent = '✅ Terminé';
      statusEl.className = 'ci-status completed';
    } else if (isFree) {
      statusEl.textContent = '🎁 Gratuit';
      statusEl.className = 'ci-status free';
    } else if (isPremium) {
      statusEl.textContent = '👑 Premium';
      statusEl.className = 'ci-status premium';
    } else {
      statusEl.textContent = '🔒 Verrouillé';
      statusEl.className = 'ci-status locked';
    }

    // Navigation entre chapitres
    const prevBtn = document.getElementById('prevChapBtn');
    const nextBtn = document.getElementById('nextChapBtn');
    if (prevBtn) {
      const newPrev = prevBtn.cloneNode(true);
      prevBtn.parentNode.replaceChild(newPrev, prevBtn);
      newPrev.disabled = chapIdx <= 0;
      newPrev.addEventListener('click', () => navigateToChapter(chapIdx - 1));
    }
    if (nextBtn) {
      const newNext = nextBtn.cloneNode(true);
      nextBtn.parentNode.replaceChild(newNext, nextBtn);
      newNext.disabled = chapIdx >= chapters.length - 1;
      newNext.addEventListener('click', () => navigateToChapter(chapIdx + 1));
    }

    // Tabs
    document.querySelectorAll('.tab-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === currentTab);
    });

    // Charger le manifest
    loadManifest();
  }

  // ================================================================
  // TABS
  // ================================================================
  function setupTabs() {
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;
        if (tab === currentTab) return;
        if (currentPartIndex >= 0) window._backToCards();
        currentTab = tab;
        const url = new URL(window.location);
        url.searchParams.set('tab', tab);
        window.history.pushState({}, '', url);
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
        loadManifest();
      });
    });
  }

  // ================================================================
  // CHARGEMENT DES DONNÉES
  // ================================================================
  function loadSubjectData() {
    // Essayer le cache
    try {
      const cached = localStorage.getItem('arvexa_subject_' + subjectKey);
      if (cached) {
        const data = JSON.parse(cached);
        subjectConfig = data.subjectConfig;
        chapters = data.chapters;
        renderPage();
        return;
      }
    } catch (e) {}

    // Fallback
    const defaultData = SUBJECTS_CONFIG[subjectKey];
    if (defaultData) {
      subjectConfig = {
        name: defaultData.name,
        icon: defaultData.icon,
        color: defaultData.color
      };
      chapters = DEFAULT_CHAPTERS[subjectKey] || [];
      renderPage();
    } else {
      window.location.replace('index.html');
    }
  }

  // ================================================================
  // ⭐ VÉRIFICATION D'AUTH - UNE SEULE FOIS (SANS BOUCLE)
  // ================================================================
  let authChecked = false;
  let isRedirecting = false;

  onAuthStateChanged(auth, (user) => {
    if (authChecked) return;
    authChecked = true;

    if (user) {
      saveSession(user);
      console.log('📖 Chapitre - Utilisateur:', user.uid);
      userData = user;

      // Charger les données utilisateur
      getDoc(doc(db, 'users', user.uid)).then((docSnap) => {
        if (docSnap.exists()) {
          userData = docSnap.data();
          isPremium = userData.premium === true || userData.isUnlocked === true || userData.hasDeposited === true;
        }
        // Charger la progression
        getDoc(doc(db, 'users', user.uid, 'progress', 'overall')).then((progressSnap) => {
          if (progressSnap.exists()) {
            const data = progressSnap.data();
            if (data.subjects && data.subjects[subjectKey]) {
              const subjectProgress = data.subjects[subjectKey];
              if (subjectProgress.chapters && subjectProgress.chapters.progress) {
                chapterProgress = subjectProgress.chapters.progress || {};
              }
            }
          }
          loadSubjectData();
        }).catch(() => loadSubjectData());
      }).catch(() => loadSubjectData());

    } else {
      if (isRedirecting) return;
      isRedirecting = true;
      clearSession();
      console.log('🔒 Non connecté, redirection vers login');
      sessionStorage.setItem('redirectAfterLogin', window.location.pathname);
      window.location.href = 'login.html';
    }
  });

  // ================================================================
