<style>
  :root {
    --primary: #1A3A2A; --primary-dark: #0A1A12; --primary-light: #2A5A3A;
    --accent: #B8860B; --accent-bright: #E0B84A; --accent-dim: rgba(184,134,11,0.08);
    --success: #2D7D5A; --danger: #B85C3A; --warning: #D4A017;
    --bg-dark: #0A0A0A; --bg-surface: #141414; --bg-card: rgba(20,20,20,0.7);
    --text-light: #F5F0E8; --text-dim: #8A8A7A; --text-muted: #5A5A4A;
    --card-border: rgba(184,134,11,0.08);
    --transition: all 0.3s cubic-bezier(0.25,1,0.5,1);
    --shadow: 0 8px 32px rgba(0,0,0,0.4); --radius: 16px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth;width:100%;overflow-x:hidden}
  body{
    font-family:'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif;
    background:var(--bg-dark);color:var(--text-light);font-size:14px;line-height:1.6;
    min-height:100vh;width:100%;overflow-x:hidden;-webkit-overflow-scrolling:touch;
    display:flex;flex-direction:column;
  }
  .gradient-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-2;
    background:radial-gradient(ellipse 40% 30% at 30% 15%,rgba(26,58,42,.16) 0%,transparent 70%),
                radial-gradient(ellipse 35% 25% at 75% 85%,rgba(184,134,11,.05) 0%,transparent 60%),
                linear-gradient(180deg,#0A0A0A 0%,#060606 100%)}
  .glow{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:-1;
    opacity:.15;animation:glowMove 10s ease-in-out infinite alternate}
  .glow-1{width:300px;height:300px;background:rgba(26,58,42,.18);top:-80px;right:-80px}
  .glow-2{width:180px;height:180px;background:rgba(184,134,11,.05);bottom:0;left:0;animation-delay:-4s}
  @keyframes glowMove{0%{transform:translate(0,0) scale(1)}100%{transform:translate(30px,-20px) scale(1.1)}}

  /* HEADER */
  .header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
    padding:10px 16px;background:rgba(10,10,10,.92);backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(184,134,11,.06);gap:12px;min-height:56px}
  .header-left{display:flex;align-items:center;gap:12px}
  .back-btn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;
    border:1px solid rgba(255,255,255,.05);background:transparent;color:var(--text-dim);cursor:pointer;
    transition:var(--transition);font-size:16px;text-decoration:none}
  .back-btn:hover{border-color:rgba(184,134,11,.14);color:var(--text-light)}
  .page-title{font-size:15px;font-weight:600;color:var(--text-light);font-family:'Playfair Display',serif}
  .page-title i{color:var(--accent-bright);margin-right:6px;font-size:14px}
  .header-right{display:flex;align-items:center;gap:8px}

  /* CONTAINER */
  .container{max-width:600px;margin:0 auto;padding:12px 12px 32px;width:100%;display:flex;flex-direction:column;gap:12px;flex:1}

  /* SUBJECT HERO */
  .subject-hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:20px 16px 16px;gap:10px}
  .subject-icon-wrap{width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;
    font-size:26px;position:relative}
  .subject-icon-wrap::before{content:'';position:absolute;inset:-3px;border-radius:21px;
    background:linear-gradient(135deg,var(--accent),var(--success));opacity:.25;z-index:-1}
  .subject-hero h2{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--text-light)}
  .subject-hero .subject-subtitle{font-size:12px;color:var(--text-dim)}

  /* HERO STATS */
  .hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:380px;margin-top:4px}
  .hero-stat{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);border-radius:10px;padding:8px 6px;text-align:center}
  .hero-stat-value{display:block;font-size:16px;font-weight:700;font-family:'Playfair Display',serif;color:var(--accent-bright);line-height:1.3}
  .hero-stat-label{font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.3px;font-weight:600}

  /* SECTION LABEL */
  .section-label{font-size:11px;font-weight:700;color:var(--accent-bright);text-transform:uppercase;
    letter-spacing:1px;padding:6px 4px 0;display:flex;align-items:center;gap:8px}
  .section-label::after{content:'';flex:1;height:1px;background:rgba(184,134,11,.1)}

  /* CHAPTER LIST */
  .chapter-list{display:flex;flex-direction:column;gap:8px;padding-bottom:16px}

  /* CHAPTER CARD — SIMPLE */
  .chapter-card{background:var(--bg-card);backdrop-filter:blur(10px);border:1px solid var(--card-border);
    border-radius:var(--radius);padding:14px 16px;cursor:pointer;transition:var(--transition);
    text-decoration:none;color:inherit}
  .chapter-card:hover{border-color:rgba(184,134,11,.15);transform:translateY(-1px)}
  .chapter-card:active{transform:scale(.98)}
  .chapter-card.locked{opacity:.6}
  .chapter-card.locked:hover{opacity:.8}

  .cc-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .cc-left{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
  .cc-num{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;flex-shrink:0;font-family:'Playfair Display',serif;
    background:rgba(184,134,11,.08);color:var(--accent-bright);border:1px solid rgba(184,134,11,.08)}
  .cc-info{display:flex;flex-direction:column;gap:1px;min-width:0}
  .cc-title{font-size:14px;font-weight:600;color:var(--text-light);line-height:1.3;
    display:flex;align-items:center;flex-wrap:wrap;gap:4px}
  .cc-chapter-label{font-size:11px;color:var(--text-muted)}
  .cc-arrow{display:flex;align-items:center;justify-content:center;width:26px;height:26px;
    border-radius:8px;background:rgba(255,255,255,.03);color:var(--text-muted);flex-shrink:0;
    transition:var(--transition);font-size:11px}
  .chapter-card:hover .cc-arrow{color:var(--accent-bright);background:rgba(184,134,11,.08)}

  /* BADGES */
  .badge-free{display:inline-block;font-size:10px;color:var(--success);background:rgba(45,125,90,.1);
    padding:0 6px;border-radius:10px;border:1px solid rgba(45,125,90,.12)}
  .badge-locked{display:inline-block;font-size:10px;color:var(--accent-bright);background:rgba(184,134,11,.1);
    padding:0 6px;border-radius:10px;border:1px solid rgba(184,134,11,.12)}

  /* SKELETON */
  .skeleton{background:linear-gradient(90deg,rgba(255,255,255,.03) 25%,rgba(255,255,255,.06) 50%,rgba(255,255,255,.03) 75%);
    background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .skeleton-card{height:80px;border-radius:var(--radius)}

  /* TOAST */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);
    padding:12px 20px;border-radius:12px;background:rgba(20,20,20,.95);backdrop-filter:blur(16px);
    border:1px solid rgba(184,134,11,.15);color:var(--text-light);font-size:13px;font-weight:500;
    z-index:300;opacity:0;transition:all .4s cubic-bezier(.25,1,.5,1);display:flex;align-items:center;gap:8px}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .toast i{color:var(--accent-bright)}

  /* ============================================================
     POPUP PREMIUM
     ============================================================ */
  .premium-popup-overlay{position:fixed;top:0;left:0;right:0;bottom:0;
    background:rgba(0,0,0,.85);backdrop-filter:blur(16px);z-index:9999;
    display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;
    transition:all .4s ease;padding:16px}
  .premium-popup-overlay.show{opacity:1;visibility:visible}
  .premium-popup-overlay.hide{opacity:0;visibility:hidden}

  .premium-popup{background:linear-gradient(145deg,#141414,#0A0A0A);border:1px solid var(--accent);
    border-radius:var(--radius);padding:24px 20px;max-width:380px;width:100%;
    transform:scale(.9) translateY(30px);transition:transform .5s cubic-bezier(.34,1.56,.64,1);
    box-shadow:0 20px 60px rgba(0,0,0,.6);position:relative;overflow:hidden;max-height:90vh;overflow-y:auto}
  .premium-popup-overlay.show .premium-popup{transform:scale(1) translateY(0)}
  .premium-popup::-webkit-scrollbar{width:2px}
  .premium-popup::-webkit-scrollbar-thumb{background:var(--accent);border-radius:4px}
  .premium-popup::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,var(--accent),var(--success),var(--accent))}
  .premium-popup .popup-close{position:absolute;top:8px;right:8px;width:28px;height:28px;
    background:rgba(255,255,255,.03);border:1px solid rgba(184,134,11,.06);border-radius:8px;
    color:var(--text-dim);cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;
    transition:var(--transition)}
  .premium-popup .popup-close:hover{border-color:rgba(184,134,11,.15);color:var(--text-light)}
  .premium-popup .popup-icon{font-size:32px;display:block;text-align:center;margin-bottom:4px}
  .premium-popup h2{font-size:18px;font-weight:700;font-family:'Playfair Display','Georgia',serif;
    color:var(--text-light);text-align:center;margin-bottom:2px}
  .premium-popup h2 span{color:var(--accent);font-style:italic}
  .premium-popup .popup-subtitle{font-size:11px;color:var(--text-dim);text-align:center;line-height:1.4;margin-bottom:12px}
  .premium-popup .popup-subtitle strong{color:var(--accent)}

  .offers-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .offer-card{background:rgba(255,255,255,.02);border:1px solid var(--card-border);border-radius:10px;
    padding:10px 8px;text-align:center;transition:var(--transition)}
  .offer-card:hover{border-color:rgba(184,134,11,.12)}
  .offer-card.popular{border-color:var(--accent);background:rgba(184,134,11,.04);position:relative}
  .offer-card.popular::before{content:'⭐';position:absolute;top:-6px;right:6px;font-size:10px}
  .offer-card .offer-name{font-size:10px;font-weight:600;color:var(--text-light)}
  .offer-card .offer-price{font-size:16px;font-weight:700;font-family:'Playfair Display',serif;color:var(--accent);margin:1px 0}
  .offer-card .offer-price small{font-size:10px;font-weight:400;color:var(--text-muted)}
  .offer-card .offer-save{font-size:8px;color:var(--success);background:rgba(45,125,90,.08);padding:1px 6px;border-radius:8px;display:inline-block}
  .offer-card .offer-desc{font-size:8px;color:var(--text-muted);margin-top:2px}

  .promo-code-section{background:rgba(184,134,11,.03);border:1px dashed rgba(184,134,11,.08);
    border-radius:8px;padding:8px 12px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;
    gap:6px;flex-wrap:wrap}
  .promo-code-section .promo-label{font-size:9px;color:var(--text-muted);display:flex;align-items:center;gap:4px}
  .promo-code-section .promo-label i{color:var(--accent);font-size:9px}
  .promo-code-section .promo-code{font-size:11px;font-weight:700;color:var(--accent);background:rgba(184,134,11,.06);padding:1px 8px;border-radius:4px;letter-spacing:1px}
  .promo-code-section .promo-discount{font-size:9px;color:var(--success);font-weight:600}

  .premium-popup .popup-buttons{display:flex;flex-direction:column;gap:6px}
  .premium-popup .popup-buttons .btn-subscribe{padding:10px;border:none;border-radius:10px;
    background:var(--accent);color:var(--bg-dark);font-weight:700;font-size:14px;cursor:pointer;
    text-decoration:none;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px;
    font-family:'Inter',sans-serif}
  .premium-popup .popup-buttons .btn-subscribe:hover{background:#9A7209;box-shadow:0 0 20px rgba(184,134,11,.15)}
  .premium-popup .popup-buttons .btn-subscribe:active{transform:scale(.96)}
  .premium-popup .popup-buttons .btn-later{padding:8px;background:transparent;border:none;
    color:var(--text-muted);font-size:11px;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif;font-weight:400}
  .premium-popup .popup-buttons .btn-later:hover{color:var(--text-dim)}

  /* RESPONSIVE */
  @media(max-width:480px){
    .container{padding:10px 10px 24px}
    .subject-hero h2{font-size:18px}
    .subject-icon-wrap{width:56px;height:56px;font-size:22px}
    .hero-stats{gap:6px}
    .hero-stat-value{font-size:14px}
    .cc-title{font-size:13px}
    .cc-num{width:30px;height:30px;font-size:12px}
    .premium-popup{padding:18px 14px;max-width:340px}
    .premium-popup h2{font-size:16px}
    .offers-grid{gap:6px}
    .offer-card{padding:8px 6px}
    .offer-card .offer-price{font-size:14px}
    .promo-code-section{padding:6px 10px}
  }
  @media(max-width:360px){
    .hero-stats{grid-template-columns:repeat(3,1fr);gap:4px}
    .cc-title{font-size:12px}
    .offers-grid{grid-template-columns:1fr}
  }
</style>
</head>

let chapters = [];
let unsubscribeSubject = null;

// ================================================================
// POPUP PREMIUM
// ================================================================
window.showPremiumPopup = function() {
  const popup = document.getElementById('premiumPopup');
  if (popup) {
    popup.classList.remove('hide');
    popup.classList.add('show');
    document.body.style.overflow = 'hidden';
  }
};

function hidePremiumPopup() {
  const popup = document.getElementById('premiumPopup');
  if (popup) {
    popup.classList.remove('show');
    popup.classList.add('hide');
    document.body.style.overflow = '';
  }
}

function initPopupListeners() {
  const popupLaterBtn = document.getElementById('popupLaterBtn');
  const popupCloseBtn = document.getElementById('popupCloseBtn');
  const premiumPopup = document.getElementById('premiumPopup');
  
  if (popupLaterBtn) {
    const newBtn = popupLaterBtn.cloneNode(true);
    popupLaterBtn.parentNode.replaceChild(newBtn, popupLaterBtn);
    newBtn.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      hidePremiumPopup();
    });
  }
  
  if (popupCloseBtn) {
    const newBtn = popupCloseBtn.cloneNode(true);
    popupCloseBtn.parentNode.replaceChild(newBtn, popupCloseBtn);
    newBtn.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      hidePremiumPopup();
    });
  }
  
  if (premiumPopup) {
    premiumPopup.addEventListener('click', function(e) {
      if (e.target === premiumPopup) hidePremiumPopup();
    });
  }
  
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') hidePremiumPopup();
  });
}

document.addEventListener('DOMContentLoaded', initPopupListeners);
setTimeout(initPopupListeners, 500);

// ================================================================
// NAVIGATION
// ================================================================
window.navigateToChapter = function(chapterIndex) {
  const chapter = chapters[chapterIndex];
  if (!chapter) return;
  
  // Vérifier si le chapitre est gratuit ou si l'utilisateur est premium
  if (!chapter.isFree && !isPremium) {
    window.showPremiumPopup();
    return;
  }
  
  window.location.href = 'chapitre.html?subject=' + subjectKey + '&chapter=' + chapterIndex;
};

// ================================================================
// EXAM COUNTDOWN
// ================================================================
function computeExamCountdown() {
  const now = new Date();
  let target = new Date(now.getFullYear(), 5, 17); // 17 juin
  if (target < now) {
    target = new Date(now.getFullYear() + 1, 5, 17);
  }
  const diffMs = target - now;
  return Math.max(0, Math.ceil(diffMs / (1000 * 60 * 60 * 24)));
}

// ================================================================
// RENDER
// ================================================================
function renderPage() {
  if (!subjectConfig) return;
  
  // Page title
  document.querySelector('#pageTitle span').textContent = subjectConfig.name;
  document.getElementById('pageTitle').querySelector('i').className = 'fas ' + subjectConfig.icon;
  document.title = 'ARVEXA School - ' + subjectConfig.name;

  // Hero
  const iconWrap = document.getElementById('subjectIconWrap');
  iconWrap.innerHTML = '<i class="fas ' + subjectConfig.icon + '"></i>';
  iconWrap.style.background = subjectConfig.color + '12';
  iconWrap.style.color = subjectConfig.color;
  document.getElementById('subjectTitle').textContent = subjectConfig.name;
  document.getElementById('subjectSubtitle').textContent = 
    chapters.length + ' chapitres — Terminale D BAC';

  // Stats
  updateHeroStats();
  
  // Chapitres
  renderChapters();
}

function updateHeroStats() {
  const total = chapters.length;
  const unlocked = isPremium ? total : (chapters.filter(c => c.isFree).length || 1);
  const ratio = unlocked / total;
  
  // Niveau
  const heroLevel = document.getElementById('heroLevel');
  if (heroLevel) {
    let level;
    if (ratio === 0) level = '🌱 Débutant';
    else if (ratio < 0.25) level = '📖 Apprenti';
    else if (ratio < 0.50) level = '⚡ En progression';
    else if (ratio < 0.75) level = '🔥 Enflammé';
    else if (ratio < 1) level = '⭐ Expert';
    else level = '👑 Maître ARVEXA';
    heroLevel.textContent = level;
  }
  
  // Chapitres
  const heroChapters = document.getElementById('heroChapters');
  if (heroChapters) {
    heroChapters.textContent = `${unlocked}/${total}`;
  }
  
  // Minuteur
  const heroTimer = document.getElementById('heroTimer');
  if (heroTimer) {
    const days = computeExamCountdown();
    heroTimer.textContent = days > 0 ? `${days}j` : '🎯 BAC!';
  }
}

function renderChapters() {
  const list = document.getElementById('chapterList');
  if (!list) return;

  let html = '';
  chapters.forEach((chap, index) => {
    const isFree = chap.isFree === true;
    const isLocked = !isPremium && !isFree;

    html += `
      <div class="chapter-card ${isLocked ? 'locked' : ''}" 
           onclick="${isLocked ? 'window.showPremiumPopup()' : `navigateToChapter(${index})`}">
        <div class="cc-top">
          <div class="cc-left">
            <div class="cc-num">${index + 1}</div>
            <div class="cc-info">
              <div class="cc-title">
                ${escapeHtml(chap.title)}
                ${isLocked ? ' <span class="badge-locked">🔒</span>' : ''}
                ${isFree ? ' <span class="badge-free">🎁</span>' : ''}
              </div>
              <div class="cc-chapter-label">${subjectConfig.name} — Chapitre ${index + 1}</div>
            </div>
          </div>
          <div class="cc-arrow"><i class="fas fa-chevron-right"></i></div>
        </div>
      </div>
    `;
  });

  list.innerHTML = html;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ================================================================
// CHARGER LES DONNÉES DEPUIS FIRESTORE
// ================================================================
function loadSubjectData() {
  if (!subjectKey) return;
  
  // Essayer d'abord Firestore
  const subjectRef = doc(db, 'subjects', subjectKey);
  
  unsubscribeSubject = onSnapshot(subjectRef, (snap) => {
    if (snap.exists()) {
      const data = snap.data();
      subjectConfig = {
        name: data.name || DEFAULT_SUBJECTS[subjectKey]?.name || subjectKey,
        icon: data.icon || DEFAULT_SUBJECTS[subjectKey]?.icon || 'fa-book',
        color: data.color || DEFAULT_SUBJECTS[subjectKey]?.color || '#B8860B'
      };
      chapters = data.chapters || DEFAULT_SUBJECTS[subjectKey]?.chapters || [];
    } else {
      // Fallback vers les données par défaut
      const defaultData = DEFAULT_SUBJECTS[subjectKey];
      if (defaultData) {
        subjectConfig = {
          name: defaultData.name,
          icon: defaultData.icon,
          color: defaultData.color
        };
        chapters = defaultData.chapters;
      } else {
        // Matière inconnue
        window.location.replace('index.html');
        return;
      }
    }
    
    renderPage();
  }, (error) => {
    console.warn('⚠️ Erreur Firestore, utilisation des données par défaut:', error);
    const defaultData = DEFAULT_SUBJECTS[subjectKey];
    if (defaultData) {
      subjectConfig = {
        name: defaultData.name,
        icon: defaultData.icon,
        color: defaultData.color
      };
      chapters = defaultData.chapters;
      renderPage();
    } else {
      window.location.replace('index.html');
    }
  });
}

// ================================================================
// PROTECTION + INIT
// ================================================================
protectPage(async (user) => {
  console.log('[Matière] Connecté:', user.uid);
  
  try {
    const userDoc = await getDoc(doc(db, 'users', user.uid));
    if (userDoc.exists()) {
      userData = userDoc.data();
      isPremium = userData.isUnlocked === true || userData.hasDeposited === true;
      
      // Afficher le popup premium après 2s si non premium
      if (!isPremium) {
        setTimeout(() => {
          if (!userData.isUnlocked && !userData.hasDeposited) {
            // Ne pas afficher si l'utilisateur est sur le chapitre 1
            // Le popup s'affichera uniquement sur les chapitres verrouillés
          }
        }, 2000);
      }
    }
  } catch(e) {
    console.log('[Matière] Erreur chargement user:', e);
  }
  
  // Charger les données de la matière
  loadSubjectData();
});
