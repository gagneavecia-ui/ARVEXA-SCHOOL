<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="description" content="ARVEXA School - Bienvenue">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png" type="image/png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #1A3A2A;
      --accent: #B8860B;
      --accent-bright: #E0B84A;
      --success: #2D7D5A;
      --danger: #B85C3A;
      --bg-dark: #0A0A0A;
      --bg-card: rgba(20, 20, 20, 0.7);
      --text-light: #F5F0E8;
      --text-dim: #8A8A7A;
      --text-muted: #5A5A4A;
      --card-border: rgba(184, 134, 11, 0.06);
      --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --radius: 16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; width: 100%; overflow-x: hidden; }
    body {
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      width: 100%;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px 40px;
    }

    .gradient-bg {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
      background: radial-gradient(ellipse 40% 30% at 30% 20%, rgba(26, 58, 42, 0.12) 0%, transparent 70%),
                  radial-gradient(ellipse 30% 20% at 70% 80%, rgba(184, 134, 11, 0.02) 0%, transparent 60%),
                  linear-gradient(180deg, #0A0A0A 0%, #060606 100%);
    }
    .glow {
      position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: -1;
      opacity: 0.15; animation: glowMove 10s ease-in-out infinite alternate;
    }
    .glow-1 { width: 350px; height: 350px; background: rgba(26,58,42,0.15); top: -80px; right: -80px; }
    .glow-2 { width: 200px; height: 200px; background: rgba(184,134,11,0.03); bottom: 0; left: 0; animation-delay: -4s; }
    @keyframes glowMove { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(30px,-20px) scale(1.1); } }

    .onboarding-container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      animation: fadeInUp 0.6s ease-out;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .onboarding-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 32px 26px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      text-align: center;
    }
    .onboarding-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent-bright), var(--accent));
    }

    .header { margin-bottom: 20px; }
    .header .icon-big {
      font-size: clamp(48px, 8vw, 64px);
      display: block;
      margin-bottom: 6px;
      animation: iconBounce 2s ease-in-out infinite;
    }
    @keyframes iconBounce {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(5deg); }
    }
    .header .logo {
      font-size: clamp(20px, 3vw, 26px);
      font-weight: 700;
      font-family: 'Playfair Display', Georgia, serif;
      color: var(--text-light);
      letter-spacing: 1px;
    }
    .header .logo span {
      background: linear-gradient(90deg, var(--accent), var(--accent-bright), var(--accent));
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-style: italic;
      animation: shimmerText 4s linear infinite;
    }
    @keyframes shimmerText { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
    .header .subtitle {
      font-size: clamp(13px, 1.6vw, 14px);
      color: var(--text-dim);
      margin-top: 4px;
      font-weight: 300;
    }

    .user-info {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      padding: 16px 20px;
      margin: 16px 0 14px;
      transition: var(--transition);
      opacity: 0;
      animation: fadeInUp 0.5s ease-out 0.2s forwards;
    }
    .user-info .user-name {
      font-size: clamp(17px, 2.2vw, 20px);
      font-weight: 600;
      color: var(--text-light);
    }
    .user-info .user-email {
      font-size: clamp(12px, 1.4vw, 13px);
      color: var(--text-dim);
      margin-top: 2px;
      word-break: break-all;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 12px 0 18px;
      opacity: 0;
      animation: fadeInUp 0.5s ease-out 0.3s forwards;
    }
    .stat-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 10px;
      padding: 12px 8px;
      transition: var(--transition);
    }
    .stat-item:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(184, 134, 11, 0.06);
    }
    .stat-item .si-icon {
      font-size: clamp(18px, 2.5vw, 22px);
      display: block;
      margin-bottom: 2px;
    }
    .stat-item .si-label {
      font-size: clamp(9px, 1vw, 10px);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 500;
    }
    .stat-item .si-value {
      font-size: clamp(13px, 1.6vw, 15px);
      font-weight: 600;
      color: var(--text-light);
      margin-top: 2px;
    }

    .subjects-tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin: 10px 0 18px;
      opacity: 0;
      animation: fadeInUp 0.5s ease-out 0.4s forwards;
    }
    .subjects-tags .tag {
      background: rgba(184, 134, 11, 0.06);
      border: 1px solid rgba(184, 134, 11, 0.08);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: clamp(10px, 1.2vw, 11px);
      color: var(--accent-bright);
      font-weight: 500;
      transition: var(--transition);
      white-space: nowrap;
    }
    .subjects-tags .tag:hover {
      background: rgba(184, 134, 11, 0.12);
      transform: translateY(-2px);
    }

    .features-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 16px 0 20px;
      text-align: left;
      opacity: 0;
      animation: fadeInUp 0.5s ease-out 0.5s forwards;
    }
    .feature-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 10px;
      transition: var(--transition);
    }
    .feature-item:hover {
      background: rgba(184, 134, 11, 0.04);
      border-color: rgba(184, 134, 11, 0.08);
      transform: translateX(4px);
    }
    .feature-item .fi-icon {
      font-size: 18px;
      flex-shrink: 0;
    }
    .feature-item .fi-text {
      font-size: clamp(12px, 1.4vw, 13px);
      color: var(--text-light);
      font-weight: 500;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, var(--accent-bright), var(--accent));
      color: #0A0A0A;
      font-size: clamp(15px, 1.8vw, 16px);
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(184, 134, 11, 0.15);
      min-height: 52px;
      opacity: 0;
      animation: fadeInUp 0.5s ease-out 0.6s forwards;
    }
    .btn-primary::after {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255,255,255,0.05), transparent);
      transform: rotate(45deg) translateX(-100%);
      transition: transform 0.6s ease;
    }
    .btn-primary:hover:not(:disabled)::after { transform: rotate(45deg) translateX(100%); }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 30px rgba(184, 134, 11, 0.3);
    }
    .btn-primary:active:not(:disabled) { transform: scale(0.97); }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .btn-primary .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(10, 10, 10, 0.15);
      border-top-color: #0A0A0A;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .btn-primary.loading .spinner { display: block; }
    .btn-primary.loading .btn-text { display: none; }
    .btn-primary.loading .btn-icon { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .secure {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 14px;
      opacity: 0;
      animation: fadeInUp 0.5s ease-out 0.7s forwards;
    }
    .secure i { color: var(--success); margin-right: 4px; }

    .countdown-mini {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 20px;
      background: rgba(184, 134, 11, 0.06);
      border: 1px solid rgba(184, 134, 11, 0.1);
      font-size: 12px;
      color: var(--text-dim);
      margin: 0 auto 16px;
      width: fit-content;
      opacity: 0;
      animation: fadeInUp 0.5s ease-out 0.35s forwards;
    }
    .countdown-mini strong {
      color: var(--accent-bright);
      font-family: 'Playfair Display', serif;
      font-size: 15px;
      font-weight: 700;
    }

    .skeleton {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.8; } }
    .skeleton-text { height: 16px; margin: 4px 0; }
    .skeleton-name { height: 24px; width: 60%; margin: 0 auto; }
    .skeleton-email { height: 14px; width: 70%; margin: 4px auto; }
    .skeleton-stat { height: 60px; border-radius: 10px; }
    .skeleton-tag { height: 26px; width: 80px; border-radius: 20px; }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      padding: 14px 24px;
      border-radius: 12px;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      color: var(--text-light);
      font-size: 13px;
      font-weight: 500;
      z-index: 300;
      opacity: 0;
      transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      max-width: 90%;
      text-align: center;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: rgba(45, 125, 90, 0.2); }
    .toast.error { border-color: rgba(184, 92, 58, 0.3); }
    .toast .toast-icon { font-size: 16px; }
    .toast.success .toast-icon { color: var(--success); }
    .toast.error .toast-icon { color: var(--danger); }

    @media (max-width: 640px) {
      body { padding: 16px 12px 30px; }
      .onboarding-card { padding: 24px 18px; }
      .user-info { padding: 14px 16px; margin: 12px 0; }
      .stats-grid { gap: 6px; }
      .stat-item { padding: 10px 6px; }
      .btn-primary { padding: 12px; min-height: 48px; }
    }

    @media (max-width: 480px) {
      .onboarding-card { padding: 20px 16px; }
      .stat-item { padding: 8px 4px; }
      .stat-item .si-icon { font-size: 18px; }
      .stat-item .si-value { font-size: 13px; }
      .subjects-tags { gap: 4px; }
      .subjects-tags .tag { padding: 3px 10px; font-size: 10px; }
      .btn-primary { font-size: 14px; padding: 10px; min-height: 44px; }
      .secure { font-size: 10px; margin-top: 10px; }
      .feature-item { padding: 8px 12px; }
      .feature-item .fi-icon { font-size: 16px; }
      .feature-item .fi-text { font-size: 12px; }
    }

    @media (max-width: 360px) {
      body { padding: 12px 8px 24px; }
      .onboarding-card { padding: 16px 12px; border-radius: 12px; }
      .header .icon-big { font-size: 40px; }
      .header .logo { font-size: 18px; }
      .header .subtitle { font-size: 12px; }
      .user-info .user-name { font-size: 15px; }
      .user-info .user-email { font-size: 11px; }
      .stats-grid { gap: 4px; }
      .stat-item { padding: 6px 4px; }
      .stat-item .si-icon { font-size: 16px; }
      .stat-item .si-label { font-size: 8px; }
      .stat-item .si-value { font-size: 12px; }
      .subjects-tags .tag { font-size: 9px; padding: 2px 8px; }
      .btn-primary { font-size: 13px; padding: 8px; min-height: 40px; }
      .countdown-mini { font-size: 11px; padding: 6px 12px; }
      .countdown-mini strong { font-size: 13px; }
    }

    @media (min-width: 768px) {
      .onboarding-container { max-width: 520px; }
      .onboarding-card { padding: 40px 36px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    a:focus-visible, button:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 6px;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(184, 134, 11, 0.25); border-radius: 10px; }
  </style>
</head>
<body>

<div class="gradient-bg"></div>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>

<div class="onboarding-container">
  <div class="onboarding-card">

    <div id="skeletonLoading">
      <div style="width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,0.03);margin:0 auto 8px;"></div>
      <div class="skeleton skeleton-text" style="width:150px;margin:0 auto;"></div>
      <div class="skeleton skeleton-text" style="width:200px;margin:4px auto;"></div>

<div class="toast" id="toast">
  <span class="toast-icon"><i class="fas fa-check-circle"></i></span>
  <span class="toast-message"></span>

<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js"
  }

</script>

<script type="module">
// ================================================================
// ONBOARDING — Sans limite d'appareils
// ================================================================

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence,
  getIdToken
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
import {
  getFirestore,
  doc,
  getDoc,
  updateDoc,
  addDoc,
  collection,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDHscOXw3rLuhV6z1Cny-bdYCumqpnG7QE",
  authDomain: "arvexa-fbf10.firebaseapp.com",
  projectId: "arvexa-fbf10",
  storageBucket: "arvexa-fbf10.firebasestorage.app",
  messagingSenderId: "920108330053",
  appId: "1:920108330053:web:f532d71cbc2c824bc7472c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

try {
  await setPersistence(auth, browserLocalPersistence);
} catch (e) {}

// ================================================================
// DOM
// ================================================================
const skeletonLoading = document.getElementById('skeletonLoading');
const dynamicContent = document.getElementById('dynamicContent');
const startBtn = document.getElementById('startBtn');
const userName = document.getElementById('userName');
const userEmail = document.getElementById('userEmail');
const cdDays = document.getElementById('cdDays');

const toast = document.getElementById('toast');
const toastMessage = document.querySelector('.toast-message');
const toastIcon = document.querySelector('.toast-icon i');

// ================================================================
// SESSION / CACHE
// ================================================================
const USER_DATA_KEY = 'arvexa_user_data';
const SESSION_KEY = 'arvexa_session';

function clearSession() {
  try {
    localStorage.removeItem(SESSION_KEY);
    sessionStorage.removeItem(SESSION_KEY);
    localStorage.removeItem(USER_DATA_KEY);
  } catch (e) {}
}

function getCachedUserData(currentUid) {
  try {
    const cached = JSON.parse(localStorage.getItem(USER_DATA_KEY) || 'null');
    if (!cached) return null;
    if (cached._uid && cached._uid !== currentUid) {
      localStorage.removeItem(USER_DATA_KEY);
      return null;
    }
    return cached;
  } catch (e) {
    return null;
  }
}

function saveUserDataToCache(data, uid) {
  try {
    localStorage.setItem(USER_DATA_KEY, JSON.stringify({
      ...data,
      _cachedAt: Date.now(),
      _uid: uid
    }));
  } catch (e) {}
}

// ================================================================
// COMPTE À REBOURS
// ================================================================
function getExamDate() {
  const now = new Date();
  const year = now.getFullYear();
  const juneThisYear = new Date(year, 5, 1);
  if (now < juneThisYear) return juneThisYear;
  return new Date(year + 1, 5, 1);
}

function updateCountdown() {
  const now = new Date();
  const exam = getExamDate();
  const diffMs = exam - now;
  const days = Math.max(0, Math.ceil(diffMs / (1000 * 60 * 60 * 24)));
  cdDays.textContent = days;
}

// ================================================================
// VÉRIFICATION COMPTE
// ================================================================
function isAccountAccessible(data) {
  if (!data) return true;
  const status = data.accountStatus || 'active';
  return status !== 'blocked' && status !== 'paused';
}

// ================================================================
// TOAST
// ================================================================
function showToast(message, type = 'success') {
  toastMessage.textContent = message;
  toast.className = `toast ${type}`;
  toastIcon.className = type === 'success' ? 'fas fa-check-circle' : 'fas fa-exclamation-circle';
  toast.classList.add('show');
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => toast.classList.remove('show'), 4000);
}

// ================================================================
// AFFICHAGE
// ================================================================
function showContent(data) {
  const firstName = data.firstName || '';
  const lastName = data.lastName || '';
  const fullName = [firstName, lastName].filter(Boolean).join(' ') || 'Élève';

  userName.textContent = `Bienvenue, ${fullName} !`;
  userEmail.textContent = data.email || '';

  skeletonLoading.style.display = 'none';
  dynamicContent.style.display = 'block';
}

// ================================================================
// CHARGEMENT DONNÉES
// ================================================================
async function loadUserData(user) {
  const cached = getCachedUserData(user.uid);
  if (cached) {
    if (!isAccountAccessible(cached)) {
      window.location.href = 'login.html';
      return;
    }
    if (cached.onboardingCompleted === true) {
      window.location.href = 'index.html';
      return;
    }
    showContent(cached);
  }

  try {
    const userDoc = await getDoc(doc(db, 'users', user.uid));

    if (!userDoc.exists()) {
      window.location.href = 'register.html';
      return;
    }

    const data = userDoc.data();
    saveUserDataToCache(data, user.uid);

    if (!isAccountAccessible(data)) {
      window.location.href = 'login.html';
      return;
    }

    if (data.onboardingCompleted === true) {
      window.location.href = 'index.html';
      return;
    }

    showContent(data);

  } catch (error) {
    if (!cached) {
      skeletonLoading.style.display = 'none';
      dynamicContent.style.display = 'block';
    }
  }
}

// ================================================================
// BOUTON START
// ================================================================
startBtn.addEventListener('click', async () => {
  if (startBtn.classList.contains('loading')) return;

  startBtn.classList.add('loading');
  startBtn.disabled = true;

  try {
    const user = auth.currentUser;
    if (!user) throw new Error('Non connecté');

    await updateDoc(doc(db, 'users', user.uid), {
      onboardingCompleted: true,
      onboardingCompletedAt: serverTimestamp(),
      updatedAt: serverTimestamp()
    });

    try {
      await addDoc(collection(db, 'users', user.uid, 'notifications'), {
        title: '🎉 Bienvenue sur ARVEXA !',
        body: 'Ton compte est prêt. Commence par explorer les chapitres et fixe-toi un objectif.',
        type: 'success',
        read: false,
        createdAt: serverTimestamp()
      });
    } catch (e) {}

    try {
      const cached = JSON.parse(localStorage.getItem(USER_DATA_KEY) || '{}');
      cached.onboardingCompleted = true;
      cached._uid = user.uid;
      localStorage.setItem(USER_DATA_KEY, JSON.stringify(cached));
    } catch (e) {}

    showToast('🎉 Bienvenue sur ARVEXA School !', 'success');

    setTimeout(() => {
      window.location.href = 'index.html';
    }, 900);

  } catch (error) {
    startBtn.classList.remove('loading');
    startBtn.disabled = false;
    setTimeout(() => {
      window.location.href = 'index.html';
    }, 1500);
  }
});

// ================================================================
// AUTH
// ================================================================
let currentUid = null;
let isRedirecting = false;

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    if (currentUid !== null) {
      currentUid = null;
      clearSession();
    }
    if (!isRedirecting) {
      isRedirecting = true;
      sessionStorage.setItem('redirectAfterLogin', window.location.pathname);
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 300);
    }
    return;
  }

  if (user.uid === currentUid) return;
  currentUid = user.uid;

  try {
    await getIdToken(user, true);
  } catch (e) {}

  updateCountdown();
  loadUserData(user);
});

console.log('🚀 ARVEXA School — Onboarding');
</script>
