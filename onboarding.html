<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="description" content="ARVEXA School - Bienvenue">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png" type="image/png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       ROOT — Design system ARVEXA
       ============================================================ */
    :root {
      --primary: #1A3A2A;
      --accent: #B8860B;
      --accent-bright: #E0B84A;
      --success: #2D7D5A;
      --danger: #B85C3A;
      --bg-dark: #0A0A0A;
      --bg-card: rgba(20, 20, 20, 0.7);
      --text-light: #F5F0E8;
      --text-dim: #8A8A7A;
      --text-muted: #5A5A4A;
      --card-border: rgba(184, 134, 11, 0.06);
      --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --radius: 16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html {
      scroll-behavior: smooth;
      width: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      width: 100%;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px 40px;
    }

    /* ============================================================
       BACKGROUND
       ============================================================ */
    .gradient-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      background: radial-gradient(ellipse 40% 30% at 30% 20%, rgba(26, 58, 42, 0.12) 0%, transparent 70%),
                  radial-gradient(ellipse 30% 20% at 70% 80%, rgba(184, 134, 11, 0.02) 0%, transparent 60%),
                  linear-gradient(180deg, #0A0A0A 0%, #060606 100%);
    }

    .glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: -1;
      opacity: 0.15;
      animation: glowMove 10s ease-in-out infinite alternate;
    }
    .glow-1 { width: 350px; height: 350px; background: rgba(26,58,42,0.15); top: -80px; right: -80px; }
    .glow-2 { width: 200px; height: 200px; background: rgba(184,134,11,0.03); bottom: 0; left: 0; animation-delay: -4s; }
    @keyframes glowMove {
      0% { transform: translate(0,0) scale(1); }
      100% { transform: translate(30px,-20px) scale(1.1); }
    }

    /* ============================================================
       CONTAINER
       ============================================================ */
    .onboarding-container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      animation: fadeInUp 0.6s ease-out;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ============================================================
       CARD
       ============================================================ */
    .onboarding-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 32px 28px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      text-align: center;
    }
    .onboarding-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent-bright), var(--accent));
    }

    /* ============================================================
       HEADER
       ============================================================ */
    .header {
      margin-bottom: 20px;
    }
    .header .icon-big {
      font-size: clamp(48px, 8vw, 64px);
      display: block;
      margin-bottom: 4px;
      animation: iconBounce 2s ease-in-out infinite;
    }
    @keyframes iconBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .header .logo {
      font-size: clamp(20px, 3vw, 26px);
      font-weight: 700;
      font-family: 'Playfair Display', 'Georgia', serif;
      color: var(--text-light);
      letter-spacing: 1px;
    }
    .header .logo span {
      background: linear-gradient(90deg, var(--accent), var(--accent-bright), var(--accent));
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-style: italic;
      animation: shimmerText 4s linear infinite;
    }
    @keyframes shimmerText {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }
    .header .subtitle {
      font-size: clamp(13px, 1.6vw, 14px);
      color: var(--text-dim);
      margin-top: 2px;
      font-weight: 300;
    }

    /* ============================================================
       USER INFO
       ============================================================ */
    .user-info {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      padding: 16px 20px;
      margin: 16px 0 14px;
      transition: var(--transition);
    }
    .user-info .user-name {
      font-size: clamp(17px, 2.2vw, 20px);
      font-weight: 600;
      color: var(--text-light);
    }
    .user-info .user-email {
      font-size: clamp(12px, 1.4vw, 13px);
      color: var(--text-dim);
      margin-top: 2px;
      word-break: break-all;
    }

    /* ============================================================
       STATS GRID
       ============================================================ */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 12px 0 18px;
    }
    .stat-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 10px;
      padding: 12px 8px;
      transition: var(--transition);
    }
    .stat-item:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(184, 134, 11, 0.06);
    }
    .stat-item .si-icon {
      font-size: clamp(18px, 2.5vw, 22px);
      display: block;
      margin-bottom: 2px;
    }
    .stat-item .si-label {
      font-size: clamp(9px, 1vw, 10px);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 500;
    }
    .stat-item .si-value {
      font-size: clamp(13px, 1.6vw, 15px);
      font-weight: 600;
      color: var(--text-light);
      margin-top: 2px;
    }

    /* ============================================================
       SUBJECTS TAGS
       ============================================================ */
    .subjects-tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin: 10px 0 18px;
    }
    .subjects-tags .tag {
      background: rgba(184, 134, 11, 0.06);
      border: 1px solid rgba(184, 134, 11, 0.08);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: clamp(10px, 1.2vw, 11px);
      color: var(--accent-bright);
      font-weight: 500;
      transition: var(--transition);
      white-space: nowrap;
    }
    .subjects-tags .tag:hover {
      background: rgba(184, 134, 11, 0.12);
      transform: translateY(-1px);
    }

    /* ============================================================
       BUTTON
       ============================================================ */
    .btn-primary {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, var(--accent-bright), var(--accent));
      color: #0A0A0A;
      font-size: clamp(15px, 1.8vw, 16px);
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(184, 134, 11, 0.15);
      min-height: 52px;
    }
    .btn-primary::after {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255,255,255,0.05), transparent);
      transform: rotate(45deg) translateX(-100%);
      transition: transform 0.6s ease;
    }
    .btn-primary:hover:not(:disabled)::after {
      transform: rotate(45deg) translateX(100%);
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 30px rgba(184, 134, 11, 0.3);
    }
    .btn-primary:active:not(:disabled) { transform: scale(0.97); }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .btn-primary .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(10, 10, 10, 0.15);
      border-top-color: #0A0A0A;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .btn-primary.loading .spinner { display: block; }
    .btn-primary.loading .btn-text { display: none; }
    .btn-primary.loading .btn-icon { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ============================================================
       SECURE BADGE
       ============================================================ */
    .secure {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 14px;
    }
    .secure i { color: var(--success); margin-right: 4px; }

    /* ============================================================
       SKELETON LOADING
       ============================================================ */
    .skeleton {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }
    .skeleton-text { height: 16px; margin: 4px 0; }
    .skeleton-name { height: 24px; width: 60%; margin: 0 auto; }
    .skeleton-email { height: 14px; width: 70%; margin: 4px auto; }
    .skeleton-stat { height: 60px; border-radius: 10px; }
    .skeleton-tag { height: 26px; width: 80px; border-radius: 20px; }

    /* ============================================================
       TOAST
       ============================================================ */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      padding: 14px 24px;
      border-radius: 12px;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      color: var(--text-light);
      font-size: 13px;
      font-weight: 500;
      z-index: 300;
      opacity: 0;
      transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      max-width: 90%;
      text-align: center;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast.success { border-color: rgba(45, 125, 90, 0.2); }
    .toast.error { border-color: rgba(184, 92, 58, 0.3); }
    .toast .toast-icon { font-size: 16px; }
    .toast.success .toast-icon { color: var(--success); }
    .toast.error .toast-icon { color: var(--danger); }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 640px) {
      body { padding: 16px 12px 30px; }
      .onboarding-card { padding: 24px 18px; }
      .user-info { padding: 14px 16px; margin: 12px 0; }
      .stats-grid { gap: 6px; }
      .stat-item { padding: 10px 6px; }
      .btn-primary { padding: 12px; min-height: 48px; }
    }

    @media (max-width: 480px) {
      .onboarding-card { padding: 20px 16px; }
      .stats-grid { gap: 6px; }
      .stat-item { padding: 8px 4px; }
      .stat-item .si-icon { font-size: 18px; }
      .stat-item .si-value { font-size: 13px; }
      .subjects-tags { gap: 4px; }
      .subjects-tags .tag { padding: 3px 10px; font-size: 10px; }
      .btn-primary { font-size: 14px; padding: 10px; min-height: 44px; }
      .secure { font-size: 10px; margin-top: 10px; }
    }

    @media (max-width: 360px) {
      body { padding: 12px 8px 24px; }
      .onboarding-card { padding: 16px 12px; border-radius: 12px; }
      .header .icon-big { font-size: 40px; }
      .header .logo { font-size: 18px; }
      .header .subtitle { font-size: 12px; }
      .user-info .user-name { font-size: 15px; }
      .user-info .user-email { font-size: 11px; }
      .stats-grid { grid-template-columns: 1fr 1fr; gap: 4px; }
      .stat-item { padding: 6px 4px; }
      .stat-item .si-icon { font-size: 16px; }
      .stat-item .si-label { font-size: 8px; }
      .stat-item .si-value { font-size: 12px; }
      .subjects-tags .tag { font-size: 9px; padding: 2px 8px; }
      .btn-primary { font-size: 13px; padding: 8px; min-height: 40px; }
    }

    @media (min-width: 768px) {
      .onboarding-container { max-width: 520px; }
      .onboarding-card { padding: 40px 36px; }
    }

    @media (min-width: 1024px) {
      .onboarding-container { max-width: 560px; }
      .onboarding-card { padding: 44px 40px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    a:focus-visible, button:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 6px;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(184, 134, 11, 0.25); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(184, 134, 11, 0.4); }
  </style>
</head>

<!-- ===== CONTAINER ===== -->

    <div id="dynamicContent" style="display:none;">

      <!-- HEADER -->
      <div class="header">

<!-- ============================================================ -->
<!-- SCRIPTS                                                       -->
<!-- ============================================================ -->
<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js"
  }
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
import {
  getFirestore,
  doc,
  getDoc,
  updateDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

// ================================================================
// CONFIG
// ================================================================
const firebaseConfig = {
  apiKey: "AIzaSyDHscOXw3rLuhV6z1Cny-bdYCumqpnG7QE",
  authDomain: "arvexa-fbf10.firebaseapp.com",
  projectId: "arvexa-fbf10",
  storageBucket: "arvexa-fbf10.firebasestorage.app",
  messagingSenderId: "920108330053",
  appId: "1:920108330053:web:f532d71cbc2c824bc7472c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ================================================================
// PERSISTANCE
// ================================================================
try {
  await setPersistence(auth, browserLocalPersistence);
  console.log('🔐 Persistance locale activée');
} catch (e) {
  console.warn('⚠️ Erreur persistance:', e);
}

// ================================================================
// DOM ELEMENTS
// ================================================================
const skeletonLoading = document.getElementById('skeletonLoading');
const dynamicContent = document.getElementById('dynamicContent');
const startBtn = document.getElementById('startBtn');
const userName = document.getElementById('userName');
const userEmail = document.getElementById('userEmail');

// ================================================================
// TOAST
// ================================================================
function showToast(message, type = 'success') {
  const toast = document.getElementById('toast');
  const toastMessage = document.querySelector('.toast-message');
  const toastIcon = document.querySelector('.toast-icon i');
  
  toastMessage.textContent = message;
  toast.className = `toast ${type}`;
  toastIcon.className = type === 'success' ? 'fas fa-check-circle' : 'fas fa-exclamation-circle';
  toast.classList.add('show');
  
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => toast.classList.remove('show'), 4000);
}

// ================================================================
// CHARGEMENT DES DONNÉES (Cache + Firestore)
// ================================================================
function loadFromCache() {
  try {
    const cached = localStorage.getItem('arvexa_user_data');
    if (cached) {
      const data = JSON.parse(cached);
      const firstName = data.firstName || '';
      const lastName = data.lastName || '';
      const fullName = [firstName, lastName].filter(Boolean).join(' ') || 'Élève';
      
      userName.textContent = fullName;
      userEmail.textContent = data.email || '';
      
      // Si déjà onboardé, rediriger
      if (data.onboardingCompleted === true) {
        window.location.href = 'index.html';
        return true;
      }
      
      return true;
    }
  } catch (e) {}
  return false;
}

async function loadFromFirestore(user) {
  try {
    const userDoc = await getDoc(doc(db, 'users', user.uid));
    
    if (!userDoc.exists()) {
      showToast('⚠️ Profil introuvable.', 'error');
      return false;
    }

    const data = userDoc.data();

    // Mise à jour du cache
    try {
      localStorage.setItem('arvexa_user_data', JSON.stringify(data));
    } catch (e) {}

    // Afficher les infos
    const firstName = data.firstName || '';
    const lastName = data.lastName || '';
    const fullName = [firstName, lastName].filter(Boolean).join(' ') || 'Élève';
    
    userName.textContent = fullName;
    userEmail.textContent = data.email || '';

    // Si déjà onboardé, rediriger
    if (data.onboardingCompleted === true) {
      window.location.href = 'index.html';
      return false;
    }

    // Afficher le contenu
    skeletonLoading.style.display = 'none';
    dynamicContent.style.display = 'block';

    return true;

  } catch (error) {
    console.error('❌ Erreur Firestore:', error);
    showToast('Erreur lors du chargement des données.', 'error');
    return false;
  }
}

// ================================================================
// AUTH + DATA LOADING
// ================================================================
let authChecked = false;

onAuthStateChanged(auth, async (user) => {
  if (authChecked) return;
  authChecked = true;

  if (!user) {
    window.location.href = 'login.html';
    return;
  }

  // 1. Tentative de chargement depuis le cache (instantané)
  const cacheLoaded = loadFromCache();
  
  if (cacheLoaded) {
    // Cache chargé, afficher le contenu
    skeletonLoading.style.display = 'none';
    dynamicContent.style.display = 'block';
  }

  // 2. Chargement depuis Firestore (mise à jour)
  await loadFromFirestore(user);
});

// ================================================================
// BOUTON START
// ================================================================
startBtn.addEventListener('click', async () => {
  if (startBtn.classList.contains('loading')) return;

  startBtn.classList.add('loading');
  startBtn.disabled = true;

  try {
    const user = auth.currentUser;
    if (!user) throw new Error('Non connecté');

    // Marquer onboarding comme terminé
    await updateDoc(doc(db, 'users', user.uid), {
      onboardingCompleted: true,
      onboardingCompletedAt: serverTimestamp(),
      updatedAt: serverTimestamp()
    });

    // Mise à jour cache
    try {
      const cached = JSON.parse(localStorage.getItem('arvexa_user_data') || '{}');
      cached.onboardingCompleted = true;
      localStorage.setItem('arvexa_user_data', JSON.stringify(cached));
    } catch (e) {}

    showToast('🎉 Bienvenue sur ARVEXA School !', 'success');

    setTimeout(() => {
      window.location.href = 'index.html';
    }, 800);

  } catch (error) {
    console.error('❌ Erreur:', error);
    showToast('Une erreur est survenue. Réessaie.', 'error');
    startBtn.classList.remove('loading');
    startBtn.disabled = false;
  }
});

console.log('🚀 ARVEXA School — Onboarding (version refactorisée)');
</script>
