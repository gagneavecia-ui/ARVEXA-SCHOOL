<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <title>ARVEXA — Groupe d'échange</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <script src="register-sw.js" defer></script>

  <style>
    :root {
      --accent: #B8860B;
      --accent-bright: #E0B84A;
      --success: #2D7D5A;
      --success-light: #3AB67E;
      --danger: #B85C3A;
      --danger-light: #f87171;
      --bg-dark: #0A0A0A;
      --bg-surface: #141414;
      --bg-card: rgba(20, 20, 20, 0.7);
      --text-light: #F5F0E8;
      --text-dim: #8A8A7A;
      --text-muted: #5A5A4A;
      --border-soft: rgba(255, 255, 255, 0.05);
      --card-border: rgba(184, 134, 11, 0.08);
      --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      --radius: 14px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      font-size: 14px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      position: fixed;
      inset: 0;
      -webkit-font-smoothing: antialiased;
    }

    .gradient-bg {
      position: fixed; inset: 0; z-index: -2;
      background:
        radial-gradient(ellipse 40% 30% at 30% 15%, rgba(26,58,42,.16) 0%, transparent 70%),
        radial-gradient(ellipse 35% 25% at 75% 85%, rgba(184,134,11,.05) 0%, transparent 60%),
        linear-gradient(180deg, #0A0A0A 0%, #060606 100%);
    }

    /* ============================================================
       HEADER
       ============================================================ */
    .header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(10px + var(--safe-top)) 16px 10px;
      background: rgba(10,10,10,.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(184,134,11,.08);
      gap: 12px;
      min-height: 60px;
      z-index: 10;
    }
    .header-left {
      display: flex; align-items: center; gap: 12px;
      min-width: 0; flex: 1;
    }
    .back-btn {
      display: flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: 10px;
      border: 1px solid var(--border-soft); background: transparent;
      color: var(--text-dim); cursor: pointer;
      transition: var(--transition); font-size: 15px;
      text-decoration: none; flex-shrink: 0;
    }
    .back-btn:hover {
      border-color: rgba(184,134,11,.2);
      color: var(--accent-bright);
    }
    .header-info {
      display: flex; flex-direction: column; min-width: 0;
    }
    .header-title {
      font-size: 15px; font-weight: 700;
      font-family: 'Playfair Display', serif;
      color: var(--text-light);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .header-sub {
      font-size: 11px; color: var(--text-muted);
      display: flex; align-items: center; gap: 6px;
    }
    .online-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--success-light);
      box-shadow: 0 0 6px var(--success-light);
      animation: pulseOnline 2s ease-in-out infinite;
    }
    @keyframes pulseOnline {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* ============================================================
       MESSAGES
       ============================================================ */
    .messages-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 10px 8px 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }
    .messages-container::-webkit-scrollbar { width: 4px; }
    .messages-container::-webkit-scrollbar-thumb {
      background: rgba(184,134,11,.2);
      border-radius: 10px;
    }

    .message {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      max-width: 70%;
      animation: msgFadeIn 0.3s ease;
    }
    @keyframes msgFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message.self {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 26px; height: 26px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-bright));
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700;
      color: #0A0A0A; flex-shrink: 0;
      overflow: hidden;
    }
    .msg-avatar img {
      width: 100%; height: 100%; object-fit: cover;
    }

    .msg-content-wrap {
      display: flex; flex-direction: column; gap: 2px;
      min-width: 0;
    }

    .msg-header {
      display: flex; align-items: baseline; gap: 8px;
      font-size: 11px; padding: 0 6px;
    }
    .message.self .msg-header {
      flex-direction: row-reverse;
    }
    .msg-author {
      font-weight: 600;
      color: var(--accent-bright);
    }
    .msg-time {
      color: var(--text-muted);
    }

    .msg-bubble {
      padding: 6px 10px;
      border-radius: 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.04);
      font-size: 13px;
      line-height: 1.35;
      color: var(--text-light);
      word-wrap: break-word;
      overflow-wrap: break-word;
      max-width: 100%;
      white-space: pre-wrap;
      position: relative;
    }
    .message.self .msg-bubble {
      background: linear-gradient(135deg, rgba(184,134,11,.18), rgba(184,134,11,.08));
      border-color: rgba(184,134,11,.2);
    }

    /* Image dans message (base64) */
    .msg-image {
      max-width: 100%;
      max-height: 300px;
      border-radius: 12px;
      display: block;
      cursor: zoom-in;
      margin-top: 4px;
      transition: transform 0.2s ease;
    }
    .msg-image:hover {
      transform: scale(1.01);
    }

    .msg-deleted {
      font-style: italic;
      color: var(--text-muted);
      font-size: 13px;
    }

    .msg-admin-actions {
      display: flex; gap: 4px;
      margin-top: 4px;
    }
    .msg-admin-btn {
      padding: 3px 8px;
      border-radius: 8px;
      background: rgba(184,92,58,.12);
      border: 1px solid rgba(184,92,58,.2);
      color: var(--danger-light);
      font-size: 10px;
      cursor: pointer;
      font-family: inherit;
    }
    .msg-admin-btn:hover {
      background: rgba(184,92,58,.2);
    }

    .day-separator {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin: 12px 0 8px;
      position: relative;
    }
    .day-separator::before,
    .day-separator::after {
      content: '';
      position: absolute; top: 50%;
      width: 30%; height: 1px;
      background: rgba(255,255,255,0.05);
    }
    .day-separator::before { left: 0; }
    .day-separator::after { right: 0; }

    .empty-chat {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }
    .empty-chat i {
      font-size: 40px;
      margin-bottom: 12px;
      display: block;
      opacity: 0.4;
    }

    .loading-messages {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      gap: 10px;
      color: var(--text-muted);
      font-size: 13px;
    }
    .loading-spinner {
      width: 20px; height: 20px;
      border: 2px solid rgba(184,134,11,.15);
      border-top-color: var(--accent-bright);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ============================================================
       INPUT ZONE
       ============================================================ */
    .input-zone {
      flex-shrink: 0;
      padding: 10px 12px;
      padding-bottom: calc(10px + var(--safe-bottom));
      background: rgba(10,10,10,.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(184,134,11,.08);
      display: flex;
      gap: 8px;
      align-items: flex-end;
      position: relative;
    }

    .input-icon-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border-soft);
      background: rgba(255,255,255,.03);
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
      transition: var(--transition);
    }
    .input-icon-btn:hover {
      background: rgba(184,134,11,.08);
      color: var(--accent-bright);
      border-color: rgba(184,134,11,.2);
    }

    .message-input-wrap {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 20px;
      padding: 0 14px;
      min-height: 38px;
      max-height: 38px;
      transition: max-height 0.2s ease;
    }
    .message-input-wrap.multiline {
      max-height: 100px;
      align-items: flex-end;
    }
    .message-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-light);
      font-size: 14px;
      font-family: inherit;
      padding: 9px 0;
      resize: none;
      max-height: 80px;
      line-height: 1.4;
      overflow-y: auto;
      scrollbar-width: thin;
    }
    .message-input::-webkit-scrollbar { width: 3px; }
    .message-input::-webkit-scrollbar-thumb {
      background: rgba(184,134,11,.3);
      border-radius: 3px;
    }
    .message-input::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--accent-bright), var(--accent));
      color: #0A0A0A;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
      transition: var(--transition);
      box-shadow: 0 4px 16px rgba(184,134,11,.25);
    }
    .send-btn:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(184,134,11,.4);
    }
    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .send-btn.loading {
      background: linear-gradient(135deg, #888, #555);
    }

    .image-preview {
      position: absolute;
      bottom: 100%;
      left: 0;
      right: 0;
      padding: 10px 12px;
      background: rgba(20,20,20,.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(184,134,11,.15);
      display: none;
      align-items: center;
      gap: 12px;
    }
    .image-preview.show { display: flex; }
    .image-preview-img {
      width: 60px; height: 60px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid rgba(184,134,11,.2);
    }
    .image-preview-info {
      flex: 1;
      font-size: 12px;
      color: var(--text-dim);
    }
    .image-preview-remove {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: none;
      background: rgba(184,92,58,.15);
      color: var(--danger-light);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }

    /* ============================================================
       MODALE IMAGE PLEIN ÉCRAN
       ============================================================ */
    .image-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.98);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease;
      cursor: zoom-out;
    }
    .image-modal.show {
      opacity: 1;
      visibility: visible;
    }
    .image-modal img {
      max-width: 95vw;
      max-height: 95vh;
      object-fit: contain;
      border-radius: 8px;
      animation: imageZoomIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
      -webkit-user-select: none;
    }
    @keyframes imageZoomIn {
      from { opacity: 0; transform: scale(0.85); }
      to { opacity: 1; transform: scale(1); }
    }
    .image-modal-close {
      position: absolute;
      top: calc(var(--safe-top) + 16px);
      right: 16px;
      width: 44px; height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      color: var(--text-light);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: var(--transition);
    }
    .image-modal-close:hover {
      background: rgba(184, 92, 58, 0.3);
      transform: rotate(90deg);
    }

    /* ============================================================
       MODALES CONFIRMATION
       ============================================================ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      background: var(--bg-surface);
      border: 1px solid rgba(184,134,11,.2);
      border-radius: 20px;
      padding: 24px 20px;
      max-width: 420px;
      width: 100%;
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-overlay.show .modal-card {
      transform: scale(1);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      font-family: 'Playfair Display', serif;
      color: var(--text-light);
      margin-bottom: 6px;
      padding-right: 30px;
    }
    .modal-sub {
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 16px;
    }
    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 32px; height: 32px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,.03);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .modal-close:hover {
      color: var(--text-light);
      background: rgba(255,255,255,.08);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }
    .modal-btn {
      flex: 1;
      padding: 11px 18px;
      border-radius: 24px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .modal-btn.danger {
      background: linear-gradient(135deg, #D97A3A, #B85C3A);
      color: #fff;
    }
    .modal-btn.cancel {
      background: rgba(255,255,255,.05);
      color: var(--text-dim);
      border: 1px solid rgba(255,255,255,.08);
    }

    /* ============================================================
       MESSAGE CONTEXT MENU (appui long)
       ============================================================ */
    .msg-menu-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 1500;
      display: none;
      align-items: flex-end;
      justify-content: center;
      animation: fadeIn 0.2s ease;
    }
    .msg-menu-overlay.show { display: flex; }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .msg-menu-sheet {
      width: 100%;
      max-width: 500px;
      background: var(--bg-surface);
      border-radius: 20px 20px 0 0;
      border-top: 1px solid rgba(184,134,11,.15);
      padding: 12px 0;
      padding-bottom: calc(12px + var(--safe-bottom));
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      position: relative;
    }
    .msg-menu-overlay.show .msg-menu-sheet {
      transform: translateY(0);
    }
    .msg-menu-sheet::before {
      content: '';
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,.15);
    }

    .msg-menu-title {
      padding: 16px 20px 12px;
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      border-bottom: 1px solid rgba(255,255,255,.05);
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .msg-menu-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 20px;
      color: var(--text-light);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      font-family: inherit;
    }
    .msg-menu-item:hover { background: rgba(255,255,255,.04); }
    .msg-menu-item:active { background: rgba(255,255,255,.08); }
    .msg-menu-item i {
      width: 22px;
      text-align: center;
      font-size: 16px;
      color: var(--text-dim);
    }
    .msg-menu-item.danger { color: var(--danger-light); }
    .msg-menu-item.danger i { color: var(--danger-light); }

    .msg-menu-cancel {
      margin: 8px 12px 0;
      padding: 14px;
      border-radius: 14px;
      background: rgba(255,255,255,.05);
      color: var(--text-light);
      font-weight: 600;
      font-size: 14px;
      border: none;
      cursor: pointer;
      width: calc(100% - 24px);
      font-family: inherit;
      transition: background 0.15s ease;
    }
    .msg-menu-cancel:hover { background: rgba(255,255,255,.08); }

    /* ============================================================
       TOAST
       ============================================================ */
    .toast {
      position: fixed;
      top: calc(var(--safe-top) + 16px);
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      padding: 12px 18px;
      border-radius: 12px;
      background: rgba(20,22,20,.96);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-soft);
      color: var(--text-light);
      font-size: 13px;
      font-weight: 500;
      z-index: 3000;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.25,1,0.5,1);
      max-width: 90%;
      box-shadow: 0 8px 32px rgba(0,0,0,.5);
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast.success { border-color: rgba(58,182,126,.5); color: var(--success-light); }
    .toast.error { border-color: rgba(248,113,113,.5); color: var(--danger-light); }
    .toast.info { border-color: rgba(224,184,74,.5); color: var(--accent-bright); }

    /* ============================================================
       EMOJI PICKER
       ============================================================ */
    .emoji-picker {
      position: fixed;
      bottom: calc(70px + var(--safe-bottom));
      left: 12px;
      right: 12px;
      max-width: 360px;
      margin: 0 auto;
      background: rgba(20,20,20,.98);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(184,134,11,.2);
      border-radius: 16px;
      padding: 12px;
      z-index: 100;
      display: none;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
      max-height: 240px;
      overflow-y: auto;
      box-shadow: 0 8px 32px rgba(0,0,0,.5);
    }
    .emoji-picker.show { display: grid; }
    .emoji-item {
      padding: 6px;
      text-align: center;
      font-size: 22px;
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.15s ease;
      line-height: 1;
    }
    .emoji-item:hover {
      background: rgba(184,134,11,.15);
    }

    /* ============================================================
       BANNI
       ============================================================ */
    .banned-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10,10,10,.98);
      z-index: 500;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .banned-overlay.show { display: flex; }
    .banned-content { max-width: 340px; }
    .banned-icon { font-size: 56px; margin-bottom: 16px; }
    .banned-title {
      font-size: 22px;
      font-weight: 700;
      font-family: 'Playfair Display', serif;
      color: var(--danger-light);
      margin-bottom: 10px;
    }

// ================================================================

let toastTimer = null;
function showToast(message, type = 'info') {
  const icons = {
    success: 'fas fa-check-circle',
    error: 'fas fa-exclamation-circle',
    info: 'fas fa-info-circle'
  };
  toast.className = `toast ${type}`;
  toast.querySelector('.toast-icon').className = `toast-icon ${icons[type]}`;
  toast.querySelector('.toast-msg').textContent = message;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
}

// ================================================================
// ESCAPE HTML
// ================================================================
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = String(text || '');
  return div.innerHTML;
}

// ================================================================
// FORMAT HEURE
// ================================================================
function formatTime(timestamp) {
  const date = timestamp?.toDate ? timestamp.toDate() : new Date(timestamp);
  if (isNaN(date.getTime())) return '';
  const now = new Date();
  const diffMs = now - date;
  const diffMin = Math.floor(diffMs / 60000);
  const diffHour = Math.floor(diffMin / 60);
  const diffDay = Math.floor(diffHour / 24);

  if (diffMin < 1) return 'À l\'instant';
  if (diffMin < 60) return `Il y a ${diffMin} min`;
  if (diffHour < 24) return date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  if (diffDay < 7) return date.toLocaleDateString('fr-FR', { weekday: 'short', hour: '2-digit', minute: '2-digit' });
  return date.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}

function formatDaySeparator(timestamp) {
  const date = timestamp?.toDate ? timestamp.toDate() : new Date(timestamp);
  if (isNaN(date.getTime())) return '';
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const msgDay = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const diffDay = Math.floor((today - msgDay) / (1000 * 60 * 60 * 24));

  if (diffDay === 0) return 'Aujourd\'hui';
  if (diffDay === 1) return 'Hier';
  if (diffDay < 7) return date.toLocaleDateString('fr-FR', { weekday: 'long' });
  return date.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
}

// ================================================================
// MOTS INTERDITS
// ================================================================
function containsForbiddenWords(text) {
  const lower = text.toLowerCase();
  return FORBIDDEN_WORDS.some(word => lower.includes(word));
}

// ================================================================
// COMPRESSION IMAGE
// ================================================================
function compressImage(file) {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith('image/')) {
      reject(new Error('Le fichier n\'est pas une image'));
      return;
    }
    if (file.size > MAX_IMAGE_SIZE) {
      reject(new Error('Image trop lourde (max 10 Mo)'));
      return;
    }

    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        // Redimensionner
        let width = img.width;
        let height = img.height;

        if (width > MAX_IMAGE_WIDTH) {
          const ratio = MAX_IMAGE_WIDTH / width;
          width = MAX_IMAGE_WIDTH;
          height = Math.round(height * ratio);
        }

        // Créer canvas
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        // Convertir en base64
        const base64 = canvas.toDataURL('image/jpeg', IMAGE_QUALITY);

        // Vérifier la taille
        if (base64.length > MAX_BASE64_SIZE) {
          // Recompresser avec qualité réduite
          const base64Lower = canvas.toDataURL('image/jpeg', 0.5);
          if (base64Lower.length > MAX_BASE64_SIZE) {
            reject(new Error('Image trop lourde après compression'));
            return;
          }
          resolve(base64Lower);
        } else {
          resolve(base64);
        }
      };
      img.onerror = () => reject(new Error('Erreur de chargement'));
      img.src = event.target.result;
    };
    reader.onerror = () => reject(new Error('Erreur de lecture'));
    reader.readAsDataURL(file);
  });
}

// ================================================================
// RENDU DES MESSAGES
// ================================================================
function renderMessages() {
  if (messages.length === 0) {
    messagesContainer.innerHTML = `
      <div class="empty-chat">
        <i class="fas fa-comments"></i>
        <p>Aucun message pour le moment.<br>Sois le premier à écrire !</p>
      </div>
    `;
    return;
  }

  let lastDay = '';
  let html = '';

  messages.forEach(msg => {
    // ✅ Correction #4 : Skip les messages sans date
    if (!msg.createdAt) return;

    const date = msg.createdAt?.toDate ? msg.createdAt.toDate() : new Date(msg.createdAt);
    const dayKey = date.toDateString();

    if (dayKey !== lastDay) {
      html += `<div class="day-separator">${formatDaySeparator(msg.createdAt)}</div>`;
      lastDay = dayKey;
    }

    const isSelf = msg.userId === currentUid;
    const isDeleted = msg.deleted === true;
    const initial = (msg.userName || 'U').charAt(0).toUpperCase();
    const isAdminMsg = msg.userEmail === ADMIN_EMAIL;

    let bubbleContent = '';
    if (isDeleted) {
      bubbleContent = `<div class="msg-deleted">Message supprimé</div>`;
    } else {
      if (msg.content) {
        bubbleContent += `<div>${escapeHtml(msg.content)}</div>`;
      }
      if (msg.imageBase64) {
        bubbleContent += `<img src="${msg.imageBase64}" class="msg-image" alt="Image" data-img="${msg.id}">`;
      }
    }

    html += `
      <div class="message ${isSelf ? 'self' : ''}">
        <div class="msg-avatar">
          ${msg.userAvatar ? `<img src="${msg.userAvatar}" alt="">` : initial}
        </div>
        <div class="msg-content-wrap">
          <div class="msg-header">
            <span class="msg-author">${escapeHtml(msg.userName || 'Anonyme')}</span>
            <span class="msg-time">${formatTime(msg.createdAt)}</span>
          </div>
          <div class="msg-bubble">
            ${bubbleContent}
          </div>
        </div>
      </div>
    `;
  });

  messagesContainer.innerHTML = html;

  // ✅ Correction #1 : Optimisé O(n) au lieu de O(n²)
  messagesContainer.querySelectorAll('.message').forEach((msgEl, index) => {
    const messageData = messages[index];
    if (!messageData) return;

    // Desktop : clic droit
    msgEl.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      openMessageMenu(messageData);
    });

    // Mobile : appui long
    msgEl.addEventListener('touchstart', () => {
      longPressTriggered = false;
      longPressTimer = setTimeout(() => {
        longPressTriggered = true;
        if (navigator.vibrate) navigator.vibrate(30);
        openMessageMenu(messageData);
      }, 500);
    }, { passive: true });

    msgEl.addEventListener('touchend', () => clearTimeout(longPressTimer), { passive: true });
    msgEl.addEventListener('touchmove', () => clearTimeout(longPressTimer), { passive: true });
    msgEl.addEventListener('touchcancel', () => clearTimeout(longPressTimer), { passive: true });
  });

  // Événements images (zoom)
  messagesContainer.querySelectorAll('.msg-image').forEach(img => {
    img.addEventListener('click', () => {
      openImageModal(img.src);
    });
  });

  // ✅ Correction #2 : Auto-scroll uniquement si l'utilisateur est déjà en bas
  const isAtBottom = messagesContainer.scrollHeight - messagesContainer.scrollTop - messagesContainer.clientHeight < 150;
  if (isAtBottom) {
    setTimeout(() => {
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }, 50);
  }
}

// ================================================================
// CHARGER LES MESSAGES
// ================================================================
function loadMessages() {
  if (unsubscribeMessages) {
    unsubscribeMessages();
    unsubscribeMessages = null;
  }

  const messagesQuery = query(
    collection(db, 'groups', GROUP_ID, 'messages'),
    orderBy('createdAt', 'asc'),
    limit(MAX_MESSAGES)
  );

  unsubscribeMessages = onSnapshot(messagesQuery,
    (snapshot) => {
      messages = snapshot.docs.map(d => ({
        id: d.id,
        ...d.data()
      }));
      renderMessages();
    },
    (error) => {
      console.warn('Erreur messages:', error);
      messagesContainer.innerHTML = `
        <div class="empty-chat">
          <i class="fas fa-exclamation-triangle"></i>
          <p>Impossible de charger les messages</p>
        </div>
      `;
    }
  );
}

// ================================================================
// ENVOYER UN MESSAGE
// ================================================================
async function sendMessage() {
  if (isBanned) {
    showToast('Tu es banni du groupe', 'error');
    return;
  }

  const content = messageInput.value.trim();
  const hasImage = !!pendingImageBase64;

  if (!content && !hasImage) return;

  if (content && containsForbiddenWords(content)) {
    showToast('Message contient des mots interdits', 'error');
    return;
  }

  sendBtn.disabled = true;
  sendBtn.classList.add('loading');

  try {
    const messageData = {
      userId: currentUid,
      userName: currentUserData?.fullName || currentUserData?.firstName || 'Anonyme',
      userEmail: currentUserData?.email || '',
      userAvatar: currentUserData?.profilePicture || null,
      content: content || '',
      createdAt: serverTimestamp(),
      deleted: false
    };

    if (hasImage) {
      messageData.imageBase64 = pendingImageBase64;
      messageData.imageName = pendingImageName || 'image.jpg';
    }

    await addDoc(collection(db, 'groups', GROUP_ID, 'messages'), messageData);

    // Reset
    messageInput.value = '';
    messageInput.style.height = 'auto';
    // ✅ Correction #3 : Retirer multiline après envoi
    messageInput.closest('.message-input-wrap').classList.remove('multiline');
    pendingImageBase64 = null;
    pendingImageName = '';
    imagePreview.classList.remove('show');
    imagePreviewImg.src = '';
    imageInput.value = '';
    updateSendButton();

  } catch (error) {
    console.error(error);
    showToast('Erreur: ' + error.message, 'error');
  } finally {
    sendBtn.classList.remove('loading');
    updateSendButton();
  }
}

// ================================================================
// BOUTON ENVOYER
// ================================================================
function updateSendButton() {
  const hasContent = messageInput.value.trim().length > 0;
  const hasImage = !!pendingImageBase64;
  sendBtn.disabled = (!hasContent && !hasImage) || isBanned;
}

messageInput.addEventListener('input', () => {
  const wrap = messageInput.closest('.message-input-wrap');

  // Auto-resize
  messageInput.style.height = 'auto';
  const newHeight = Math.min(messageInput.scrollHeight, 80);
  messageInput.style.height = newHeight + 'px';

  // Toggle multiline si besoin
  if (newHeight > 30) {
    wrap.classList.add('multiline');
  } else {
    wrap.classList.remove('multiline');
  }

  updateSendButton();
});

messageInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!sendBtn.disabled) sendMessage();
  }
});

sendBtn.addEventListener('click', sendMessage);

});

// ================================================================
// IMAGE UPLOAD
// ================================================================
imageBtn.addEventListener('click', () => imageInput.click());

imageInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  if (!file.type.startsWith('image/')) {
    showToast('Le fichier doit être une image', 'error');
    imageInput.value = '';
    return;
  }

  if (file.size > MAX_IMAGE_SIZE) {
    showToast('Image trop lourde (max 10 Mo)', 'error');
    imageInput.value = '';
    return;
  }

  // Preview + compression
  imagePreviewInfo.textContent = 'Compression en cours...';
  imagePreview.classList.add('show');
  imagePreviewImg.src = URL.createObjectURL(file);

  try {
    const base64 = await compressImage(file);
    pendingImageBase64 = base64;
    pendingImageName = file.name;

    const sizeKB = Math.round(base64.length / 1024);
    imagePreviewInfo.textContent = `${file.name} (${sizeKB} Ko)`;
    imagePreviewImg.src = base64;
    updateSendButton();
  } catch (error) {
    showToast(error.message, 'error');
    imagePreview.classList.remove('show');
    imagePreviewImg.src = '';
    pendingImageBase64 = null;
    pendingImageName = '';
    imageInput.value = '';
  }
});

imagePreviewRemove.addEventListener('click', () => {
  pendingImageBase64 = null;
  pendingImageName = '';
  imagePreview.classList.remove('show');
  imagePreviewImg.src = '';
  imageInput.value = '';
  updateSendButton();
});

  confirmTitle.textContent = title;
  confirmMessage.textContent = message;
  confirmCallback = onConfirm;
  confirmModal.classList.add('show');
}

function closeConfirm() {
  confirmModal.classList.remove('show');
  confirmCallback = null;
}

confirmOk.addEventListener('click', async () => {
  if (confirmCallback) {
    confirmOk.disabled = true;
    try {
      await confirmCallback();

      showToast('Erreur: ' + e.message, 'error');

    confirmOk.disabled = false;
  }
  closeConfirm();
});

confirmCancel.addEventListener('click', closeConfirm);
confirmClose.addEventListener('click', closeConfirm);

confirmModal.addEventListener('click', (e) => {
  if (e.target === confirmModal) closeConfirm();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (imageModal.classList.contains('show')) closeImageModal();
    if (confirmModal.classList.contains('show')) closeConfirm();

        <i class="fas fa-copy"></i>
        <span>Copier le texte</span>
      </button>
    `;
  }

  // Option 2 : Supprimer (admin uniquement)
  if (isAdmin && !isDeleted) {
    menuItems += `
      <button class="msg-menu-item danger" data-action="delete">
        <i class="fas fa-trash"></i>
        <span>Supprimer le message</span>
      </button>
    `;
  }

  // Option 3 : Bannir (admin, pas sur ses propres messages)
  if (isAdmin && !isAdminMsg && !isDeleted) {
    menuItems += `
      <button class="msg-menu-item danger" data-action="ban">
        <i class="fas fa-ban"></i>
        <span>Bannir ${escapeHtml(authorName)}</span>
      </button>
    `;
  }

  // Si aucun item dispo
  if (!menuItems) {
    menuItems = `
      <button class="msg-menu-item" disabled style="opacity: .5; cursor: not-allowed;">
        <i class="fas fa-info-circle"></i>
        <span>Aucune action disponible</span>
      </button>
    `;
  }

  msgMenuSheet.innerHTML = `
    <div class="msg-menu-title">Message de ${escapeHtml(authorName)}</div>
    ${menuItems}
    <button class="msg-menu-cancel" id="msgMenuCancel">Annuler</button>
  `;

  msgMenuOverlay.classList.add('show');

  // Événements
  msgMenuSheet.querySelectorAll('.msg-menu-item').forEach(btn => {
    btn.addEventListener('click', () => {
      const action = btn.dataset.action;
      closeMessageMenu();

      if (action === 'copy') {
        copyMessageText(messageData.content);
      } else if (action === 'delete') {
        deleteMessage(messageData.id);
      } else if (action === 'ban') {
        banUser(messageData.userId, messageData.userName);
      }
    });
  });

  document.getElementById('msgMenuCancel').addEventListener('click', closeMessageMenu);
}

function closeMessageMenu() {
  msgMenuOverlay.classList.remove('show');
}

// Fermer au clic sur l'overlay
msgMenuOverlay.addEventListener('click', (e) => {
  if (e.target === msgMenuOverlay) closeMessageMenu();
});

// Fonction copier
async function copyMessageText(text) {
  if (!text) return;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    showToast('Texte copié', 'success');
  } catch (e) {
    showToast('Impossible de copier', 'error');
  }
}

// ================================================================
// ACTIONS ADMIN
// ================================================================
function deleteMessage(messageId) {
  openConfirm(
    'Supprimer ce message ?',
    'Le message sera marqué comme supprimé pour tout le monde.',
    async () => {
      try {
        await updateDoc(doc(db, 'groups', GROUP_ID, 'messages', messageId), {
          deleted: true,
          deletedAt: serverTimestamp(),
          deletedBy: currentUid
        });
        showToast('Message supprimé', 'success');
      } catch (e) {
        showToast('Erreur: ' + e.message, 'error');
      }
    }
  );
}

function banUser(userId, userName) {
  openConfirm(
    'Bannir cet utilisateur ?',
    `${userName || 'Cet utilisateur'} ne pourra plus envoyer de messages dans le groupe.`,
    async () => {
      try {
        await setDoc(doc(db, 'groups', GROUP_ID, 'banned', userId), {
          bannedAt: serverTimestamp(),
          bannedBy: currentUid,
          userName: userName || ''
        });
        showToast('Utilisateur banni', 'success');
      } catch (e) {
        showToast('Erreur: ' + e.message, 'error');
      }
    }
  );
}

// ================================================================
// CHARGER USER DATA
// ================================================================
function loadUserData(user) {
  if (unsubscribeUser) {
    unsubscribeUser();
    unsubscribeUser = null;
  }

  const userRef = doc(db, 'users', user.uid);
  unsubscribeUser = onSnapshot(userRef,
    (docSnap) => {
      if (docSnap.exists()) {
        currentUserData = docSnap.data();
        try {
          localStorage.setItem('arvexa_user_data', JSON.stringify(currentUserData));
        } catch (e) {}
      }
    },
    (error) => {
      try {
        const cached = JSON.parse(localStorage.getItem('arvexa_user_data') || '{}');
        if (cached && Object.keys(cached).length > 0) {
          currentUserData = cached;
        }
      } catch (e) {}
    }
  );
}

// ================================================================
// SURVEILLER BANNISSEMENT
// ================================================================
function watchBanStatus(uid) {
  if (unsubscribeBanCheck) {
    unsubscribeBanCheck();
    unsubscribeBanCheck = null;
  }

  const banRef = doc(db, 'groups', GROUP_ID, 'banned', uid);
  unsubscribeBanCheck = onSnapshot(banRef,
    (docSnap) => {
      isBanned = docSnap.exists();
      if (isBanned) {
        bannedOverlay.classList.add('show');
      } else {
        bannedOverlay.classList.remove('show');
      }
      updateSendButton();
    },
    (error) => {}
  );
}

// ================================================================
// COMPTEUR MEMBRES (approximatif)
// ================================================================
function updateOnlineCount() {
  if (!onlineCount) return;
  onlineCount.textContent = 'Communauté ARVEXA';
}

// ================================================================
// AUTH
// ================================================================
let isRedirecting = false;

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    if (currentUid !== null) {
      currentUid = null;
      if (unsubscribeMessages) unsubscribeMessages();
      if (unsubscribeUser) unsubscribeUser();
      if (unsubscribeBanCheck) unsubscribeBanCheck();
    }
    if (!isRedirecting) {
      isRedirecting = true;
      sessionStorage.setItem('redirectAfterLogin', window.location.pathname);
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 300);
    }
    return;
  }

  if (user.uid === currentUid) return;
  currentUid = user.uid;
  currentUser = user;

  loadUserData(user);
  watchBanStatus(user.uid);
  loadMessages();
  updateOnlineCount();
});

// ================================================================
// INIT
// ================================================================
buildEmojiPicker();
updateSendButton();
updateOnlineCount();
</script>
