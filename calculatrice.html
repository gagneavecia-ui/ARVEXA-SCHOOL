<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="description" content="ARVEXa School - Calculatrice scientifique">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png" type="image/png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #1A3A2A; --primary-dark: #0A1A12; --primary-light: #2A5A3A;
      --accent: #B8860B; --accent-bright: #E0B84A; --accent-dim: rgba(184,134,11,0.08);
      --success: #2D7D5A; --danger: #B85C3A;
      --bg-dark: #0A0A0A; --bg-surface: #141414; --bg-card: rgba(20,20,20,0.7);
      --text-light: #F5F0E8; --text-dim: #8A8A7A; --text-muted: #5A5A4A;
      --card-border: rgba(184,134,11,0.08);
      --transition: all 0.3s cubic-bezier(0.25,1,0.5,1);
      --shadow: 0 8px 32px rgba(0,0,0,0.4); --radius: 16px;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html{scroll-behavior:smooth;width:100%;overflow-x:hidden}
    body{
      font-family:'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif;
      background:var(--bg-dark);color:var(--text-light);font-size:14px;line-height:1.6;
      min-height:100vh;width:100%;overflow-x:hidden;-webkit-overflow-scrolling:touch;
      display:flex;flex-direction:column;
    }
    .gradient-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-2;
      background:radial-gradient(ellipse 40% 30% at 30% 15%,rgba(26,58,42,.16) 0%,transparent 70%),
                  radial-gradient(ellipse 35% 25% at 75% 85%,rgba(184,134,11,.05) 0%,transparent 60%),
                  linear-gradient(180deg,#0A0A0A 0%,#060606 100%)}
    .glow{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:-1;
      opacity:.15;animation:glowMove 10s ease-in-out infinite alternate}
    .glow-1{width:300px;height:300px;background:rgba(26,58,42,.18);top:-80px;right:-80px}
    .glow-2{width:180px;height:180px;background:rgba(184,134,11,.05);bottom:0;left:0;animation-delay:-4s}
    @keyframes glowMove{0%{transform:translate(0,0) scale(1)}100%{transform:translate(30px,-20px) scale(1.1)}}

    /* HEADER */
    .header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
      padding:10px 16px;background:rgba(10,10,10,.92);backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(184,134,11,.06);gap:12px;min-height:56px}
    .header-left{display:flex;align-items:center;gap:12px}
    .back-btn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;
      border:1px solid rgba(255,255,255,.05);background:transparent;color:var(--text-dim);cursor:pointer;
      transition:var(--transition);font-size:16px;text-decoration:none}
    .back-btn:hover{border-color:rgba(184,134,11,.14);color:var(--text-light)}
    .page-title{font-size:15px;font-weight:600;color:var(--text-light);font-family:'Playfair Display',serif}
    .page-title i{color:var(--accent-bright);margin-right:6px;font-size:14px}
    .header-right{display:flex;align-items:center;gap:8px}
    .mode-toggle{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;
      background:rgba(184,134,11,.08);border:1px solid rgba(184,134,11,.12);color:var(--accent-bright);
      font-size:12px;font-weight:600;cursor:pointer;transition:var(--transition);font-family:'Inter',sans-serif}
    .mode-toggle:hover{background:rgba(184,134,11,.14)}
    .mode-toggle i{font-size:11px}

    /* CONTAINER */
    .container{max-width:540px;margin:0 auto;padding:12px 12px 32px;width:100%;display:flex;flex-direction:column;gap:10px;flex:1}

    /* TABS */
    .tabs{display:flex;gap:4px;background:rgba(255,255,255,.02);border-radius:12px;padding:4px;border:1px solid rgba(255,255,255,.04)}
    .tab-btn{flex:1;padding:9px 8px;border:none;border-radius:10px;background:transparent;color:var(--text-muted);
      font-size:12px;font-weight:600;cursor:pointer;transition:var(--transition);font-family:'Inter',sans-serif;
      display:flex;align-items:center;justify-content:center;gap:5px}
    .tab-btn i{font-size:12px}
    .tab-btn.active{background:rgba(184,134,11,.1);color:var(--accent-bright);border:1px solid rgba(184,134,11,.12)}
    .tab-btn:not(.active){border:1px solid transparent}
    .tab-btn:hover:not(.active){color:var(--text-dim)}
    .tab-panel{display:none}
    .tab-panel.active{display:flex;flex-direction:column;gap:10px}

    /* DISPLAY */
    .display-card{background:var(--bg-card);backdrop-filter:blur(10px);border:1px solid var(--card-border);
      border-radius:var(--radius);padding:18px 16px 14px;position:relative;overflow:hidden}
    .display-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
      background:linear-gradient(90deg,var(--accent),var(--success),var(--accent))}
    .display-expression{font-size:14px;color:var(--text-dim);min-height:22px;word-break:break-all;
      text-align:right;line-height:1.5;margin-bottom:6px;max-height:68px;overflow-y:auto}
    .display-result{font-size:30px;font-weight:700;color:var(--text-light);text-align:right;
      font-family:'Playfair Display',serif;line-height:1.3;word-break:break-all;min-height:40px}
    .display-result.error{color:var(--danger);font-size:14px;font-family:'Inter',sans-serif}
    .display-meta{position:absolute;top:8px;left:16px;display:flex;gap:8px;align-items:center}
    .paren-count{font-size:10px;color:var(--text-muted);font-weight:600}
    .mem-indicator{font-size:9px;color:var(--accent);font-weight:700;background:rgba(184,134,11,.1);
      padding:1px 6px;border-radius:8px;display:none}
    .mem-indicator.visible{display:inline-block}

    /* HISTORY */
    .history-wrap{max-height:0;overflow:hidden;transition:max-height .4s ease}
    .history-wrap.open{max-height:200px}
    .history-card{background:var(--bg-card);backdrop-filter:blur(10px);border:1px solid var(--card-border);
      border-radius:var(--radius);padding:12px 14px;max-height:180px;overflow-y:auto}
    .history-card::-webkit-scrollbar{width:3px}
    .history-card::-webkit-scrollbar-thumb{background:rgba(184,134,11,.2);border-radius:10px}
    .history-item{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.03);cursor:pointer;transition:var(--transition)}
    .history-item:last-child{border-bottom:none}
    .history-item:hover{opacity:.7}
    .history-item .h-expr{font-size:11px;color:var(--text-muted)}
    .history-item .h-res{font-size:13px;font-weight:600;color:var(--text-dim);text-align:right}
    .history-empty{font-size:12px;color:var(--text-muted);text-align:center;padding:12px 0}
    .history-toggle{display:flex;align-items:center;justify-content:center;gap:6px;padding:7px;
      border-radius:10px;background:transparent;border:1px solid rgba(255,255,255,.04);color:var(--text-muted);
      font-size:11px;font-weight:500;cursor:pointer;transition:var(--transition);font-family:'Inter',sans-serif}
    .history-toggle:hover{color:var(--text-dim);border-color:rgba(255,255,255,.08)}
    .history-toggle i{font-size:10px;transition:transform .3s ease}
    .history-toggle.open i{transform:rotate(180deg)}

    /* BUTTONS */
    .sci-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
    .num-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
    .act-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
    .cb{display:flex;align-items:center;justify-content:center;padding:0;border-radius:10px;
      border:1px solid rgba(255,255,255,.04);background:rgba(255,255,255,.03);color:var(--text-light);
      font-size:15px;font-weight:500;cursor:pointer;transition:var(--transition);font-family:'Inter',sans-serif;
      height:46px;user-select:none;-webkit-user-select:none;flex-direction:column;line-height:1.1}
    .cb:active{transform:scale(.93)}
    .cb:hover{border-color:rgba(184,134,11,.12);background:rgba(255,255,255,.05)}
    .cb.fn{color:var(--accent-bright);font-size:12px;font-weight:600;background:rgba(184,134,11,.06);
      border-color:rgba(184,134,11,.08)}
    .cb.fn:hover{background:rgba(184,134,11,.1)}
    .cb.op{color:var(--accent);font-size:18px;font-weight:700;background:rgba(184,134,11,.04)}
    .cb.op:hover{background:rgba(184,134,11,.1)}
    .cb.eq{background:linear-gradient(135deg,var(--accent-bright),var(--accent));color:#0A0A0A;
      font-size:20px;font-weight:800;border-color:transparent}
    .cb.eq:hover{box-shadow:0 4px 20px rgba(184,134,11,.25);transform:translateY(-1px)}
    .cb.danger{color:var(--danger)}
    .cb.mem{color:var(--success);font-size:11px;font-weight:700;background:rgba(45,125,90,.06);
      border-color:rgba(45,125,90,.1)}
    .cb.mem:hover{background:rgba(45,125,90,.1)}
    .cb .sub{font-size:9px;color:var(--text-muted);font-weight:400;margin-top:1px}
    .cb.num{font-size:18px;font-weight:600}
    .cb.wide{grid-column:span 2}

    /* SEPARATOR LABEL */
    .section-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;
      font-weight:600;padding:2px 4px}

    /* ========== CONSTANTES TAB ========== */
    .const-search{width:100%;padding:10px 14px 10px 36px;border-radius:12px;border:1px solid var(--card-border);
      background:var(--bg-card);color:var(--text-light);font-size:13px;font-family:'Inter',sans-serif;
      outline:none;transition:var(--transition)}
    .const-search:focus{border-color:rgba(184,134,11,.2)}
    .const-search::placeholder{color:var(--text-muted)}
    .search-wrap{position:relative}
    .search-wrap i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:13px}
    .const-category{font-size:11px;font-weight:700;color:var(--accent-bright);text-transform:uppercase;
      letter-spacing:1px;padding:10px 0 6px;border-bottom:1px solid rgba(184,134,11,.08);margin-top:4px}
    .const-item{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;
      border-bottom:1px solid rgba(255,255,255,.02);cursor:pointer;transition:var(--transition);border-radius:8px}
    .const-item:hover{background:rgba(184,134,11,.04)}
    .const-item:active{transform:scale(.98)}
    .const-item .ci-left{display:flex;flex-direction:column;gap:2px}
    .const-item .ci-symbol{font-size:15px;font-weight:700;color:var(--text-light);font-family:'Playfair Display',serif}
    .const-item .ci-name{font-size:11px;color:var(--text-muted)}
    .const-item .ci-value{font-size:13px;color:var(--accent-bright);font-weight:600;font-family:'Inter',sans-serif}
    .const-list{max-height:calc(100vh - 280px);overflow-y:auto;padding-bottom:20px}
    .const-list::-webkit-scrollbar{width:3px}
    .const-list::-webkit-scrollbar-thumb{background:rgba(184,134,11,.2);border-radius:10px}
    .const-inserted{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);
      padding:10px 18px;border-radius:12px;background:rgba(45,125,90,.15);backdrop-filter:blur(16px);
      border:1px solid rgba(45,125,90,.25);color:var(--success);font-size:13px;z-index:300;
      opacity:0;transition:all .5s cubic-bezier(.25,1,.5,1);font-weight:600}
    .const-inserted.show{opacity:1;transform:translateX(-50%) translateY(0)}

    /* ========== CONVERSIONS TAB ========== */
    .conv-card{background:var(--bg-card);backdrop-filter:blur(10px);border:1px solid var(--card-border);
      border-radius:var(--radius);padding:16px;position:relative;overflow:hidden}
    .conv-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
      background:linear-gradient(90deg,var(--accent),var(--success),var(--accent))}
    .conv-category-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
    .conv-cat-btn{padding:7px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.05);background:transparent;
      color:var(--text-muted);font-size:11px;font-weight:600;cursor:pointer;transition:var(--transition);
      font-family:'Inter',sans-serif}
    .conv-cat-btn.active{background:rgba(184,134,11,.1);color:var(--accent-bright);border-color:rgba(184,134,11,.12)}
    .conv-cat-btn:hover:not(.active){color:var(--text-dim);border-color:rgba(255,255,255,.08)}
    .conv-fields{display:flex;flex-direction:column;gap:12px}
    .conv-field{display:flex;flex-direction:column;gap:4px}
    .conv-field label{font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
    .conv-input-row{display:flex;gap:8px;align-items:center}
    .conv-input{flex:1;padding:12px 14px;border-radius:12px;border:1px solid var(--card-border);
      background:rgba(255,255,255,.03);color:var(--text-light);font-size:18px;font-weight:600;
      font-family:'Playfair Display',serif;outline:none;transition:var(--transition);min-width:0}
    .conv-input:focus{border-color:rgba(184,134,11,.2)}
    .conv-select{padding:10px 12px;border-radius:10px;border:1px solid var(--card-border);background:var(--bg-surface);
      color:var(--text-light);font-size:12px;font-weight:600;outline:none;cursor:pointer;
      font-family:'Inter',sans-serif;min-width:90px}
    .conv-select option{background:var(--bg-dark);color:var(--text-light)}
    .conv-swap{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;
      border:1px solid rgba(184,134,11,.12);background:rgba(184,134,11,.06);color:var(--accent-bright);
      cursor:pointer;transition:var(--transition);align-self:center;font-size:14px;flex-shrink:0}
    .conv-swap:hover{background:rgba(184,134,11,.12);transform:rotate(180deg)}
    .conv-formula{font-size:11px;color:var(--text-muted);text-align:center;margin-top:4px;font-style:italic}

    /* TOAST */
    .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);
      padding:12px 20px;border-radius:12px;background:var(--bg-card);backdrop-filter:blur(16px);
      border:1px solid var(--card-border);color:var(--text-light);font-size:13px;z-index:300;
      opacity:0;transition:all .5s cubic-bezier(.25,1,.5,1);max-width:90%;text-align:center;box-shadow:var(--shadow)}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .toast .toast-icon{margin-right:8px}

    /* RESPONSIVE */
    @media(max-width:480px){
      .cb{height:42px;font-size:14px;border-radius:8px}
      .cb.fn{font-size:11px}
      .cb.num{font-size:17px}
      .cb.op{font-size:16px}
      .display-result{font-size:26px}
      .container{padding:10px 10px 24px}
      .sci-grid,.num-grid,.act-row{gap:5px}
    }
    @media(max-width:360px){
      .cb{height:38px;font-size:13px}
      .cb.fn{font-size:10px}
      .cb.num{font-size:15px}
      .display-result{font-size:22px}
    }
    @media(min-width:768px){
      .cb{height:50px}
      .sci-grid,.num-grid,.act-row{gap:8px}
    }
    @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
    a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
    ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:rgba(184,134,11,.25);border-radius:10px}
  </style>
</head>
<body>

<div class="gradient-bg"></div>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>

<!-- HEADER -->
<header class="header">
  <div class="header-left">
    <a href="index.html" class="back-btn" aria-label="Retour"><i class="fas fa-arrow-left"></i></a>
    <div class="page-title"><i class="fas fa-calculator"></i> Calculatrice</div>
  </div>
  <div class="header-right">
    <button class="mode-toggle" id="modeToggle"><i class="fas fa-rotate"></i> <span id="modeLabel">DEG</span></button>
  </div>
</header>

<!-- CONTAINER -->
<div class="container">

  <!-- TABS -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="calc"><i class="fas fa-calculator"></i> Calcul</button>
    <button class="tab-btn" data-tab="constants"><i class="fas fa-atom"></i> Constantes</button>
    <button class="tab-btn" data-tab="conversions"><i class="fas fa-right-left"></i> Conversions</button>
  </div>

  <!-- ==================== TAB: CALCULATRICE ==================== -->
  <div class="tab-panel active" id="panelCalc">

    <!-- Display -->
    <div class="display-card">
      <div class="display-meta">
        <span class="paren-count" id="parenCounter"></span>
        <span class="mem-indicator" id="memIndicator">M</span>
      </div>
      <div class="display-expression" id="displayExpr"></div>
      <div class="display-result" id="displayResult">0</div>
    </div>

    <!-- History toggle -->
    <button class="history-toggle" id="historyToggle"><i class="fas fa-chevron-down"></i> Historique</button>
    <div class="history-wrap" id="historyWrap">
      <div class="history-card" id="historyList"><div class="history-empty">Aucun calcul</div></div>
    </div>

    <!-- Actions row -->
    <div class="act-row">
      <button class="cb danger" id="btnAC">AC</button>
      <button class="cb danger" id="btnDel"><i class="fas fa-delete-left"></i></button>
      <button class="cb fn" id="btnParen" style="font-size:14px">(  )</button>
      <button class="cb op" id="btnDiv">÷</button>
    </div>

    <!-- Scientific functions -->
    <div class="sci-grid">
      <button class="cb fn" data-fn="sin">sin</button>
      <button class="cb fn" data-fn="cos">cos</button>
      <button class="cb fn" data-fn="tan">tan</button>
      <button class="cb fn" data-fn="ln">ln</button>
      <button class="cb fn" data-fn="log">log</button>

      <button class="cb fn" data-fn="asin">sin⁻¹</button>
      <button class="cb fn" data-fn="acos">cos⁻¹</button>
      <button class="cb fn" data-fn="atan">tan⁻¹</button>
      <button class="cb fn" data-fn="sqrt">√</button>
      <button class="cb fn" data-fn="cbrt">∛</button>

      <button class="cb fn" data-fn="square">x²</button>
      <button class="cb fn" data-fn="cube">x³</button>
      <button class="cb fn" data-fn="power">xⁿ</button>
      <button class="cb fn" data-fn="exp">eˣ</button>
      <button class="cb fn" data-fn="tenpow">10ˣ</button>

      <button class="cb fn" data-fn="inv">1/x</button>
      <button class="cb fn" data-fn="abs">|x|</button>
      <button class="cb fn" data-fn="fact">n!</button>
      <button class="cb fn" data-fn="mod">mod</button>
      <button class="cb fn" data-fn="percent">%</button>
    </div>

    <!-- Memory row -->
    <div class="act-row">
      <button class="cb mem" id="btnMC">MC</button>
      <button class="cb mem" id="btnMR">MR</button>
      <button class="cb mem" id="btnMPlus">M+</button>
      <button class="cb mem" id="btnMMinus">M−</button>
    </div>

    <!-- Number pad: standard layout -->
    <div class="num-grid">
      <button class="cb op" id="btnMul">×</button>
      <button class="cb num" data-n="7">7</button>
      <button class="cb num" data-n="8">8</button>
      <button class="cb num" data-n="9">9</button>

      <button class="cb op" id="btnSub">−</button>
      <button class="cb num" data-n="4">4</button>
      <button class="cb num" data-n="5">5</button>
      <button class="cb num" data-n="6">6</button>

      <button class="cb op" id="btnAdd">+</button>
      <button class="cb num" data-n="1">1</button>
      <button class="cb num" data-n="2">2</button>
      <button class="cb num" data-n="3">3</button>

      <button class="cb fn" data-const="pi">π</button>
      <button class="cb fn" data-const="e">e</button>
      <button class="cb num" data-n="0">0</button>
      <button class="cb fn" id="btnSign">+/−</button>
    </div>

    <!-- Bottom row -->
    <div class="num-grid" style="grid-template-columns:1fr 1fr 2fr">
      <button class="cb fn" data-n=".">.</button>
      <button class="cb fn" id="btnAns">Ans</button>
      <button class="cb eq" id="btnEq">=</button>
    </div>

  </div><!-- /panelCalc -->

  <!-- ==================== TAB: CONSTANTES ==================== -->
  <div class="tab-panel" id="panelConstants">
    <div class="search-wrap">
      <i class="fas fa-search"></i>
      <input type="text" class="const-search" id="constSearch" placeholder="Rechercher une constante...">
    </div>
    <div class="const-list" id="constList"></div>
    <div class="const-inserted" id="constInserted"><i class="fas fa-check"></i> Inséré dans l'expression</div>
  </div>

  <!-- ==================== TAB: CONVERSIONS ==================== -->
  <div class="tab-panel" id="panelConversions">
    <div class="conv-card">
      <div class="conv-category-row" id="convCatRow"></div>
      <div class="conv-fields">
        <div class="conv-field">
          <label>Valeur</label>
          <div class="conv-input-row">

 const h = history[parseInt(el.dataset.i)];

// ================================================================
// MATH FUNCTIONS
// ================================================================
const toRad = d => d * Math.PI / 180;
const toDeg = r => r * 180 / Math.PI;
const sinD = x => Math.sin(toRad(x));
const cosD = x => Math.cos(toRad(x));
const tanD = x => Math.tan(toRad(x));
const asinD = x => toDeg(Math.asin(x));
const acosD = x => toDeg(Math.acos(x));
const atanD = x => toDeg(Math.atan(x));

function factorial(n) {
  if (n < 0 || !Number.isInteger(n)) return NaN;
  if (n > 170) return Infinity;
  let r = 1; for (let i = 2; i <= n; i++) r *= i; return r;
}

function safeEval(raw) {
  let e = raw;
  // Fonctions trigo
  if (isDeg) {
    e = e.replace(/sin\(/g, '__sD('); e = e.replace(/cos\(/g, '__cD(');
    e = e.replace(/tan\(/g, '__tD('); e = e.replace(/asin\(/g, '__asD(');
    e = e.replace(/acos\(/g, '__acD('); e = e.replace(/atan\(/g, '__atD(');
  } else {
    e = e.replace(/sin\(/g, 'Math.sin('); e = e.replace(/cos\(/g, 'Math.cos(');
    e = e.replace(/tan\(/g, 'Math.tan('); e = e.replace(/asin\(/g, 'Math.asin(');
    e = e.replace(/acos\(/g, 'Math.acos('); e = e.replace(/atan\(/g, 'Math.atan(');
  }
  e = e.replace(/ln\(/g, 'Math.log(');  e = e.replace(/log\(/g, 'Math.log10(');
  e = e.replace(/sqrt\(/g, 'Math.sqrt('); e = e.replace(/cbrt\(/g, 'Math.cbrt(');
  e = e.replace(/abs\(/g, 'Math.abs(');  e = e.replace(/exp\(/g, 'Math.exp(');
  e = e.replace(/π/g, `(${Math.PI})`);
  // e constant (pas dans un nom de fonction)
  e = e.replace(/(?<![a-zA-Z_])e(?![a-zA-Z_(\d])/g, `(${Math.E})`);
  e = e.replace(/×/g,'*'); e = e.replace(/÷/g,'/'); e = e.replace(/−/g,'-');
  e = e.replace(/mod/g,'%');
  // Puissances
  e = e.replace(/\*\*2/g,'**2'); // déjà géré
  // Multiplicateurs implicites
  e = e.replace(/(\d)(\()/g,'$1*$2'); e = e.replace(/(\))(\d)/g,'$1*$2'); e = e.replace(/(\))\(/g,'$1*$2');
  e = e.replace(/(\))(Math\.)/g,'$1*$2'); e = e.replace(/(\))(\_)/g,'$1*$2');
  e = e.replace(/(\d)(Math\.)/g,'$1*$2'); e = e.replace(/(\d)(\_)/g,'$1*$2');

  try {
    const fn = new Function('__sD','__cD','__tD','__asD','__acD','__atD','fact',
      `'use strict';return(${e});`);
    return fn(sinD,cosD,tanD,asinD,acosD,atanD,factorial);
  } catch(err) { return NaN; }
}

});

// INPUT: OPERATORS
document.getElementById('btnAdd').addEventListener('click', () => pushOp('+'));
document.getElementById('btnSub').addEventListener('click', () => pushOp('-'));
document.getElementById('btnMul').addEventListener('click', () => pushOp('*'));
document.getElementById('btnDiv').addEventListener('click', () => pushOp('/'));

function pushOp(op) {
  done = false; displayResult.classList.remove('error');
  const sym = {'+':'+','-':'−','*':'×','/':'÷'}[op];
  expr += ` ${sym} `; calc += op; updDisp();
}

// INPUT: FUNCTIONS
document.querySelectorAll('.cb.fn[data-fn]').forEach(btn => {
  btn.addEventListener('click', () => {
    const fn = btn.dataset.fn; done = false; displayResult.classList.remove('error');
    switch(fn) {
      case 'square': if(expr){expr+='²';calc+='**2';} break;
      case 'cube': if(expr){expr+='³';calc+='**3';} break;
      case 'power': if(expr){expr+='^';calc+='**';} break;
      case 'inv':
        if(expr){expr=`1÷(${expr})`;calc=`1/(${calc})`;}
        else{expr='1÷(';calc='1/(';openP++;} break;
      case 'abs': expr+='|';calc+='abs(';openP++;break;
      case 'fact': if(expr){expr+='!';calc=`fact(${calc})`;} break;
      case 'mod': expr+=' mod ';calc+='%';break;
      case 'percent': expr+='%';calc+='/100';break;
      case 'tenpow': if(expr){expr='10^('+expr+')';calc='Math.pow(10,'+calc+')';}
        else{expr='10^(';calc='Math.pow(10,';openP++;}break;
      default: // sin cos tan ln log sqrt cbrt exp asin acos atan
        expr+=`${fn}(`;calc+=`${fn}(`;openP++;
    }
    updDisp();
  });
});

document.querySelectorAll('.cb[data-const]').forEach(btn => {

// INPUT: PARENTHESIS
document.getElementById('btnParen').addEventListener('click', () => {
  done = false; displayResult.classList.remove('error');
  const last = expr.trim().slice(-1);
  if (!expr || /[+\-×÷^(\u00d7\u00f7]$/.test(last) || openP === 0) {
    expr += '('; calc += '('; openP++;
  } else if (openP > 0) {
    expr += ')'; calc += ')'; openP--;
  } else { expr += '('; calc += '('; openP++; }
  updDisp();
});

// INPUT: +/−
document.getElementById('btnSign').addEventListener('click', () => {
  if (!expr || done) return;
  const m = expr.match(/(−?)([\d.]+)$/);
  if (m) {
    const pre = expr.slice(0, expr.length - m[0].length);
    expr = m[1] === '−' ? pre + m[2] : pre + '−' + m[2];
    calc = calc.replace(/-([\d.]+)$/, '$1').replace(/^([\d.]+)$/, '-$1');
    updDisp();
  }
});

// INPUT: Ans
document.getElementById('btnAns').addEventListener('click', () => {
  done = false; displayResult.classList.remove('error');
  expr += String(lastAns); calc += String(lastAns); updDisp();
});

// AC
document.getElementById('btnAC').addEventListener('click', () => {
  expr='';calc='';openP=0;done=false;
  displayExpr.textContent='';displayResult.textContent='0';displayResult.classList.remove('error');updParen();
});

// DEL
document.getElementById('btnDel').addEventListener('click', () => {
  if (done) { document.getElementById('btnAC').click(); return; }
  if (!expr.length) return;
  const rem = expr.slice(-1); expr = expr.slice(0,-1); calc = calc.slice(0,-1);
  if (rem==='(') openP=Math.max(0,openP-1);
  if (rem===')') openP++;
  if (expr.endsWith(' ')) { expr=expr.slice(0,-1); calc=calc.slice(0,-1); }
  if (!expr) { displayResult.textContent='0'; displayResult.classList.remove('error'); }
  updDisp();
});

// EQUALS
document.getElementById('btnEq').addEventListener('click', evaluate);

function evaluate() {
  if (!calc.trim()) return;
  let fCalc = calc, fExpr = expr;
  while (openP > 0) { fCalc += ')'; fExpr += ')'; openP = 0; }
  const r = safeEval(fCalc);
  if (isNaN(r) || !isFinite(r)) { displayResult.textContent = r===Infinity?'∞':'Erreur'; displayResult.classList.add('error'); return; }
  let fmt = Number.isInteger(r) ? r.toLocaleString('fr-FR') : parseFloat(r.toPrecision(10)).toLocaleString('fr-FR',{maximumFractionDigits:10});
  displayExpr.textContent = fExpr + ' =';
  displayResult.textContent = fmt; displayResult.classList.remove('error');
  history.push({e:fExpr,r:fmt}); if(history.length>50)history.shift(); saveH(); renderH();
  lastAns = r; expr = String(r); calc = String(r); done = true; updParen();
}

document.getElementById('btnMPlus').addEventListener('click', () => {
  if(calc.trim()){const v=safeEval(calc);if(!isNaN(v)){memory+=v;hasMem=true;memIndicator.classList.add('visible');saveM();showToast('M+ : '+memory.toLocaleString('fr-FR'));}}
});
document.getElementById('btnMMinus').addEventListener('click', () => {
  if(calc.trim()){const v=safeEval(calc);if(!isNaN(v)){memory-=v;hasMem=true;memIndicator.classList.add('visible');saveM();showToast('M− : '+memory.toLocaleString('fr-FR'));}}
});

// KEYBOARD
document.addEventListener('keydown', e => {
  const k=e.key;
  if(k>='0'&&k<='9') document.querySelector(`.cb.num[data-n="${k}"]`)?.click();
  else if(k==='.') document.querySelector('.cb.num[data-n="."]')?.click();
  else if(k==='+') pushOp('+');
  else if(k==='-') pushOp('-');
  else if(k==='*') pushOp('*');
  else if(k==='/'){e.preventDefault();pushOp('/');}
  else if(k==='Enter'||k==='='){e.preventDefault();evaluate();}
  else if(k==='Backspace') document.getElementById('btnDel')?.click();
  else if(k==='Escape') document.getElementById('btnAC')?.click();
  else if(k==='('||k===')') document.getElementById('btnParen')?.click();
  else if(k==='%') { expr+='%';calc+='/100';updDisp(); }
  else if(k==='^') { if(expr){expr+='^';calc+='**';updDisp();} }
});

function renderConstants(filter = '') {
  const f = filter.toLowerCase();
  let html = '';
  CONSTANTS.forEach(cat => {
    const filtered = cat.items.filter(it =>
      !f || it.s.toLowerCase().includes(f) || it.n.toLowerCase().includes(f) || it.u.toLowerCase().includes(f)
    );
    if (!filtered.length) return;
    html += `<div class="const-category">${cat.cat}</div>`;
    filtered.forEach(it => {
      html += `<div class="const-item" data-val="${it.v}" data-sym="${it.s}">
        <div class="ci-left"><span class="ci-symbol">${it.s}</span><span class="ci-name">${it.n}</span></div>

      </div>`;
    });
  });
  if (!html) html = '<div class="history-empty" style="padding:40px 0">Aucune constante trouvée</div>';
  constList.innerHTML = html;

  constList.querySelectorAll('.const-item').forEach(el => {
    el.addEventListener('click', () => {
      const val = el.dataset.val;
      expr += val; calc += val;
      updDisp(); displayResult.classList.remove('error'); done = false;

    });
  });
}

    labels: ['Joule (J)','Kilojoule (kJ)','Calorie (cal)','Kilocalorie (kcal)','Électronvolt (eV)','Kilowattheure (kWh)','BTU'],
    toBase: [1,1000,4.184,4184,1.602e-19,3.6e6,1055.06]
  },
  'Vitesse': {
    units: ['m/s','km/h','mph','kn','c'],
    labels: ['m/s','km/h','mph','Nœud (kn)','Vitesse lumière (c)'],
    toBase: [1,0.277778,0.44704,0.514444,299792458]
  },
  'Volume': {
    units: ['L','mL','m³','cm³','gal(US)','gal(UK)','fl oz'],
    labels: ['Litre (L)','Millilitre (mL)','m³','cm³','Gallon US','Gallon UK','Once liquide (fl oz)'],
    toBase: [1,0.001,1000,0.001,3.78541,4.54609,0.0295735]
  },
  'Temps': {
    units: ['s','min','h','jour','semaine','mois','an'],
    labels: ['Seconde (s)','Minute (min)','Heure (h)','Jour','Semaine','Mois (30j)','Année (365j)'],
    toBase: [1,60,3600,86400,604800,2592000,31536000]
  },
  'Force': {
    units: ['N','kN','dyn','kgf','lbf'],
    labels: ['Newton (N)','Kilonewton (kN)','Dyne (dyn)','Kilogramme-force (kgf)','Livre-force (lbf)'],
    toBase: [1,1000,1e-5,9.80665,4.44822]
  },
  'Puissance': {
    units: ['W','kW','MW','cv','hp','BTU/h'],
    labels: ['Watt (W)','Kilowatt (kW)','Mégawatt (MW)','Cheval (cv)','Horsepower (hp)','BTU/h'],
    toBase: [1,1000,1e6,735.499,745.7,0.293071]
  }
};

const convCatRow = document.getElementById('convCatRow');
const convFrom = document.getElementById('convFrom');
const convTo = document.getElementById('convTo');
const convFromUnit = document.getElementById('convFromUnit');
const convToUnit = document.getElementById('convToUnit');
const convFormula = document.getElementById('convFormula');
let currentConvCat = 'Longueur';

// Render category buttons
Object.keys(CONVERSIONS).forEach((cat, i) => {
  const btn = document.createElement('button');
  btn.className = 'conv-cat-btn' + (i===0?' active':'');
  btn.textContent = cat;
  btn.addEventListener('click', () => {
    document.querySelectorAll('.conv-cat-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentConvCat = cat;
    populateUnits(cat);
    doConversion();
  });
  convCatRow.appendChild(btn);
});

function populateUnits(cat) {
  const c = CONVERSIONS[cat];
  convFromUnit.innerHTML = '';
  convToUnit.innerHTML = '';
  c.labels.forEach((lbl, i) => {
  convFromUnit.innerHTML += `<option value="${i}">${lbl}</option>`;
  convToUnit.innerHTML += `<option value="${i}">${lbl}</option>`;
  });
  if (c.labels.length > 1) convToUnit.value = '1';
}
populateUnits('Longueur');

function convertTemp(val, from, to) {
  // 0=°C, 1=°F, 2=K
  let c;
  if (from===0) c=val; else if (from===1) c=(val-32)*5/9; else c=val-273.15;
  if (to===0) return c; else if (to===1) return c*9/5+32; else return c+273.15;
}

function doConversion() {
  const c = CONVERSIONS[currentConvCat];
  const val = parseFloat(convFrom.value);
  const fi = parseInt(convFromUnit.value);
  const ti = parseInt(convToUnit.value);
  if (isNaN(val)) { convTo.value = ''; convFormula.textContent = ''; return; }

  let result;
  if (c.special) {
    result = convertTemp(val, fi, ti);
  } else {
    const base = val * c.toBase[fi];
    result = base / c.toBase[ti];
  }

  // Format résultat
  let fmt;
  if (Math.abs(result) >= 1e6 || (Math.abs(result) < 0.001 && result !== 0)) {
    fmt = result.toExponential(6);
  } else {
    fmt = parseFloat(result.toPrecision(10)).toLocaleString('fr-FR', {maximumFractionDigits: 8});
  }
  convTo.value = fmt;
  convFormula.textContent = `${val} ${c.units[fi]} = ${fmt} ${c.units[ti]}`;
}

convFrom.addEventListener('input', doConversion);
convFromUnit.addEventListener('change', doConversion);
convToUnit.addEventListener('change', doConversion);

// Swap
document.getElementById('convSwap').addEventListener('click', () => {
  const tmp = convFromUnit.value;
  convFromUnit.value = convToUnit.value;
  convToUnit.value = tmp;
  const tmpVal = convTo.value;
  convFrom.value = tmpVal.replace(/\s/g, '').replace(/,/g, '.');
  doConversion();
});

doConversion();

console.log('🚀 ARVEXa School — Calculatrice Pro');
</script>
