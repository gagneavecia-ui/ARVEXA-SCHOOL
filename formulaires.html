<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="description" content="ARVEXa School - Formulaires BAC Terminale D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png" type="image/png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    :root{
      --primary:#1A3A2A;--primary-dark:#0A1A12;--primary-light:#2A5A3A;
      --accent:#B8860B;--accent-bright:#E0B84A;--accent-dim:rgba(184,134,11,.08);
      --success:#2D7D5A;--danger:#B85C3A;
      --bg-dark:#0A0A0A;--bg-surface:#141414;--bg-card:rgba(20,20,20,.7);
      --text-light:#F5F0E8;--text-dim:#8A8A7A;--text-muted:#5A5A4A;
      --card-border:rgba(184,134,11,.08);
      --transition:all .3s cubic-bezier(.25,1,.5,1);--shadow:0 8px 32px rgba(0,0,0,.4);--radius:16px;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html{scroll-behavior:smooth;width:100%;overflow-x:hidden}
    body{font-family:'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif;background:var(--bg-dark);
      color:var(--text-light);font-size:14px;line-height:1.6;min-height:100vh;width:100%;
      overflow-x:hidden;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}
    .gradient-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-2;
      background:radial-gradient(ellipse 40% 30% at 30% 15%,rgba(26,58,42,.16) 0%,transparent 70%),
                  radial-gradient(ellipse 35% 25% at 75% 85%,rgba(184,134,11,.05) 0%,transparent 60%),
                  linear-gradient(180deg,#0A0A0A 0%,#060606 100%)}
    .glow{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:-1;
      opacity:.15;animation:glowMove 10s ease-in-out infinite alternate}
    .glow-1{width:300px;height:300px;background:rgba(26,58,42,.18);top:-80px;right:-80px}
    .glow-2{width:180px;height:180px;background:rgba(184,134,11,.05);bottom:0;left:0;animation-delay:-4s}
    @keyframes glowMove{0%{transform:translate(0,0) scale(1)}100%{transform:translate(30px,-20px) scale(1.1)}}

    /* HEADER */
    .header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
      padding:10px 16px;background:rgba(10,10,10,.92);backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(184,134,11,.06);gap:12px;min-height:56px}
    .header-left{display:flex;align-items:center;gap:12px}
    .back-btn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;
      border:1px solid rgba(255,255,255,.05);background:transparent;color:var(--text-dim);cursor:pointer;
      transition:var(--transition);font-size:16px;text-decoration:none}
    .back-btn:hover{border-color:rgba(184,134,11,.14);color:var(--text-light)}
    .page-title{font-size:15px;font-weight:600;color:var(--text-light);font-family:'Playfair Display',serif}
    .page-title i{color:var(--accent-bright);margin-right:6px;font-size:14px}
    .fav-count{font-size:11px;color:var(--accent-bright);background:rgba(184,134,11,.1);
      padding:2px 8px;border-radius:10px;font-weight:700;margin-left:6px;display:none}
    .fav-count.visible{display:inline-block}

    /* CONTAINER */
    .container{max-width:720px;margin:0 auto;padding:12px 12px 32px;width:100%;display:flex;flex-direction:column;gap:10px;flex:1}

    /* SEARCH */
    .search-wrap{position:relative}
    .search-wrap i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:13px}
    .search-input{width:100%;padding:11px 14px 11px 38px;border-radius:12px;border:1px solid var(--card-border);
      background:var(--bg-card);backdrop-filter:blur(10px);color:var(--text-light);font-size:13px;
      font-family:'Inter',sans-serif;outline:none;transition:var(--transition)}
    .search-input:focus{border-color:rgba(184,134,11,.2)}
    .search-input::placeholder{color:var(--text-muted)}

    /* TABS */
    .tabs{display:flex;gap:4px;background:rgba(255,255,255,.02);border-radius:12px;padding:4px;border:1px solid rgba(255,255,255,.04)}
    .tab-btn{flex:1;padding:9px 6px;border:none;border-radius:10px;background:transparent;color:var(--text-muted);
      font-size:11px;font-weight:600;cursor:pointer;transition:var(--transition);font-family:'Inter',sans-serif;
      display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
    .tab-btn i{font-size:11px}
    .tab-btn.active{background:rgba(184,134,11,.1);color:var(--accent-bright);border:1px solid rgba(184,134,11,.12)}
    .tab-btn:not(.active){border:1px solid transparent}
    .tab-btn:hover:not(.active){color:var(--text-dim)}

    /* THEME FILTERS */
    .filters{display:flex;gap:6px;flex-wrap:wrap}
    .filter-btn{padding:6px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.05);background:transparent;
      color:var(--text-muted);font-size:11px;font-weight:600;cursor:pointer;transition:var(--transition);
      font-family:'Inter',sans-serif}
    .filter-btn.active{background:rgba(184,134,11,.1);color:var(--accent-bright);border-color:rgba(184,134,11,.12)}
    .filter-btn:hover:not(.active){color:var(--text-dim);border-color:rgba(255,255,255,.08)}

    /* CONTENT */
    .content{display:flex;flex-direction:column;gap:16px}

    /* CATEGORY */
    .category-label{font-size:11px;font-weight:700;color:var(--accent-bright);text-transform:uppercase;
      letter-spacing:1px;padding:4px 0 8px;display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(184,134,11,.06)}
    .category-label .cat-count{font-size:10px;color:var(--text-muted);font-weight:500;text-transform:none;letter-spacing:0}

    /* FORMULA CARD */
    .f-card{background:var(--bg-card);backdrop-filter:blur(10px);border:1px solid var(--card-border);
      border-radius:14px;padding:14px 16px;position:relative;overflow:hidden;transition:var(--transition)}
    .f-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
      background:linear-gradient(90deg,var(--accent),var(--success))}
    .f-card:hover{border-color:rgba(184,134,11,.12)}
    .f-card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
    .f-card-title{font-size:14px;font-weight:700;color:var(--text-light);line-height:1.4}
    .f-card-formula{font-size:17px;font-weight:600;color:var(--accent-bright);font-family:'Playfair Display',serif;
      padding:10px 0;line-height:1.6;word-break:break-word;border-top:1px solid rgba(255,255,255,.03);
      border-bottom:1px solid rgba(255,255,255,.03);margin:4px 0}
    .f-card-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
    .f-tag{font-size:10px;padding:3px 8px;border-radius:8px;font-weight:600}
    .f-tag.units{background:rgba(26,58,42,.12);color:var(--success)}
    .f-tag.condition{background:rgba(184,134,11,.06);color:var(--accent-bright)}
    .f-card-note{font-size:11px;color:var(--text-muted);margin-top:8px;line-height:1.5;font-style:italic}

    /* FAVORITE BTN */
    .fav-btn{background:none;border:none;color:var(--text-muted);font-size:16px;cursor:pointer;
      transition:var(--transition);padding:2px;flex-shrink:0}
    .fav-btn:hover{color:var(--accent-bright)}
    .fav-btn.active{color:var(--accent-bright)}
    .fav-btn.active i{font-weight:900}

    /* EMPTY */
    .empty-state{text-align:center;padding:40px 20px}
    .empty-state i{font-size:32px;color:var(--text-muted);margin-bottom:10px}
    .empty-state h4{font-size:15px;color:var(--text-light);margin-bottom:4px}
    .empty-state p{font-size:12px;color:var(--text-dim)}

    /* TOAST */
    .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);
      padding:12px 20px;border-radius:12px;background:var(--bg-card);backdrop-filter:blur(16px);
      border:1px solid var(--card-border);color:var(--text-light);font-size:13px;z-index:300;
      opacity:0;transition:all .5s cubic-bezier(.25,1,.5,1);max-width:90%;text-align:center;box-shadow:var(--shadow)}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .toast .toast-icon{margin-right:8px}

    /* RESPONSIVE */
    @media(max-width:480px){
      .f-card-formula{font-size:15px}
      .container{padding:10px 10px 24px}
      .tab-btn{font-size:10px;padding:8px 4px}
    }
    @media(min-width:768px){.container{padding:16px 16px 32px}}
    @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
    a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
    ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:rgba(184,134,11,.25);border-radius:10px}
  </style>
</head>
<body>

<div class="gradient-bg"></div>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>

<header class="header">
  <div class="header-left">
    <a href="index.html" class="back-btn" aria-label="Retour"><i class="fas fa-arrow-left"></i></a>
    <div class="page-title"><i class="fas fa-flask"></i> Formulaires <span class="fav-count" id="favCount">0</span></div>
  </div>
</header>

<div class="container">
  <div class="search-wrap">
    <i class="fas fa-search"></i>
    <input type="text" class="search-input" id="searchInput" placeholder="Rechercher une formule...">
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="filters" id="filters"></div>
  <div class="content" id="content"></div>
</div>

<div class="toast" id="toast">
  <span class="toast-icon"><i class="fas fa-check-circle"></i></span>
  <span class="toast-message"></span>
</div>

<script type="importmap">
{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js","firebase/auth":"https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js"}}
</script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyDHscOXw3rLuhV6z1Cny-bdYCumqpnG7QE",authDomain:"arvexa-fbf10.firebaseapp.com",
  projectId:"arvexa-fbf10",storageBucket:"arvexa-fbf10.firebasestorage.app",messagingSenderId:"920108330053",
  appId:"1:920108330053:web:f532d71cbc2c824bc7472c"};
const app=initializeApp(firebaseConfig);const auth=getAuth(app);
onAuthStateChanged(auth,u=>{if(!u)window.location.href='login.html';});

// ================================================================
// DATA : Toutes les formules BAC Terminale D
// ================================================================
const FORMULAS = [
  // ======================== MATHÉMATIQUES ========================
  {id:'m1',subj:'maths',theme:'Limites',name:'Limite en l\'infini de eˣ / xⁿ',formula:'lim (eˣ / xⁿ) = +∞',units:'n ∈ ℕ*',note:'L\'exponentielle l\'emporte sur toute puissance de x.'},
  {id:'m2',subj:'maths',theme:'Limites',name:'Limite en l\'infini de ln(x) / xⁿ',formula:'lim (ln(x) / xⁿ) = 0',units:'n ∈ ℕ*',note:'Le logarithme est négligeable devant toute puissance de x.'},
  {id:'m3',subj:'maths',theme:'Limites',name:'Limite de ln(1+x)/x en 0',formula:'lim ln(1+x)/x = 1',units:'x → 0',note:''},
  {id:'m4',subj:'maths',theme:'Limites',name:'Limite de (eˣ - 1)/x en 0',formula:'lim (eˣ − 1)/x = 1',units:'x → 0',note:''},
  {id:'m5',subj:'maths',theme:'Limites',name:'Croissances comparées',formula:'lim xⁿ × e⁻ˣ = 0  et  lim ln(x) × x⁻ⁿ = 0',units:'x → +∞, n ∈ ℕ*',note:'À retenir pour les comparaisons de fonctions.'},
  {id:'m6',subj:'maths',theme:'Limites',name:'Nombre de Neper',formula:'lim (1 + 1/n)ⁿ = e',units:'n → +∞',note:'e ≈ 2,71828...'},
  {id:'m7',subj:'maths',theme:'Dérivées',name:'Dérivées usuelles',formula:'(xⁿ)\' = nxⁿ⁻¹\n(1/x)\' = −1/x²\n(√x)\' = 1/(2√x)\n(eˣ)\' = eˣ\n(ln x)\' = 1/x\n(cos x)\' = −sin x\n(sin x)\' = cos x\n(tan x)\' = 1 + tan²x',note:'Les fonctions usuelles à connaître par cœur.'},
  {id:'m8',subj:'maths',theme:'Dérivées',name:'Opérations sur les dérivées',formula:'(u + v)\' = u\' + v\'\n(uv)\' = u\'v + uv\'\n(u/v)\' = (u\'v − uv\') / v²\n(f ∘ g)\' = g\' × (f\' ∘ g)\n(1/u)\' = −u\'/u²\n(√u)\' = u\'/(2√u)',note:'Formules fondamentales de dérivation.'},
  {id:'m9',subj:'maths',theme:'Dérivées',name:'Dérivée de ln(u) et exp(u)',formula:'(ln u)\' = u\'/u\n(eᵘ)\' = u\' × eᵘ',condition:'u > 0 pour ln(u)',note:''},

  {id:'m10',subj:'maths',theme:'Logarithme népérien',name:'Propriétés du logarithme',formula:'ln(ab) = ln(a) + ln(b)\nln(a/b) = ln(a) − ln(b)\nln(aⁿ) = n × ln(a)\nln(1) = 0  et  ln(e) = 1',condition:'a > 0, b > 0',note:'Le logarithme transforme les produits en sommes.'},
  {id:'m11',subj:'maths',theme:'Logarithme népérien',name:'Propriétés de l\'exponentielle',formula:'eᵃ⁺ᵇ = eᵃ × eᵇ\neᵃ⁻ᵇ = eᵃ / eᵇ\n(eᵃ)ⁿ = eⁿᵃ\ne⁰ = 1  et  e¹ = e',note:''},
  {id:'m12',subj:'maths',theme:'Logarithme népérien',name:'Relation ln / exp',formula:'ln(eˣ) = x\ne^(ln x) = x',condition:'x ∈ ℝ et x > 0',note:'Ce sont des fonctions réciproques.'},
  {id:'m13',subj:'maths',theme:'Logarithme népérien',name:'Logarithme décimal',formula:'log(x) = ln(x) / ln(10)',note:'log(10) = 1, utilisé en chimie pour le pH.'},

  {id:'m14',subj:'maths',theme:'Suites',name:'Suite arithmétique',formula:'uₙ₊₁ = uₙ + r\nuₙ = u₀ + n × r\nSₙ = (n+1)(u₀ + uₙ) / 2',units:'r = raison, Sₙ = somme des n+1 premiers termes',note:'Chaque terme diffère du précédent d\'une constante r.'},
  {id:'m15',subj:'maths',theme:'Suites',name:'Suite géométrique',formula:'uₙ₊₁ = uₙ × q\nuₙ = u₀ × qⁿ\nSₙ = u₀ × (1 − qⁿ⁺¹) / (1 − q)',units:'q = raison, q ≠ 1',note:'Chaque terme est multiplié par une constante q.'},
  {id:'m16',subj:'maths',theme:'Suites',name:'Limite d\'une suite géométrique',formula:'Si |q| < 1 :  lim qⁿ = 0\nSi q > 1 :  lim qⁿ = +∞',units:'n → +∞',note:''},
  {id:'m17',subj:'maths',theme:'Suites',name:'Raisonnement par récurrence',formula:'1) Initialisation : P(0) vraie\n2) Hérédité : P(n) ⇒ P(n+1)\n3) Conclusion : P(n) vraie pour tout n',note:'Méthode de démonstration fondamentale.'},

  {id:'m18',subj:'maths',theme:'Intégrales',name:'Définition de l\'intégrale',formula:'∫ₐᵇ f(x) dx = F(b) − F(a)',units:'F = primitive de f',note:'F est une primitive de f si F\'(x) = f(x).'},
  {id:'m19',subj:'maths',theme:'Intégrales',name:'Linéarité de l\'intégrale',formula:'∫ (af + bg) = a∫f + b∫g',condition:'a, b constantes',note:''},
  {id:'m20',subj:'maths',theme:'Intégrales',name:'Relation de Chasles',formula:'∫ₐᶜ f(x)dx = ∫ₐᵇ f(x)dx + ∫ᵦᶜ f(x)dx',note:''},
  {id:'m21',subj:'maths',theme:'Intégrales',name:'Intégration par parties',formula:'∫ₐᵇ u\'(x)v(x)dx = [u(x)v(x)]ₐᵇ − ∫ₐᵇ u(x)v\'(x)dx',note:'Très utile pour intégrer un produit.'},
  {id:'m22',subj:'maths',theme:'Intégrales',name:'Primitives usuelles',formula:'∫ xⁿ dx = xⁿ⁺¹/(n+1)  (n ≠ −1)\n∫ 1/x dx = ln|x|\n∫ eˣ dx = eˣ\n∫ cos x dx = sin x\n∫ sin x dx = −cos x',note:''},
  {id:'m23',subj:'maths',theme:'Intégrales',name:'Valeur moyenne',formula:'f̄ = 1/(b−a) × ∫ₐᵇ f(x) dx',units:'sur [a, b]',note:''},
  {id:'m24',subj:'maths',theme:'Intégrales',name:'Aire sous la courbe',formula:'A = ∫ₐᵇ |f(x) − g(x)| dx',units:'en unités d\'aire (u.a.)',note:'L\'aire entre deux courbes.'},

  {id:'m25',subj:'maths',theme:'Probabilités',name:'Probabilités de base',formula:'P(A̅) = 1 − P(A)\nP(A ∪ B) = P(A) + P(B) − P(A ∩ B)',note:'A̅ = événement contraire.'},
  {id:'m26',subj:'maths',theme:'Probabilités',name:'Probabilité conditionnelle',formula:'P_A(B) = P(A ∩ B) / P(A)',condition:'P(A) ≠ 0',note:'Probabilité de B sachant A réalisé.'},
  {id:'m27',subj:'maths',theme:'Probabilités',name:'Formule des probabilités totales',formula:'P(B) = Σᵢ P(Aᵢ) × P_{Aᵢ}(B)',condition:'(Aᵢ) système complet',note:''},
  {id:'m28',subj:'maths',theme:'Probabilités',name:'Loi binomiale',formula:'P(X = k) = C(n,k) × pᵏ × (1−p)ⁿ⁻ᵏ\nE(X) = np\nV(X) = np(1−p)',units:'C(n,k) = n! / (k!(n−k)!)',note:'Schéma de Bernoulli répété n fois.'},
  {id:'m29',subj:'maths',theme:'Probabilités',name:'Loi normale N(μ, σ²)',formula:'f(x) = 1/(σ√(2π)) × e^(−(x−μ)²/(2σ²))\nE(X) = μ\nV(X) = σ²',units:'μ = espérance, σ = écart-type',note:'Courbe en cloche, symétrique autour de μ.'},
  {id:'m30',subj:'maths',theme:'Probabilités',name:'Loi normale centrée réduite',formula:'Z = (X − μ) / σ  →  N(0, 1)\nP(μ − σ < X < μ + σ) ≈ 0,68\nP(μ − 2σ < X < μ + 2σ) ≈ 0,95',note:''},
  {id:'m31',subj:'maths',theme:'Probabilités',name:'Intervalle de confiance',formula:'IC = [f − 1/√n ; f + 1/√n]',condition:'n ≥ 30, confiance 95%',units:'f = fréquence observée',note:''},

  {id:'m32',subj:'maths',theme:'Nombres complexes',name:'Forme algébrique',formula:'z = a + ib\n|z| = √(a² + b²)\nz̅ = a − ib\nz × z̅ = |z|² = a² + b²',units:'i² = −1',note:''},
  {id:'m33',subj:'maths',theme:'Nombres complexes',name:'Forme trigonométrique et exponentielle',formula:'z = r(cos θ + i sin θ) = r × e^(iθ)\nr = |z|,  θ = arg(z)',note:''},
  {id:'m34',subj:'maths',theme:'Nombres complexes',name:'Formule de Moivre',formula:'(cos θ + i sin θ)ⁿ = cos(nθ) + i sin(nθ)',units:'n ∈ ℤ',note:'Permet de calculer les puissances de complexes.'},
  {id:'m35',subj:'maths',theme:'Nombres complexes',name:'Formules d\'Euler',formula:'e^(iθ) = cos θ + i sin θ\ncos θ = (e^(iθ) + e^(−iθ)) / 2\nsin θ = (e^(iθ) − e^(−iθ)) / (2i)',note:''},
  {id:'m36',subj:'maths',theme:'Nombres complexes',name:'Affixe et géométrie',formula:'AB = |zB − zA|\narg(zB − zA) = angle (u⃗, AB⃗)',note:'Lien entre complexes et géométrie plane.'},

  {id:'m37',subj:'maths',theme:'Fonctions trigonométriques',name:'Formules fondamentales',formula:'cos²x + sin²x = 1\ncos(2x) = cos²x − sin²x = 2cos²x − 1 = 1 − 2sin²x\nsin(2x) = 2sinx cosx',note:''},
  {id:'m38',subj:'maths',theme:'Fonctions trigonométriques',name:'Formules d\'addition',formula:'cos(a+b) = cos a cos b − sin a sin b\nsin(a+b) = sin a cos b + cos a sin b\ntan(a+b) = (tan a + tan b)/(1 − tan a tan b)',note:''},

// ================================================================
// STATE
// ================================================================
const TABS = [
  {id:'maths',label:'Mathématiques',icon:'fa-square-root-variable'},
  {id:'physique',label:'Physique',icon:'fa-bolt'},
  {id:'chimie',label:'Chimie',icon:'fa-flask'},
  {id:'favs',label:'Favoris',icon:'fa-heart'}
];
let activeTab = 'maths';
let activeTheme = 'all';
let searchQuery = '';
let favorites = JSON.parse(localStorage.getItem('arvexa_fav_formulas') || '[]');

const tabsEl = document.getElementById('tabs');
const filtersEl = document.getElementById('filters');
const contentEl = document.getElementById('content');
const searchInput = document.getElementById('searchInput');
const favCountEl = document.getElementById('favCount');

// ================================================================
// RENDER TABS
// ================================================================
function renderTabs() {
  tabsEl.innerHTML = TABS.map(t =>
    `<button class="tab-btn ${t.id===activeTab?'active':''}" data-tab="${t.id}"><i class="fas ${t.icon}"></i> ${t.label}</button>`
  ).join('');
  tabsEl.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      activeTheme = 'all';
      renderTabs(); renderFilters(); renderContent();
    });
  });
}

// ================================================================
// RENDER FILTERS
// ================================================================
function getThemes(subj) {
  const themes = [...new Set(FORMULAS.filter(f => f.subj === subj).map(f => f.theme))];
  return ['all', ...themes];
}

function renderFilters() {
  if (activeTab === 'favs' || searchQuery) { filtersEl.innerHTML = ''; return; }
  const themes = getThemes(activeTab);
  const labels = { all: 'Tout' };
  filtersEl.innerHTML = themes.map(t =>
    `<button class="filter-btn ${t===activeTheme?'active':''}" data-theme="${t}">${labels[t] || t}</button>`
  ).join('');
  filtersEl.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTheme = btn.dataset.theme;
      renderFilters(); renderContent();
    });
  });
}

// ================================================================
// RENDER CONTENT
// ================================================================
function getFiltered() {
  let list = FORMULAS;
  // Tab
  if (activeTab === 'favs') list = list.filter(f => favorites.includes(f.id));
  else list = list.filter(f => f.subj === activeTab);
  // Theme
  if (activeTheme !== 'all' && activeTab !== 'favs') list = list.filter(f => f.theme === activeTheme);
  // Search
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = FORMULAS.filter(f =>
      f.name.toLowerCase().includes(q) || f.formula.toLowerCase().includes(q) ||
      f.theme.toLowerCase().includes(q) || f.note.toLowerCase().includes(q) ||
      (f.units && f.units.toLowerCase().includes(q))
    );
  }
  return list;
}

function renderContent() {
  const list = getFiltered();
  if (!list.length) {
    contentEl.innerHTML = `<div class="empty-state"><i class="fas fa-${activeTab==='favs'?'heart':'search'}"></i>
      <h4>${activeTab==='favs'?'Aucun favori':'Aucun résultat'}</h4>
      <p>${activeTab==='favs'?'Appuie sur le cœur pour sauvegarder une formule.':'Essaye un autre terme de recherche.'}</p></div>`;
    return;
  }
  // Group by theme
  const groups = {};
  list.forEach(f => { (groups[f.theme] = groups[f.theme] || []).push(f); });
  let html = '';
  Object.entries(groups).forEach(([theme, items]) => {
    html += `<div class="category-label">${theme} <span class="cat-count">${items.length} formule${items.length>1?'s':''}</span></div>`;
    items.forEach(f => {
      const isFav = favorites.includes(f.id);
      html += `<div class="f-card" id="card-${f.id}">
        <div class="f-card-header">
          <div class="f-card-title">${f.name}</div>
          <button class="fav-btn ${isFav?'active':''}" data-id="${f.id}" aria-label="Favori">
            <i class="fa${isFav?'s':'r'} fa-heart"></i>
          </button>
        </div>
        <div class="f-card-formula">${formatFormula(f.formula)}</div>
        <div class="f-card-meta">
          ${f.units?`<span class="f-tag units"><i class="fas fa-ruler" style="margin-right:4px;font-size:9px"></i>${f.units}</span>`:''}
          ${f.condition?`<span class="f-tag condition"><i class="fas fa-info-circle" style="margin-right:4px;font-size:9px"></i>${f.condition}</span>`:''}
        </div>
        ${f.note?`<div class="f-card-note"><i class="fas fa-lightbulb" style="margin-right:4px;color:var(--accent);font-size:10px"></i>${f.note}</div>`:''}
      </div>`;
    });
  });
  contentEl.innerHTML = html;

  // Favorite buttons
  contentEl.querySelectorAll('.fav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
 const id = btn.dataset.id;
      if (favorites.includes(id)) {
        favorites = favorites.filter(f => f !== id);
        btn.classList.remove('active');
        btn.querySelector('i').className = 'far fa-heart';
      } else {
        favorites.push(id);
        btn.classList.add('active');
        btn.querySelector('i').className = 'fas fa-heart';
      }
      localStorage.setItem('arvexa_fav_formulas', JSON.stringify(favorites));
      updateFavCount();
    });
  });
}

function formatFormula(text) {
  return text.replace(/\n/g, '<br>').replace(/×/g, '×').replace(/−/g, '−');
}

function updateFavCount() {
 favCountEl.textContent = favorites.length;
  favCountEl.classList.toggle('visible', favorites.length > 0);
}

// ================================================================
// SEARCH
// ================================================================
searchInput.addEventListener('input', () => {
  searchQuery = searchInput.value.trim();
  renderFilters(); renderContent();
});

// ================================================================
// TOAST
// ================================================================
const toast=document.getElementById('toast');const toastMsg=document.querySelector('.toast-message');
function showToast(m){toastMsg.textContent=m;toast.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove('show'),2000);}

// ================================================================
// INIT
// ================================================================
renderTabs();
renderFilters();
renderContent();
updateFavCount();

console.log('🚀 ARVEXa School — Formulaires BAC');
</script>
