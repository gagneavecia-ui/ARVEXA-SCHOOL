<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="description" content="ARVEXA School - Lecture">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png" type="image/png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       ROOT — Design system ARVEXA
       ============================================================ */
    :root {
      --primary: #1A3A2A;
      --primary-dark: #0A1A12;
      --accent: #B8860B;
      --accent-bright: #E0B84A;
      --success: #2D7D5A;
      --danger: #B85C3A;
      --bg-dark: #0A0A0A;
      --bg-surface: #141414;
      --bg-card: rgba(20, 20, 20, 0.7);
      --text-light: #F5F0E8;
      --text-dim: #8A8A7A;
      --text-muted: #5A5A4A;
      --card-border: rgba(184, 134, 11, 0.08);
      --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      --radius: 16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; width: 100%; overflow-x: hidden; height: 100%; }
    body {
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      font-size: 15px;
      line-height: 1.8;
      min-height: 100vh;
      height: 100%;
      width: 100%;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
    }

    .gradient-bg {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
      background: radial-gradient(ellipse 40% 30% at 30% 15%, rgba(26, 58, 42, 0.16) 0%, transparent 70%),
                  radial-gradient(ellipse 35% 25% at 75% 85%, rgba(184, 134, 11, 0.05) 0%, transparent 60%),
                  linear-gradient(180deg, #0A0A0A 0%, #060606 100%);
    }

    /* ============================================================
       HEADER - MINIMAL
       ============================================================ */
    .header {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; justify-content: space-between;
      padding: clamp(6px, 0.8vw, 10px) clamp(10px, 1.5vw, 16px);
      background: rgba(10, 10, 10, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(184, 134, 11, 0.06);
      gap: 8px;
      min-height: clamp(44px, 6vw, 52px);
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: clamp(8px, 1vw, 14px); min-width: 0; }
    .header .back-btn {
      display: flex; align-items: center; justify-content: center;
      width: clamp(30px, 4vw, 38px);
      height: clamp(30px, 4vw, 38px);
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.05);
      background: transparent;
      color: var(--text-dim);
      cursor: pointer; transition: var(--transition);
      font-size: clamp(13px, 1.5vw, 16px);
      text-decoration: none; flex-shrink: 0;
    }
    .header .back-btn:hover { border-color: rgba(184,134,11,0.14); color: var(--text-light); }
    .header .header-title {
      font-size: clamp(12px, 1.3vw, 15px);
      font-weight: 600; color: var(--text-light);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: clamp(100px, 30vw, 280px);
    }
    .header .header-title i { color: var(--accent-bright); margin-right: 4px; font-size: clamp(11px, 1.2vw, 14px); }
    .header .notes-btn {
      display: flex; align-items: center; gap: clamp(4px, 0.6vw, 8px);
      padding: clamp(4px, 0.6vw, 8px) clamp(10px, 1.2vw, 16px);
      border-radius: 20px;
      border: 1px solid rgba(184,134,11,0.12);
      background: rgba(184,134,11,0.06);
      color: var(--accent-bright);
      font-size: clamp(11px, 1.1vw, 13px);
      font-weight: 600;
      cursor: pointer; transition: var(--transition);
      font-family: 'Inter', sans-serif;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .header .notes-btn:hover {
      background: rgba(184,134,11,0.12);
      transform: scale(1.02);
    }
    .header .notes-btn i { font-size: clamp(11px, 1.2vw, 14px); }
    .header .notes-btn .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--success); display: none;
    }
    .header .notes-btn .dot.show { display: inline-block; }

    /* ============================================================
       CONTENT WRAPPER
       ============================================================ */
    .content-wrapper {
      flex: 1;
      overflow-y: auto;
      padding: clamp(10px, 1.5vw, 20px) clamp(12px, 2vw, 24px) clamp(60px, 8vw, 100px);
      max-width: 820px;
      margin: 0 auto;
      width: 100%;
    }
    .content-wrapper::-webkit-scrollbar { width: 4px; }
    .content-wrapper::-webkit-scrollbar-track { background: transparent; }
    .content-wrapper::-webkit-scrollbar-thumb { background: rgba(184,134,11,0.2); border-radius: 10px; }

    /* ============================================================
       CONTENT BODY
       ============================================================ */
    #contentBody {
      background: transparent;
      min-height: 200px;
      padding: 0;
    }
    #contentBody .loading-state {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 60px 20px; gap: 12px;
    }
    #contentBody .spinner {
      width: clamp(28px, 4vw, 36px);
      height: clamp(28px, 4vw, 36px);
      border: 3px solid rgba(184,134,11,0.15);
      border-top-color: var(--accent-bright);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #contentBody .loading-state p { font-size: clamp(12px, 1.2vw, 14px); color: var(--text-muted); }

    /* ============================================================
       CONTENU HTML - STYLES DE LECTURE
       ============================================================ */
    .lecture-container {
      max-width: 780px;
      margin: 0 auto;
      padding: 0 4px;
      color: var(--text-light);
    }

    .lecture-chapter-header {
      margin-bottom: clamp(24px, 3vw, 36px);
      padding-bottom: clamp(16px, 2vw, 24px);
      border-bottom: 1px solid rgba(184, 134, 11, 0.08);
    }
    .lecture-chapter-meta {
      display: flex; align-items: center; gap: clamp(8px, 1vw, 14px);
      margin-bottom: 4px;
      flex-wrap: wrap;
    }
    .lecture-chapter-number {
      font-size: clamp(11px, 1.1vw, 13px);
      font-weight: 700; color: var(--accent-bright);
      letter-spacing: 2px; text-transform: uppercase;
    }
    .lecture-chapter-badge {
      font-size: clamp(9px, 0.9vw, 11px);
      font-weight: 600; color: #0A0A0A;
      background: var(--accent);
      padding: 1px 12px; border-radius: 12px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .lecture-chapter-title {
      font-family: 'Playfair Display', 'Georgia', serif;
      font-size: clamp(22px, 3.5vw, 32px);
      font-weight: 700; color: var(--text-light);
      line-height: 1.2; margin: 4px 0 8px;
    }
    .lecture-chapter-title .highlight {
      color: var(--accent-bright);
      font-style: italic;
    }
    .lecture-chapter-divider {
      width: clamp(40px, 6vw, 60px);
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent-bright));
      border-radius: 4px;
    }

    .lecture-section {
      margin-bottom: clamp(20px, 2.5vw, 32px);
    }
    .lecture-section-title {
      font-family: 'Playfair Display', 'Georgia', serif;
      font-size: clamp(18px, 2.2vw, 24px);
      font-weight: 700; color: #3b82f6;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(59, 130, 246, 0.08);
    }
    .lecture-section-title::before {
      content: '';
      display: inline-block;
      width: 6px; height: 6px;
      background: var(--accent-bright);
      border-radius: 50%;
      margin-right: 10px;
      vertical-align: middle;
    }

    .lecture-text {
      color: #c8d0dc;
      font-size: clamp(14px, 1.4vw, 17px);
      line-height: 1.9;
      margin-bottom: 14px;
    }
    .lecture-text strong { color: var(--text-light); }

    .math {
      background: rgba(59, 130, 246, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.04);
      padding: 2px 10px;
      border-radius: 6px;
      font-family: 'Playfair Display', 'Georgia', serif;
      font-size: clamp(14px, 1.4vw, 18px);
      color: #e8ecf8;
      white-space: nowrap;
      display: inline-block;
    }

    .lecture-list {
      padding-left: 0;
      list-style: none;
      margin: 12px 0;
    }
    .lecture-list li {
      position: relative;
      padding-left: 24px;
      margin-bottom: 8px;
      color: #c8d0dc;
      line-height: 1.7;
      font-size: clamp(14px, 1.3vw, 16px);
    }
    .lecture-list li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 10px;
      width: 8px;
      height: 8px;
      background: linear-gradient(135deg, var(--accent-bright), #3b82f6);
      border-radius: 50%;
    }
    .lecture-list li .term { color: var(--text-light); }

    .lecture-card {
      display: flex;
      align-items: flex-start;
      gap: clamp(10px, 1.4vw, 16px);
      background: rgba(255, 255, 255, 0.02);
      border-radius: 12px;
      padding: clamp(12px, 1.5vw, 18px) clamp(14px, 1.8vw, 20px);
      margin: 16px 0;
      border-left: 4px solid var(--accent-bright);
    }
    .lecture-card-icon {
      font-size: clamp(18px, 2vw, 22px);
      flex-shrink: 0;
      margin-top: 2px;
    }
    .lecture-card-content { flex: 1; min-width: 0; }
    .lecture-card-label {
      font-size: clamp(9px, 0.9vw, 11px);
      font-weight: 700; text-transform: uppercase;
      letter-spacing: 1.5px; color: var(--accent-bright);
      margin-bottom: 4px;
    }
    .lecture-card p {
      color: #c8d0dc;
      font-size: clamp(13px, 1.3vw, 15px);
      line-height: 1.7;
      margin: 0;
    }
    .lecture-card p strong { color: var(--text-light); }

    .lecture-card-remember { border-left-color: var(--success); }
    .lecture-card-remember .lecture-card-label { color: var(--success); }
    .lecture-card-warning { border-left-color: #ef4444; }
    .lecture-card-warning .lecture-card-label { color: #ef4444; }
    .lecture-card-tip { border-left-color: #3b82f6; }
    .lecture-card-tip .lecture-card-label { color: #60a5fa; }

    .lecture-formula-box {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.06), rgba(184, 134, 11, 0.03));
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-left: 4px solid #3b82f6;
      border-radius: 10px;
      padding: clamp(12px, 1.5vw, 18px) clamp(14px, 1.8vw, 22px);
      margin: 14px 0;
      text-align: center;
    }
    .lecture-formula-main {
      font-family: 'Playfair Display', 'Georgia', serif;
      font-size: clamp(18px, 2.2vw, 24px);
      font-weight: 700; color: #e8ecf8;
      line-height: 1.6;
    }
    .lecture-formula-desc {
      font-size: clamp(11px, 1.1vw, 13px);
      color: var(--text-muted);
      margin-top: 4px;
    }

    .lecture-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(8px, 1vw, 14px);
      margin: 14px 0;
    }
    .lecture-formula {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 10px;
      padding: clamp(10px, 1.2vw, 14px) clamp(12px, 1.4vw, 16px);
      text-align: center;
    }
    .lecture-formula-label {
      font-size: clamp(11px, 1.1vw, 13px);
      color: var(--text-muted);
      display: block;
      font-weight: 500;
    }
    .lecture-formula-value {
      font-family: 'Playfair Display', 'Georgia', serif;
      font-size: clamp(18px, 2.2vw, 24px);
      font-weight: 700;
      color: var(--accent-bright);
      display: block;
      margin-top: 2px;
    }

    .lecture-example {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      padding: clamp(12px, 1.5vw, 18px) clamp(14px, 1.8vw, 22px);
      margin: 16px 0;
    }
    .lecture-example-label {
      font-size: clamp(10px, 1vw, 12px);
      font-weight: 700; color: var(--accent-bright);
      text-transform: uppercase; letter-spacing: 1.5px;
      margin-bottom: 6px;
    }
    .lecture-example-content {
      color: #c8d0dc;
      line-height: 1.8;
      font-size: clamp(13px, 1.3vw, 15px);
    }
    .lecture-example-content p {
      margin-bottom: 8px;
      color: #c8d0dc;
    }
    .lecture-example-content p:last-child { margin-bottom: 0; }
    .lecture-example-content .math { font-size: clamp(13px, 1.3vw, 16px); }

    .lecture-steps { margin: 16px 0; }
    .lecture-step {
      display: flex;
      align-items: flex-start;
      gap: clamp(10px, 1.2vw, 16px);
      margin-bottom: clamp(8px, 1vw, 14px);
    }
    .lecture-step-number {
      flex-shrink: 0;
      width: clamp(26px, 3.5vw, 32px);
      height: clamp(26px, 3.5vw, 32px);
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-family: 'Playfair Display', serif;
      font-size: clamp(12px, 1.4vw, 15px);
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.2);
    }
    .lecture-step-content { flex: 1; padding-top: 2px; }
    .lecture-step-content strong {
      color: var(--text-light);
      display: block;
      font-size: clamp(12px, 1.2vw, 14px);
      margin-bottom: 1px;
    }
    .lecture-step-content p {
      color: #c8d0dc;
      font-size: clamp(12px, 1.2vw, 14px);
      margin: 0;
      line-height: 1.6;
    }

    .lecture-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(184, 134, 11, 0.15), transparent);
      margin: clamp(28px, 4vw, 40px) 0 clamp(24px, 3.5vw, 36px);
    }

    .lecture-end {
      text-align: center;
      margin-top: clamp(28px, 4vw, 40px);
      padding-top: 20px;
    }
    .lecture-end-text {
      font-size: clamp(12px, 1.2vw, 14px);
      color: var(--text-muted);
      font-style: italic;
    }
    .lecture-end-divider {
      width: 40px;
      height: 2px;
      background: var(--accent-bright);
      margin: 12px auto 0;
      border-radius: 4px;
      opacity: 0.3;
    }

    /* ============================================================
       PREMIUM BLOCKED
       ============================================================ */
    .premium-blocked {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center;
      padding: clamp(40px, 8vw, 80px) 20px;
      min-height: 300px; gap: 16px;
    }
    .premium-blocked .premium-blocked-icon {
      width: clamp(64px, 10vw, 80px);
      height: clamp(64px, 10vw, 80px);
      border-radius: 50%;
      background: rgba(184,134,11,0.1);
      border: 2px solid rgba(184,134,11,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(28px, 4vw, 38px);
      color: var(--accent-bright);
    }
    .premium-blocked h2 {
      font-size: clamp(20px, 2.8vw, 26px);
      font-weight: 700; font-family: 'Playfair Display', serif;
      color: var(--text-light);
    }
    .premium-blocked p {
      font-size: clamp(13px, 1.3vw, 15px);
      color: var(--text-dim); max-width: 400px;
    }
    .premium-blocked .btn-premium {
      display: inline-block; padding: clamp(10px, 1.2vw, 14px) clamp(24px, 3vw, 36px);
      border-radius: 30px;
      background: linear-gradient(135deg, var(--accent-bright), var(--accent));
      color: #0A0A0A; font-weight: 700;
      font-size: clamp(13px, 1.3vw, 15px);
      text-decoration: none; transition: var(--transition);
      margin-top: 6px;
    }
    .premium-blocked .btn-premium:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 30px rgba(184,134,11,0.25);
    }

    /* ============================================================
       EMPTY STATE
       ============================================================ */
    .empty-state {
      text-align: center; padding: clamp(40px, 8vw, 80px) 20px;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    .empty-state .es-icon {
      width: clamp(56px, 8vw, 72px);
      height: clamp(56px, 8vw, 72px);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(184,134,11,0.06);
      border: 1px solid rgba(184,134,11,0.08);
      font-size: clamp(20px, 3vw, 28px);
      color: var(--text-muted);
    }
    .empty-state h4 {
      font-size: clamp(15px, 1.8vw, 19px);
      color: var(--text-dim); font-weight: 600;
    }
    .empty-state p {
      font-size: clamp(12px, 1.2vw, 14px);
      color: var(--text-muted); max-width: 400px;
    }

    /* ============================================================
       NAVIGATION
       ============================================================ */
    .nav-bar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; margin-top: clamp(16px, 2vw, 28px);
      flex-wrap: wrap;
    }
    .nav-btn {
      display: inline-flex; align-items: center; gap: clamp(6px, 0.8vw, 10px);
      padding: clamp(6px, 0.8vw, 10px) clamp(14px, 1.8vw, 22px);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.05);
      background: rgba(255,255,255,0.02);
      color: var(--text-dim);
      font-size: clamp(11px, 1.1vw, 13px);
      font-weight: 500;
      cursor: pointer; transition: var(--transition);
      font-family: 'Inter', sans-serif;
      text-decoration: none;
      flex-shrink: 0;
    }
    .nav-btn:hover:not(:disabled) {
      border-color: rgba(184,134,11,0.14);
      color: var(--text-light);
      background: rgba(255,255,255,0.04);
    }
    .nav-btn:disabled {
      opacity: 0.3; cursor: not-allowed;
    }
    .nav-btn i { font-size: clamp(10px, 1vw, 12px); }
    .nav-btn.primary {
      background: rgba(184,134,11,0.08);
      border-color: rgba(184,134,11,0.12);
      color: var(--accent-bright);
    }
    .nav-btn.primary:hover:not(:disabled) {
      background: rgba(184,134,11,0.14);
    }
    .nav-counter {
      font-size: clamp(10px, 1vw, 12px);
      color: var(--text-muted);
      font-weight: 500;
    }

    /* ============================================================
       MODAL NOTES
       ============================================================ */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(12px);
      z-index: 9999; display: none; align-items: center; justify-content: center;
      padding: clamp(12px, 2vw, 24px);
      animation: fadeIn 0.3s ease;
    }
    .modal-overlay.show { display: flex; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal {
      background: var(--bg-card); backdrop-filter: blur(16px);
      border: 1px solid var(--card-border); border-radius: var(--radius);
      padding: clamp(18px, 2.5vw, 28px) clamp(16px, 2.5vw, 24px);
      max-width: 480px; width: 100%;
      max-height: 90vh; overflow-y: auto;
      animation: slideUp 0.3s ease; position: relative;
    }
    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal .modal-close {
      position: absolute; top: 8px; right: 12px;
      background: none; border: none; color: var(--text-muted);
      font-size: clamp(18px, 2vw, 22px);
      cursor: pointer; transition: var(--transition);
    }
    .modal .modal-close:hover { color: var(--text-light); }

    .modal .modal-title {
      font-size: clamp(17px, 2vw, 20px);
      font-weight: 700; font-family: 'Playfair Display', serif;
      color: var(--text-light); margin-bottom: 4px;
      padding-right: 30px;
    }
    .modal .modal-title span { color: var(--accent-bright); }
    .modal .modal-sub {
      font-size: clamp(11px, 1.1vw, 13px);
      color: var(--text-dim); margin-bottom: 14px;
    }
    .modal textarea {
      width: 100%; min-height: clamp(120px, 20vw, 180px);
      max-height: 400px;
      padding: clamp(10px, 1.2vw, 14px) clamp(12px, 1.4vw, 16px);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.03);
      color: var(--text-light);
      font-size: clamp(13px, 1.3vw, 15px);
      font-family: 'Inter', sans-serif;
      resize: vertical; outline: none; transition: var(--transition);
      line-height: 1.7;
    }
    .modal textarea:focus { border-color: rgba(184,134,11,0.2); }
    .modal textarea::placeholder { color: var(--text-muted); }
    .modal .modal-actions {
      display: flex; gap: 10px; margin-top: 14px;
      flex-wrap: wrap;
    }
    .modal .modal-actions button {
      flex: 1; padding: clamp(8px, 1vw, 12px);
      border-radius: 30px; border: none;
      font-size: clamp(12px, 1.2vw, 14px);
      font-weight: 600; cursor: pointer;
      transition: var(--transition);
      font-family: 'Inter', sans-serif;
      min-width: 80px;
    }
    .modal .modal-actions .btn-save {
      background: linear-gradient(135deg, var(--accent-bright), var(--accent));
      color: #0A0A0A;
    }
    .modal .modal-actions .btn-save:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(184,134,11,0.25);
    }
    .modal .modal-actions .btn-cancel {
      background: rgba(255,255,255,0.04);
      color: var(--text-dim); border: 1px solid rgba(255,255,255,0.06);
    }
    .modal .modal-actions .btn-cancel:hover {
      background: rgba(255,255,255,0.08);
      color: var(--text-light);
    }
    .modal .modal-actions .btn-save:disabled {
      opacity: 0.4; cursor: not-allowed; transform: none;
    }
    .modal .note-saved {
      font-size: clamp(11px, 1.1vw, 13px);
      color: var(--success); margin-top: 8px;
      display: none; align-items: center; gap: 6px;
    }
    .modal .note-saved.show { display: flex; }

    /* ============================================================
       TOAST
       ============================================================ */
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(100px);
      padding: clamp(10px, 1.2vw, 14px) clamp(16px, 2vw, 24px);
      border-radius: 12px;
      background: rgba(20,20,20,0.95);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(184,134,11,0.15);
      color: var(--text-light);
      font-size: clamp(12px, 1.2vw, 14px);
      font-weight: 500; z-index: 300;
      opacity: 0; transition: all 0.5s cubic-bezier(0.25,1,0.5,1);
      max-width: 90%; text-align: center;
      box-shadow: var(--shadow);
      display: flex; align-items: center; gap: 8px; justify-content: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: rgba(45,125,90,0.2); }
    .toast.error { border-color: rgba(184,92,58,0.3); }
    .toast .toast-icon { font-size: clamp(14px, 1.4vw, 16px); }
    .toast.success .toast-icon { color: var(--success); }
    .toast.error .toast-icon { color: var(--danger); }

    /* ============================================================
       RESPONSIVE
       ============================================================ */

    /* Tablette et petits écrans */
    @media (max-width: 640px) {
      .content-wrapper { padding: 10px 12px 60px; }
      .lecture-chapter-title { font-size: 22px; }
      .lecture-section-title { font-size: 18px; }
      .lecture-text { font-size: 14px; }
      .lecture-formula-main { font-size: 18px; }
      .lecture-grid-2 { grid-template-columns: 1fr 1fr; gap: 8px; }
      .lecture-formula-value { font-size: 18px; }
      .lecture-card { padding: 12px 14px; gap: 10px; }
      .math { font-size: 14px; padding: 1px 8px; }
    }

    /* Mobile moyen */
    @media (max-width: 480px) {
      .header { padding: 6px 10px; min-height: 44px; }
      .header .back-btn { width: 30px; height: 30px; font-size: 13px; }
      .header .header-title { font-size: 12px; max-width: 100px; }
      .header .notes-btn { font-size: 10px; padding: 4px 10px; }
      .header .notes-btn i { font-size: 11px; }

      .content-wrapper { padding: 8px 10px 50px; }

      .lecture-chapter-title { font-size: 20px; }
      .lecture-section-title { font-size: 16px; }
      .lecture-text { font-size: 13px; }
      .lecture-formula-main { font-size: 16px; }
      .lecture-grid-2 { grid-template-columns: 1fr 1fr; gap: 6px; }
      .lecture-formula { padding: 8px 10px; }
      .lecture-formula-value { font-size: 16px; }
      .lecture-card { padding: 10px 12px; gap: 8px; border-radius: 8px; }
      .lecture-card p { font-size: 13px; }
      .lecture-example { padding: 12px 14px; }
      .lecture-example-content { font-size: 13px; }
      .lecture-step-number { width: 26px; height: 26px; font-size: 12px; }
      .lecture-step-content p { font-size: 12px; }
      .math { font-size: 13px; padding: 1px 6px; }

      .nav-bar { gap: 8px; }
      .nav-btn { font-size: 11px; padding: 6px 12px; }
      .nav-btn i { font-size: 10px; }
      .nav-counter { font-size: 10px; }

      .modal { padding: 16px 14px; }
      .modal textarea { min-height: 100px; font-size: 13px; }
      .modal .modal-title { font-size: 16px; }
      .modal .modal-actions button { font-size: 12px; padding: 8px; min-width: 60px; }

      .premium-blocked { padding: 40px 16px; min-height: 250px; }
      .premium-blocked .premium-blocked-icon { width: 56px; height: 56px; font-size: 24px; }
      .premium-blocked h2 { font-size: 18px; }
      .premium-blocked p { font-size: 13px; }
      .premium-blocked .btn-premium { font-size: 13px; padding: 8px 20px; }

      .empty-state { padding: 40px 16px; }
      .empty-state .es-icon { width: 48px; height: 48px; font-size: 18px; }
      .empty-state h4 { font-size: 15px; }
      .empty-state p { font-size: 12px; }
    }

    /* Très petits écrans (≤ 360px) */
    @media (max-width: 360px) {
      .header { padding: 4px 8px; min-height: 40px; }
      .header .back-btn { width: 26px; height: 26px; font-size: 11px; border-radius: 6px; }
      .header .header-title { font-size: 10px; max-width: 70px; }
      .header .header-title i { font-size: 10px; }
      .header .notes-btn { font-size: 9px; padding: 3px 8px; }
      .header .notes-btn i { font-size: 10px; }
      .header .notes-btn .dot { width: 4px; height: 4px; }

      .content-wrapper { padding: 6px 8px 40px; }

      .lecture-chapter-header { margin-bottom: 16px; padding-bottom: 12px; }
      .lecture-chapter-title { font-size: 17px; }
      .lecture-chapter-number { font-size: 10px; }
      .lecture-chapter-badge { font-size: 8px; padding: 1px 8px; }

      .lecture-section { margin-bottom: 16px; }
      .lecture-section-title { font-size: 14px; }

      .lecture-text { font-size: 12px; line-height: 1.7; }
      .lecture-formula-main { font-size: 14px; }
      .lecture-grid-2 { grid-template-columns: 1fr; gap: 4px; }
      .lecture-formula { padding: 6px 8px; border-radius: 8px; }
      .lecture-formula-value { font-size: 14px; }
      .lecture-formula-label { font-size: 10px; }

      .lecture-card { padding: 8px 10px; gap: 6px; border-radius: 6px; border-left-width: 3px; }
      .lecture-card-icon { font-size: 14px; }
      .lecture-card-label { font-size: 8px; }
      .lecture-card p { font-size: 12px; }

      .lecture-example { padding: 10px 12px; border-radius: 8px; }
      .lecture-example-label { font-size: 9px; }
      .lecture-example-content { font-size: 12px; }
      .lecture-example-content .math { font-size: 12px; }

      .lecture-step { gap: 8px; margin-bottom: 8px; }
      .lecture-step-number { width: 22px; height: 22px; font-size: 10px; }
      .lecture-step-content strong { font-size: 11px; }
      .lecture-step-content p { font-size: 11px; }

      .lecture-divider { margin: 20px 0 16px; }
      .lecture-end-text { font-size: 11px; }

      .math { font-size: 12px; padding: 1px 4px; }

      .nav-bar { margin-top: 12px; }
      .nav-btn { font-size: 10px; padding: 4px 10px; }
      .nav-btn i { font-size: 9px; }
      .nav-counter { font-size: 9px; }

      .modal { padding: 12px 10px; border-radius: 12px; }
      .modal .modal-title { font-size: 14px; }
      .modal .modal-sub { font-size: 11px; margin-bottom: 10px; }
      .modal textarea { min-height: 80px; font-size: 12px; padding: 8px 10px; }
      .modal .modal-actions { gap: 6px; }
      .modal .modal-actions button { font-size: 11px; padding: 6px; min-width: 50px; }

      .premium-blocked { padding: 30px 12px; min-height: 200px; gap: 10px; }
      .premium-blocked .premium-blocked-icon { width: 48px; height: 48px; font-size: 20px; }
      .premium-blocked h2 { font-size: 16px; }
      .premium-blocked p { font-size: 12px; }
      .premium-blocked .btn-premium { font-size: 12px; padding: 6px 16px; }

      .empty-state { padding: 30px 12px; gap: 10px; }
      .empty-state .es-icon { width: 40px; height: 40px; font-size: 16px; border-radius: 12px; }
      .empty-state h4 { font-size: 13px; }
      .empty-state p { font-size: 11px; }

      .toast { font-size: 11px; padding: 8px 14px; bottom: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    a:focus-visible, button:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(184,134,11,0.2); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(184,134,11,0.35); }
  </style>
</head>
<body>

  <div class="gradient-bg"></div>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="header-left">
      <button class="back-btn" id="backBtn" aria-label="Retour">
        <i class="fas fa-arrow-left"></i>
      </button>
      <div class="header-title" id="pageTitle">
        <i class="fas fa-book-open"></i> <span>Chargement...</span>
      </div>
    </div>
    <button class="notes-btn" id="notesBtn">
      <i class="fas fa-pen"></i>
      <span>Notes</span>
      <span class="dot" id="notesDot"></span>
    </button>
  </header>

  <!-- ===== CONTENT ===== -->
  <div class="content-wrapper" id="contentWrapper">
    <div id="contentBody">
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Chargement du contenu...</p>
      </div>
    </div>

    <!-- ===== NAVIGATION ===== -->
    <div class="nav-bar" id="navBar">
      <button class="nav-btn" id="prevBtn" disabled>
        <i class="fas fa-chevron-left"></i> Précédent
      </button>
      <span class="nav-counter" id="partCounter">1 / 1</span>
      <button class="nav-btn primary" id="nextBtn">
        Suivant <i class="fas fa-chevron-right"></i>
      </button>
    </div>
  </div>

  <!-- ===== MODAL NOTES ===== -->
  <div class="modal-overlay" id="notesModal">
    <div class="modal">
      <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>

      <div class="modal-title">📝 Mes <span>notes</span></div>
      <div class="modal-sub" id="modalSub">Partie — Chargement...</div>

      <textarea id="notesTextarea" placeholder="Écris ici ce que tu as compris, des points importants, des questions..."></textarea>

      <div class="note-saved" id="noteSaved"><i class="fas fa-check-circle"></i> Notes enregistrées !</div>

      <div class="modal-actions">
        <button class="btn-cancel" id="modalCancel">Annuler</button>
        <button class="btn-save" id="modalSave">💾 Enregistrer</button>
      </div>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- SCRIPTS                                                       -->
  <!-- ============================================================ -->
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js"
    }
  }
  </script>

  <script type="module">
  // ================================================================
  // LECTURE - VERSION OPTIMISÉE AVEC NOTES
  // ================================================================

  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
  import {
    getAuth,
    onAuthStateChanged,
    setPersistence,
    browserLocalPersistence
  } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

  // ================================================================
  // CONFIG
  // ================================================================
  const firebaseConfig = {
    apiKey: "AIzaSyDHscOXw3rLuhV6z1Cny-bdYCumqpnG7QE",
    authDomain: "arvexa-fbf10.firebaseapp.com",
    projectId: "arvexa-fbf10",
    storageBucket: "arvexa-fbf10.firebasestorage.app",
    messagingSenderId: "920108330053",
    appId: "1:920108330053:web:f532d71cbc2c824bc7472c"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  try {
    await setPersistence(auth, browserLocalPersistence);
    console.log('🔐 Persistance locale activée');
  } catch (e) {
    console.warn('⚠️ Persistance:', e);
  }

  // ================================================================
  // URL PARAMS
  // ================================================================
  const params = new URLSearchParams(window.location.search);
  const subject = params.get('subject') || 'mathematiques';
  const chapter = parseInt(params.get('chapter')) || 0;
  const tab = params.get('tab') || 'cours';
  const partIndex = parseInt(params.get('part')) || 0;

  // ================================================================
  // DOM
  // ================================================================
  const contentBody = document.getElementById('contentBody');
  const pageTitle = document.querySelector('#pageTitle span');
  const backBtn = document.getElementById('backBtn');
  const notesBtn = document.getElementById('notesBtn');
  const notesDot = document.getElementById('notesDot');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const partCounter = document.getElementById('partCounter');

  // Modal
  const notesModal = document.getElementById('notesModal');
  const modalClose = document.getElementById('modalClose');
  const modalCancel = document.getElementById('modalCancel');
  const modalSave = document.getElementById('modalSave');
  const notesTextarea = document.getElementById('notesTextarea');
  const modalSub = document.getElementById('modalSub');
  const noteSaved = document.getElementById('noteSaved');

  // ================================================================
  // GESTION DES LECTURES
  // ================================================================
  const READ_KEY = 'arvexa_read_parts';
  const NOTES_KEY = 'arvexa_notes';

  function getReadParts() {
    try { return JSON.parse(localStorage.getItem(READ_KEY) || '[]'); }
    catch(e) { return []; }
  }

  function markPartAsRead() {
    const key = `${subject}_${chapter}_${tab}_${partIndex}`;
    const readParts = getReadParts();
    if (!readParts.includes(key)) {
      readParts.push(key);
      localStorage.setItem(READ_KEY, JSON.stringify(readParts));
      console.log('📌 Partie marquée comme lue:', key);
    }
  }

  function getNotesKey() {
    return `${subject}_${chapter}_${tab}_${partIndex}`;
  }

  function loadNotes() {
    try {
      const notes = JSON.parse(localStorage.getItem(NOTES_KEY) || '{}');
      const key = getNotesKey();
      if (notes[key]) {
        notesTextarea.value = notes[key];
        notesDot.classList.add('show');
      } else {
        notesTextarea.value = '';
        notesDot.classList.remove('show');
      }
      noteSaved.classList.remove('show');
    } catch(e) {}
  }

  function saveNotes() {
    try {
      const notes = JSON.parse(localStorage.getItem(NOTES_KEY) || '{}');
      const key = getNotesKey();
      const text = notesTextarea.value.trim();
      if (text) {
        notes[key] = text;
        notesDot.classList.add('show');
      } else {
        delete notes[key];
        notesDot.classList.remove('show');
      }
      localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
      noteSaved.classList.add('show');
      setTimeout(() => noteSaved.classList.remove('show'), 2000);
      console.log('💾 Notes enregistrées pour:', key);
    } catch(e) {}
  }

  // ================================================================
  // ÉTAT
  // ================================================================
  let parts = [];
  let currentIndex = partIndex;
  let isPremium = false;

  // ================================================================
  // VÉRIFICATION PREMIUM
  // ================================================================
  function checkAccess() {
    try {
      const userData = JSON.parse(localStorage.getItem('arvexa_user_data') || '{}');
      isPremium = userData.premium === true || userData.isUnlocked === true || userData.hasDeposited === true;
    } catch(e) {}

    const isFree = chapter === 0;
    const isCorrection = tab === 'corrections';

    if (!isFree && !isPremium) {
      showBlocked();
      return false;
    }

    if (isCorrection && !isFree && !isPremium) {
      showBlocked('🔒 Correction Premium', 'Les corrections sont réservées aux abonnés Premium.');
      return false;
    }

    return true;
  }

  function showBlocked(title = '🔒 Chapitre Premium', message = 'Ce chapitre est réservé aux abonnés Premium.') {
    contentBody.innerHTML = `
      <div class="premium-blocked">
        <div class="premium-blocked-icon"><i class="fas fa-lock"></i></div>
        <h2>${title}</h2>
        <p>${message}</p>
        <a href="abonnement.html" class="btn-premium">Voir les offres</a>
      </div>
    `;
    pageTitle.textContent = '🔒 Verrouillé';
    document.title = 'ARVEXA - Verrouillé';
    document.getElementById('navBar').style.display = 'none';
    notesBtn.style.display = 'none';
  }

  // ================================================================
  // CHARGEMENT DU CONTENU
  // ================================================================
  function loadContent() {
    if (!checkAccess()) {
      document.getElementById('navBar').style.display = 'none';
      return;
    }

    const suffix = tab === 'cours' ? 'cours' : (tab === 'exercices' ? 'exo' : 'corr');
    const manifestPath = `cours/${subject}/ch${chapter}_${suffix}.json`;

    contentBody.innerHTML = `
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Chargement du contenu...</p>
      </div>
    `;

    fetch(manifestPath)
      .then(r => { if (!r.ok) throw new Error('Manifest non trouvé'); return r.json(); })
      .then(data => {
        parts = data.parts || [];
        if (currentIndex >= parts.length) currentIndex = 0;
        renderPart();
      })
      .catch(() => {
        contentBody.innerHTML = `
          <div class="empty-state">
            <div class="es-icon"><i class="fas fa-exclamation-triangle"></i></div>
            <h4>Contenu non disponible</h4>
            <p>Le contenu de cette section n'est pas encore disponible.</p>
          </div>
        `;
        pageTitle.textContent = 'Contenu indisponible';
        document.getElementById('navBar').style.display = 'none';
      });
  }

  function renderPart() {
    if (!parts || parts.length === 0) {
      contentBody.innerHTML = `
        <div class="empty-state">
          <div class="es-icon"><i class="fas fa-folder-open"></i></div>
          <h4>Aucune partie disponible</h4>
          <p>Le contenu de cette section n'est pas encore disponible.</p>
        </div>
      `;
      document.getElementById('navBar').style.display = 'none';
      return;
    }

    if (currentIndex >= parts.length || currentIndex < 0) {
      currentIndex = 0;
    }

    const part = parts[currentIndex];
    if (!part) {
      contentBody.innerHTML = `
        <div class="empty-state">
          <div class="es-icon"><i class="fas fa-exclamation-triangle"></i></div>
          <h4>Partie introuvable</h4>
          <p>La partie demandée n'existe pas.</p>
        </div>
      `;
      return;
    }

    // Mettre à jour le titre
    pageTitle.textContent = part.title || 'Partie ' + (currentIndex + 1);
    document.title = 'ARVEXA - ' + (part.title || 'Lecture');

    // Mettre à jour le compteur
    partCounter.textContent = `${currentIndex + 1} / ${parts.length}`;

    // Mettre à jour les boutons de navigation
    prevBtn.disabled = currentIndex === 0;
    nextBtn.disabled = currentIndex >= parts.length - 1;

    // Mettre à jour le sous-titre du modal
    const subjectName = subject.charAt(0).toUpperCase() + subject.slice(1);
    modalSub.textContent = `${part.title || 'Partie ' + (currentIndex + 1)} — ${subjectName}`;

    // Charger le fichier
    const filePath = `cours/${subject}/${part.file}`;
    contentBody.innerHTML = `
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Chargement...</p>
      </div>
    `;

    fetch(filePath)
      .then(r => { if (!r.ok) throw new Error('Fichier non trouvé'); return r.text(); })
      .then(html => {
        contentBody.innerHTML = html;
        // Marquer comme lu
        markPartAsRead();
        // Charger les notes
        loadNotes();
        // Afficher la navigation
        document.getElementById('navBar').style.display = 'flex';
      })
      .catch(() => {
        contentBody.innerHTML = `
          <div class="empty-state">
            <div class="es-icon"><i class="fas fa-file-lines"></i></div>
            <h4>Contenu non disponible</h4>
            <p>Le fichier <strong>${part.file}</strong> n'a pas été trouvé.</p>
          </div>
        `;
        document.getElementById('navBar').style.display = 'none';
      });
  }

  // ================================================================
  // NAVIGATION
  // ================================================================
  function goToPrev() {
    if (currentIndex > 0) {
      currentIndex--;
      // Sauvegarder les notes avant de changer
      if (notesTextarea.value.trim()) saveNotes();
      renderPart();
    }
  }

  function goToNext() {
    if (currentIndex < parts.length - 1) {
      currentIndex++;
      if (notesTextarea.value.trim()) saveNotes();
      renderPart();
    }
  }

  // ================================================================
  // MODAL NOTES
  // ================================================================
  function openModal() {
    notesModal.classList.add('show');
    document.body.style.overflow = 'hidden';
    setTimeout(() => notesTextarea.focus(), 100);
  }

  function closeModal() {
    notesModal.classList.remove('show');
    document.body.style.overflow = '';
  }

  // ================================================================
  // ÉVÉNEMENTS
  // ================================================================

  // Retour
  backBtn.addEventListener('click', () => {
    window.location.href = `chapitre.html?subject=${subject}&chapter=${chapter}&tab=${tab}`;
  });

  // Navigation
  prevBtn.addEventListener('click', goToPrev);
  nextBtn.addEventListener('click', goToNext);

  // Raccourcis clavier
  document.addEventListener('keydown', (e) => {
    // Ne pas capturer les touches si on est dans un champ de texte
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

    if (e.key === 'ArrowLeft' && !prevBtn.disabled) goToPrev();
    if (e.key === 'ArrowRight' && !nextBtn.disabled) goToNext();
    if (e.key === 'Escape') closeModal();
  });

  // Notes
  notesBtn.addEventListener('click', openModal);
  modalClose.addEventListener('click', closeModal);
  modalCancel.addEventListener('click', closeModal);
  notesModal.addEventListener('click', (e) => {
    if (e.target === notesModal) closeModal();
  });

  modalSave.addEventListener('click', () => {
    saveNotes();
    closeModal();
  });

  // Sauvegarde automatique des notes
  notesTextarea.addEventListener('blur', () => {
    if (notesTextarea.value.trim()) saveNotes();
  });

  // Sauvegarde avec Ctrl+S dans le textarea
  notesTextarea.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      e.preventDefault();
      saveNotes();
      noteSaved.classList.add('show');
      setTimeout(() => noteSaved.classList.remove('show'), 1500);
    }
  });

  // ================================================================
  // AUTH
  // ================================================================
  let authChecked = false;

  onAuthStateChanged(auth, (user) => {
    if (authChecked) return;
    authChecked = true;

    if (!user) {
      window.location.href = 'login.html';
      return;
    }

    loadContent();
  });

  console.log('📖 ARVEXA - Lecture (version optimisée)');
  </script>
</body>
</html>
