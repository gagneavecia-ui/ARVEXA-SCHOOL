<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="description" content="ARVEXA School - Lecture">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png" type="image/png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
   ROOT
   ============================================================ */
:root {
  --primary: #1A3A2A;
  --accent: #B8860B;
  --accent-bright: #E0B84A;
  --success: #2D7D5A;
  --danger: #B85C3A;
  --bg-dark: #0A0A0A;
  --bg-surface: #141414;
  --bg-card: rgba(20,20,20,0.7);
  --text-light: #F5F0E8;
  --text-dim: #8A8A7A;
  --text-muted: #5A5A4A;
  --card-border: rgba(184,134,11,0.08);
  --transition: all 0.3s cubic-bezier(0.25,1,0.5,1);
  --radius: 16px;
  --content-max: 820px;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html {
  scroll-behavior: smooth;
  width: 100%;
  overflow-x: hidden;
  height: 100%;
}

body {
  font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
  background: var(--bg-dark);
  color: var(--text-light);
  font-size: 15px;
  line-height: 1.8;
  min-height: 100vh;
  height: 100%;
  width: 100%;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.gradient-bg {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: -2;
  background:
    radial-gradient(ellipse 40% 30% at 30% 15%, rgba(26,58,42,0.16) 0%, transparent 70%),
    radial-gradient(ellipse 35% 25% at 75% 85%, rgba(184,134,11,0.05) 0%, transparent 60%),
    linear-gradient(180deg, #0A0A0A 0%, #060606 100%);
}

/* ============================================================
   HEADER
   ============================================================ */
.header {
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background: rgba(10,10,10,0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(184,134,11,0.06);
  gap: 8px;
  min-height: 48px;
  flex-shrink: 0;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  flex: 1;
}

.header .back-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.05);
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  transition: var(--transition);
  font-size: 14px;
  text-decoration: none;
  flex-shrink: 0;
}

.header .back-btn:hover {
  border-color: rgba(184,134,11,0.14);
  color: var(--text-light);
}

.header .header-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-light);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}

.header .header-title i {
  color: var(--accent-bright);
  margin-right: 4px;
  font-size: 12px;
}

.header .notes-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid rgba(184,134,11,0.12);
  background: rgba(184,134,11,0.06);
  color: var(--accent-bright);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  font-family: 'Inter', sans-serif;
  flex-shrink: 0;
}

.header .notes-btn:hover {
  background: rgba(184,134,11,0.12);
  transform: scale(1.02);
}

.header .notes-btn i { font-size: 13px; }

.header .notes-btn .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--success);
  display: none;
}

.header .notes-btn .dot.show { display: inline-block; }

/* ============================================================
   CONTENT WRAPPER
   ============================================================ */
.content-wrapper {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px 16px 80px;
  max-width: var(--content-max);
  margin: 0 auto;
  width: 100%;
  min-width: 0;
}

.content-wrapper::-webkit-scrollbar { width: 4px; }
.content-wrapper::-webkit-scrollbar-track { background: transparent; }
.content-wrapper::-webkit-scrollbar-thumb {
  background: rgba(184,134,11,0.2);
  border-radius: 10px;
}

#contentBody {
  background: transparent;
  min-height: 200px;
  padding: 0;
  min-width: 0;
  max-width: 100%;
  font-size: 16px;
  line-height: 1.85;
  color: #cfd0cc;
  letter-spacing: 0.005em;
  overflow-wrap: break-word;
  word-wrap: break-word;
}

/* ============================================================
   LOADING / EMPTY / BLOCKED
   ============================================================ */
#contentBody .loading-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  gap: 12px;
}

#contentBody .spinner {
  width: 32px;
  height: 32px;
  border: 3px solid rgba(184,134,11,0.15);
  border-top-color: var(--accent-bright);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

#contentBody .loading-state p {
  font-size: 13px;
  color: var(--text-muted);
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.empty-state .es-icon {
  width: 64px;
  height: 64px;
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(184,134,11,0.06);
  border: 1px solid rgba(184,134,11,0.08);
  font-size: 24px;
  color: var(--text-muted);
}

.empty-state h4 {
  font-size: 17px;
  color: var(--text-dim);
  font-weight: 600;
}

.empty-state p {
  font-size: 13px;
  color: var(--text-muted);
  max-width: 400px;
  line-height: 1.7;
}

.premium-blocked {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 60px 20px;
  min-height: 300px;
  gap: 16px;
}

.premium-blocked .premium-blocked-icon {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: rgba(184,134,11,0.1);
  border: 2px solid rgba(184,134,11,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  color: var(--accent-bright);
}

.premium-blocked h2 {
  font-size: 22px;
  font-weight: 700;
  font-family: 'Playfair Display', serif;
  color: var(--text-light);
}

.premium-blocked p {
  font-size: 14px;
  color: var(--text-dim);
  max-width: 400px;
  line-height: 1.7;
}

.premium-blocked .btn-premium {
  display: inline-block;
  padding: 10px 28px;
  border-radius: 30px;
  background: linear-gradient(135deg, var(--accent-bright), var(--accent));
  color: #0A0A0A;
  font-weight: 700;
  font-size: 14px;
  text-decoration: none;
  transition: var(--transition);
  margin-top: 6px;
}

.premium-blocked .btn-premium:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 30px rgba(184,134,11,0.25);
}

/* ============================================================
   NAVIGATION BAS DE PAGE
   ============================================================ */
.nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-top: 32px;
  padding-top: 20px;
  border-top: 1px solid rgba(255,255,255,0.04);
}

.nav-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 18px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.05);
  background: rgba(255,255,255,0.02);
  color: var(--text-dim);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: var(--transition);
  font-family: 'Inter', sans-serif;
  text-decoration: none;
}

.nav-btn:hover:not(:disabled) {
  border-color: rgba(184,134,11,0.14);
  color: var(--text-light);
  background: rgba(255,255,255,0.04);
}

.nav-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

.nav-btn i { font-size: 12px; }

.nav-btn.primary {
  background: rgba(184,134,11,0.08);
  border-color: rgba(184,134,11,0.12);
  color: var(--accent-bright);
}

.nav-btn.primary:hover:not(:disabled) {
  background: rgba(184,134,11,0.14);
}

/* ============================================================
   MODAL NOTES
   ============================================================ */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 9999;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: fadeIn 0.3s ease;
}

.modal-overlay.show { display: flex; }

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal {
  background: var(--bg-card);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  padding: 24px 20px;
  max-width: 480px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  animation: slideUp 0.3s ease;
  position: relative;
}

@keyframes slideUp {
  from { transform: translateY(30px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.modal .modal-close {
  position: absolute;
  top: 8px;
  right: 12px;
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 20px;
  cursor: pointer;
  transition: var(--transition);
}

.modal .modal-close:hover { color: var(--text-light); }

.modal .modal-title {
  font-size: 18px;
  font-weight: 700;
  font-family: 'Playfair Display', serif;
  color: var(--text-light);
  margin-bottom: 4px;
}

.modal .modal-title span { color: var(--accent-bright); }

.modal .modal-sub {
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 14px;
}

.modal textarea {
  width: 100%;
  min-height: 160px;
  max-height: 400px;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.06);
  background: rgba(255,255,255,0.03);
  color: var(--text-light);
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  resize: vertical;
  outline: none;
  transition: var(--transition);
  line-height: 1.7;
}

.modal textarea:focus { border-color: rgba(184,134,11,0.2); }
.modal textarea::placeholder { color: var(--text-muted); }

.modal .modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 14px;
}

.modal .modal-actions button {
  flex: 1;
  padding: 10px;
  border-radius: 30px;
  border: none;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  font-family: 'Inter', sans-serif;
}

.modal .modal-actions .btn-save {
  background: linear-gradient(135deg, var(--accent-bright), var(--accent));
  color: #0A0A0A;
}

.modal .modal-actions .btn-save:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 24px rgba(184,134,11,0.25);
}

.modal .modal-actions .btn-cancel {
  background: rgba(255,255,255,0.04);
  color: var(--text-dim);
  border: 1px solid rgba(255,255,255,0.06);
}

.modal .modal-actions .btn-cancel:hover {
  background: rgba(255,255,255,0.08);
  color: var(--text-light);
}

.modal .note-saved {
  font-size: 12px;
  color: var(--success);
  margin-top: 8px;
  display: none;
  align-items: center;
  gap: 6px;
}

.modal .note-saved.show { display: flex; }

/* ============================================================
   TYPOGRAPHIE CONTENU
   ============================================================ */
#contentBody h1,
#contentBody h2,
#contentBody h3 {
  font-family: 'Playfair Display', Georgia, serif;
  color: var(--text-light);
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: -0.015em;
  overflow-wrap: break-word;
}

#contentBody p {
  margin: 0 0 18px;
  color: #cfd0cc;
  overflow-wrap: break-word;
  word-wrap: break-word;
}

#contentBody strong { color: var(--text-light); font-weight: 600; }
#contentBody em { color: var(--accent-bright); font-style: italic; }

/* Formule inline */
.math {
  display: inline;
  padding: 1px 7px;
  border-radius: 4px;
  background: rgba(224,184,74,0.06);
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 1.02em;
  color: var(--text-light);
  font-weight: 500;
  white-space: normal;
  overflow-wrap: anywhere;
  word-break: break-word;
  line-height: 1.4;
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
}

/* ============================================================
   HERO (cours / exercice / correction)
   ============================================================ */
.lecture-hero {
  margin: 0 0 40px;
  padding: 0 0 26px;
  border-bottom: 1px solid rgba(224,184,74,0.1);
  position: relative;
  min-width: 0;
}

.lecture-hero::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 0;
  width: 56px;
  height: 2px;
  background: linear-gradient(90deg, var(--accent-bright), transparent);
}

.lecture-hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--accent);
  flex-wrap: wrap;
}

.lecture-hero-icon { font-size: 13px; }
.lecture-hero-label { color: var(--accent); }

.lecture-hero-title {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 38px;
  font-weight: 700;
  line-height: 1.1;
  color: var(--text-light);
  margin: 0 0 16px;
  letter-spacing: -0.025em;
  overflow-wrap: break-word;
  word-break: break-word;
}

.lecture-hero-title em {
  color: var(--accent-bright);
  font-style: italic;
  font-weight: 500;
}

.lecture-hero-intro {
  font-size: 17px;
  line-height: 1.65;
  color: #9a9a92;
  margin: 0 0 22px;
  max-width: 640px;
  font-weight: 300;
  overflow-wrap: break-word;
}

.lecture-hero-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  font-size: 12px;
  color: #6a6a62;
  letter-spacing: 0.03em;
}

.lecture-hero-meta-item {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.lecture-hero-meta-item i {
  color: var(--accent);
  font-size: 10px;
}

/* Variantes hero */
.lecture-hero-exo .lecture-hero-badge,
.lecture-hero-exo .lecture-hero-label { color: #60a5fa; }
.lecture-hero-exo::after {
  background: linear-gradient(90deg, #60a5fa, transparent);
}

.lecture-hero-corr .lecture-hero-badge,
.lecture-hero-corr .lecture-hero-label { color: #4ade80; }
.lecture-hero-corr::after {
  background: linear-gradient(90deg, #4ade80, transparent);
}

/* ============================================================
   SOMMAIRE
   ============================================================ */
.lecture-toc {
  margin: 0 0 48px;
  padding: 0;
  min-width: 0;
}

.lecture-toc-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding-bottom: 10px;
  margin-bottom: 4px;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--accent);
  gap: 12px;
}

.lecture-toc-count {
  color: var(--text-muted);
  font-weight: 500;
  letter-spacing: 1.5px;
}

.lecture-toc-list {
  list-style: none;
  padding: 0;
  margin: 0;
}

.lecture-toc-list li {
  border-bottom: 1px solid rgba(255,255,255,0.035);
}

.lecture-toc-list li:last-child { border-bottom: none; }

.lecture-toc-list a {
  display: flex;
  align-items: baseline;
  gap: 20px;
  padding: 12px 0;
  color: #b8b8b0;
  text-decoration: none;
  font-size: 14.5px;
  transition: color 0.2s, padding-left 0.25s;
}

.lecture-toc-list a:hover {
  color: var(--accent-bright);
  padding-left: 6px;
}

.toc-num {
  font-family: 'Playfair Display', serif;
  font-size: 11px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 1px;
  flex-shrink: 0;
  min-width: 22px;
}

/* ============================================================
   SECTIONS
   ============================================================ */
.lecture-section {
  margin: 0 0 64px;
  scroll-margin-top: 80px;
  min-width: 0;
}

.lecture-section-header {
  display: flex;
  align-items: baseline;
  gap: 22px;
  margin-bottom: 26px;
  padding-bottom: 16px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  position: relative;
  flex-wrap: wrap;
}

.lecture-section-header::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 0;
  width: 36px;
  height: 2px;
  background: var(--accent-bright);
}

.lecture-section-num {
  font-family: 'Playfair Display', serif;
  font-size: 40px;
  font-weight: 700;
  color: var(--accent);
  opacity: 0.4;
  line-height: 1;
  flex-shrink: 0;
  letter-spacing: -0.03em;
}

.lecture-section-heading {
  flex: 1;
  min-width: 0;
}

.lecture-section-eyebrow {
  display: block;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 2.8px;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 6px;
}

.lecture-section-title {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 26px;
  font-weight: 700;
  color: var(--text-light);
  margin: 0;
  line-height: 1.2;
  letter-spacing: -0.02em;
  overflow-wrap: break-word;
  word-break: break-word;
}

.lecture-section-body {
  padding-left: 0;
  min-width: 0;
}

/* ============================================================
   TEXTE
   ============================================================ */
.lecture-text {
  font-size: 16px;
  line-height: 1.85;
  color: #cfd0cc;
  margin: 0 0 18px;
  overflow-wrap: break-word;
  word-wrap: break-word;
}

.lecture-text strong { color: var(--text-light); font-weight: 600; }

/* ============================================================
   LISTES
   ============================================================ */
.lecture-list {
  list-style: none;
  padding: 0;
  margin: 18px 0 22px;
}

.lecture-list li {
  position: relative;
  padding: 7px 0 7px 24px;
  color: #cfd0cc;
  font-size: 15.5px;
  line-height: 1.8;
  overflow-wrap: break-word;
  word-break: break-word;
}

.lecture-list li::before {
  content: '—';
  position: absolute;
  left: 0;
  top: 7px;
  color: var(--accent);
  font-weight: 700;
  font-size: 14px;
}

.lecture-list li strong,
.lecture-list li .term {
  color: var(--text-light);
  font-weight: 600;
}

.lecture-list-elegant li {
  display: flex;
  gap: 18px;
  padding: 12px 0 12px 24px;
  border-bottom: 1px solid rgba(255,255,255,0.035);
  flex-wrap: wrap;
}

.lecture-list-elegant li:last-child { border-bottom: none; }

.lecture-list-elegant li strong {
  min-width: 80px;
  font-family: 'Playfair Display', serif;
  color: var(--accent-bright);
  font-size: 14.5px;
  flex-shrink: 0;
}

.lecture-list-elegant li span {
  color: #b8b8b0;
  font-size: 15px;
  line-height: 1.75;
  flex: 1;
  min-width: 0;
}

/* ============================================================
   CALLOUTS (blocs à filet vertical)
   ============================================================ */
.lecture-callout {
  margin: 24px 0;
  padding: 4px 0 4px 20px;
  border-left: 2px solid var(--accent-bright);
  min-width: 0;
}

.lecture-callout-icon { display: none; }
.lecture-callout-body,
.lecture-callout-content { flex: 1; min-width: 0; }

.lecture-callout-title,
.lecture-callout-label {
  display: block;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 10px;
}

.lecture-callout-body p,
.lecture-callout-content p,
.lecture-callout p {
  margin: 0 0 10px;
  font-size: 15.5px;
  line-height: 1.85;
  color: #cfd0cc;
  overflow-wrap: break-word;
}

.lecture-callout-body p:last-child,
.lecture-callout-content p:last-child,
.lecture-callout p:last-child { margin-bottom: 0; }

.lecture-callout-body strong,
.lecture-callout-content strong { color: var(--text-light); }

.lecture-callout-gold { border-left-color: var(--accent-bright); }
.lecture-callout-gold .lecture-callout-title,
.lecture-callout-gold .lecture-callout-label { color: var(--accent-bright); }

.lecture-callout-key { border-left-color: #4ade80; }
.lecture-callout-key .lecture-callout-title,
.lecture-callout-key .lecture-callout-label { color: #4ade80; }

.lecture-callout-warning { border-left-color: #fbbf24; }
.lecture-callout-warning .lecture-callout-title,
.lecture-callout-warning { border-left-color: #fbbf24; }
.lecture-callout-warning .lecture-callout-title,
.lecture-callout-warning .lecture-callout-label { color: #fbbf24; }

.lecture-callout-danger { border-left-color: #f87171; }
.lecture-callout-danger .lecture-callout-title,
.lecture-callout-danger .lecture-callout-label { color: #f87171; }

/* Anciennes cartes (fallback) */
.lecture-card {
  margin: 24px 0;
  padding: 4px 0 4px 20px;
  border-left: 2px solid var(--accent-bright);
  min-width: 0;
}

.lecture-card-icon { display: none; }
.lecture-card-content { flex: 1; min-width: 0; }

.lecture-card-label {
  display: block;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 10px;
}

.lecture-card p {
  margin: 0 0 10px;
  font-size: 15.5px;
  line-height: 1.85;
  color: #cfd0cc;
}
.lecture-card p:last-child { margin-bottom: 0; }

.lecture-card-tip { border-left-color: #60a5fa; }
.lecture-card-tip .lecture-card-label { color: #60a5fa; }

.lecture-card-remember { border-left-color: #4ade80; }
.lecture-card-remember .lecture-card-label { color: #4ade80; }

.lecture-card-history { border-left-color: #c4a882; }
.lecture-card-history .lecture-card-label { color: #c4a882; }

.lecture-card-key { border-left-color: #4ade80; }
.lecture-card-key .lecture-card-label { color: #4ade80; }

.lecture-card-warning { border-left-color: #fbbf24; }
.lecture-card-warning .lecture-card-label { color: #fbbf24; }

/* Aside */
.lecture-aside {
  margin: 28px 0;
  padding: 4px 0 4px 20px;
  border-left: 2px solid #8B7355;
  min-width: 0;
}

.lecture-aside-icon { display: none; }
.lecture-aside-content { flex: 1; min-width: 0; }

.lecture-aside-label {
  display: block;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: #c4a882;
  margin-bottom: 10px;
}

.lecture-aside-content p {
  margin: 0;
  font-size: 15px;
  line-height: 1.85;
  color: #b0b0a8;
  font-style: italic;
}

/* ============================================================
   FORMULES
   ============================================================ */
.lecture-formula-hero {
  margin: 36px 0;
  padding: 32px 20px;
  text-align: center;
  position: relative;
  min-width: 0;
}

.lecture-formula-hero::before,
.lecture-formula-hero::after {
  content: '';
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  width: 60px;
  height: 1px;
  background: rgba(224,184,74,0.3);
}

.lecture-formula-hero::before { top: 0; }
.lecture-formula-hero::after { bottom: 0; }

.lecture-formula-hero-label {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 18px;
}

.lecture-formula-hero-main {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 42px;
  font-weight: 700;
  color: var(--text-light);
  line-height: 1.1;
  letter-spacing: -0.02em;
  overflow-wrap: anywhere;
  word-break: break-word;
}

.lecture-formula-hero-desc {
  font-size: 13.5px;
  color: var(--text-dim);
  margin-top: 14px;
  font-style: italic;
  letter-spacing: 0.02em;
}

.lecture-formula-box {
  margin: 22px 0;
  padding: 16px 20px;
  border-left: 2px solid var(--accent-bright);
  background: rgba(224,184,74,0.025);
  border-radius: 0 8px 8px 0;
  text-align: left;
  min-width: 0;
}

.lecture-formula-main {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 20px;
  font-weight: 600;
  color: var(--text-light);
  line-height: 1.5;
  overflow-wrap: anywhere;
  word-break: break-word;
}

.lecture-formula-desc {
  font-size: 13px;
  color: var(--text-dim);
  margin-top: 8px;
  line-height: 1.6;
  font-style: italic;
}

.lecture-rule {
  margin: 30px 0;
  padding: 24px 20px;
  text-align: center;
  border-top: 1px solid rgba(224,184,74,0.15);
  border-bottom: 1px solid rgba(224,184,74,0.15);
  min-width: 0;
}

.lecture-rule-label {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--accent-bright);
  margin-bottom: 16px;
}

.lecture-rule-body {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 18px;
  color: var(--text-light);
  line-height: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  overflow-wrap: anywhere;
}

.rule-iff {
  color: var(--accent-bright);
  font-size: 20px;
}

.rule-and {
  font-family: 'Inter', sans-serif;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 2.5px;
  color: var(--accent);
  padding: 4px 12px;
  border: 1px solid rgba(224,184,74,0.25);
  border-radius: 100px;
}

/* ============================================================
   EXEMPLES
   ============================================================ */
.lecture-example {
  margin: 26px 0;
  padding: 0;
  min-width: 0;
}

.lecture-example-label {
  display: block;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 2.8px;
  text-transform: uppercase;
  color: var(--accent-bright);
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(224,184,74,0.12);
}

.lecture-example-content {
  color: #cfd0cc;
  font-size: 15.5px;
  line-height: 1.85;
}

.lecture-example-content p {
  margin: 0 0 10px;
  color: #cfd0cc;
  overflow-wrap: break-word;
}

.lecture-example-content p:last-child { margin-bottom: 0; }

.lecture-example-featured .lecture-example-label {
  color: #4ade80;
  border-bottom-color: rgba(74,222,128,0.15);
}

/* ============================================================
   ÉTAPES
   ============================================================ */
.lecture-steps {
  margin: 22px 0;
}

.lecture-step {
  display: flex;
  gap: 18px;
  align-items: flex-start;
  padding: 14px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  min-width: 0;
}

.lecture-step:last-child { border-bottom: none; }

.lecture-step-number {
  flex-shrink: 0;
  font-family: 'Playfair Display', serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--accent);
  opacity: 0.7;
  line-height: 1;
  min-width: 32px;
  padding-top: 4px;
  letter-spacing: -0.02em;
}

.lecture-step-content {
  flex: 1;
  min-width: 0;
  overflow-wrap: break-word;
}

.lecture-step-content strong {
  display: block;
  color: var(--text-light);
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 6px;
}

.lecture-step-content p {
  margin: 0;
  font-size: 15px;
  line-height: 1.75;
  color: #b8b8b0;
  overflow-wrap: break-word;
}

/* ============================================================
   SOUS-SECTIONS
   ============================================================ */
.lecture-section-sub {
  margin: 32px 0 20px;
  min-width: 0;
}

.lecture-subtitle {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 19px;
  font-weight: 700;
  color: var(--text-light);
  margin: 0 0 14px;
  letter-spacing: -0.01em;
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  overflow-wrap: break-word;
}

/* ============================================================
   COMPOSANTS SPÉCIAUX
   ============================================================ */

/* Chaîne des ensembles */
.lecture-chain {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  padding: 28px 12px;
  margin: 28px 0;
  border-top: 1px solid rgba(255,255,255,0.05);
  border-bottom: 1px solid rgba(255,255,255,0.05);
}

.chain-item {
  font-family: 'Playfair Display', serif;
  font-size: 22px;
  font-weight: 700;
  color: #6a6a62;
  padding: 4px 10px;
  transition: color 0.25s;
}

.chain-item.active { color: var(--accent-bright); }

.chain-arrow {
  color: #4a4a42;
  font-size: 11px;
}

/* Puissances de i */
.lecture-powers-cycle {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0;
  margin: 28px 0;
  border-top: 1px solid rgba(255,255,255,0.06);
  border-bottom: 1px solid rgba(255,255,255,0.06);
}

.power-box {
  padding: 22px 10px;
  text-align: center;
  border-right: 1px solid rgba(255,255,255,0.04);
  min-width: 0;
}

.power-box:last-child { border-right: none; }

.power-expo {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--accent);
  margin-bottom: 10px;
  text-transform: uppercase;
}

.power-value {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 26px;
  font-weight: 700;
  color: var(--text-light);
  line-height: 1;
}

/* Grille vocabulaire */
.lecture-vocab-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0;
  margin: 24px 0;
  border-top: 1px solid rgba(255,255,255,0.06);
  border-bottom: 1px solid rgba(255,255,255,0.06);
}

.vocab-card {
  padding: 20px 18px;
  border-right: 1px solid rgba(255,255,255,0.04);
  border-bottom: 1px solid rgba(255,255,255,0.04);
  min-width: 0;
}

.vocab-card:nth-child(2n) { border-right: none; }
.vocab-card:nth-last-child(-n+2) { border-bottom: none; }

.vocab-symbol {
  font-family: 'Playfair Display', serif;
  font-size: 26px;
  font-weight: 700;
  color: var(--accent-bright);
  line-height: 1;
  margin-bottom: 10px;
}

.vocab-name {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-light);
  margin-bottom: 5px;
}

.vocab-notation {
  font-size: 12px;
  color: var(--text-dim);
  font-family: 'Playfair Display', serif;
}

.vocab-card-success .vocab-symbol { color: #4ade80; }
.vocab-card-info .vocab-symbol { color: #60a5fa; }

/* Plan complexe */
.lecture-plane-visual {
  position: relative;
  height: 260px;
  margin: 28px 0;
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 4px;
  overflow: hidden;
}

.plane-axis-y {
  position: absolute;
  left: 50%; top: 0; bottom: 0;
  width: 1px;
  background: rgba(224,184,74,0.2);
}

.plane-axis-x {
  position: absolute;
  left: 0; right: 0; top: 50%;
  height: 1px;
  background: rgba(224,184,74,0.2);
}

.plane-label {
  position: absolute;
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 1.8px;
  text-transform: uppercase;
  color: #6a6a62;
}

.plane-axis-y .plane-label { top: 10px; left: 8px; }
.plane-axis-x .plane-label { bottom: 10px; right: 12px; }

.plane-point {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent-bright);
  box-shadow: 0 0 0 4px rgba(224,184,74,0.15);
}

.plane-point::after {
  content: attr(data-label);
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  font-weight: 600;
  color: var(--accent-bright);
  white-space: nowrap;
}

.plane-point-real {
  background: #4ade80;
  box-shadow: 0 0 0 4px rgba(74,222,128,0.15);
}
.plane-point-real::after { color: #4ade80; }

.plane-point-imag {
  background: #60a5fa;
  box-shadow: 0 0 0 4px rgba(96,165,250,0.15);
}
.plane-point-imag::after { color: #60a5fa; }

.plane-point[data-label] {
  font-size: 0;
  color: transparent;
}

/* Récapitulatif */
.lecture-recap {
  margin: 56px 0 24px;
  padding: 28px 0 0;
  border-top: 1px solid rgba(224,184,74,0.15);
  position: relative;
  min-width: 0;
}

.lecture-recap::before {
  content: '';
  position: absolute;
  top: -1px;
  left: 0;
  width: 60px;
  height: 2px;
  background: var(--accent-bright);
}

.lecture-recap-title {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--accent-bright);
  margin-bottom: 18px;
}

.lecture-recap-list {
  list-style: none;
  padding: 0;
  margin: 0;
}

.lecture-recap-list li {
  position: relative;
  padding: 9px 0 9px 28px;
  color: #cfd0cc;
  font-size: 15.5px;
  line-height: 1.8;
  border-bottom: 1px solid rgba(255,255,255,0.03);
  overflow-wrap: break-word;
  word-break: break-word;
}

.lecture-recap-list li:last-child { border-bottom: none; }

.lecture-recap-list li::before {
  content: '✓';
  position: absolute;
  left: 0;
  top: 9px;
  color: #4ade80;
  font-size: 14px;
  font-weight: 700;
}

/* Fin de partie */
.lecture-end {
  text-align: center;
  margin: 64px 0 20px;
  padding: 40px 16px 28px;
  border-top: 1px solid rgba(224,184,74,0.1);
}

.lecture-end-icon {
  display: block;
  font-size: 30px;
  margin-bottom: 14px;
  opacity: 0.7;
}

.lecture-end-text {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 22px;
  font-weight: 700;
  font-style: italic;
  color: var(--accent-bright);
  margin-bottom: 8px;
  letter-spacing: -0.01em;
}

.lecture-end-sub {
  font-size: 13.5px;
  color: var(--text-dim);
  margin-bottom: 20px;
  letter-spacing: 0.02em;
}

.lecture-end-divider {
  width: 40px;
  height: 1px;
  margin: 0 auto;
  background: rgba(224,184,74,0.4);
}

/* ============================================================
   EXERCICES — liste des questions
   ============================================================ */
.lecture-exo-list {
  list-style: none;
  counter-reset: exo;
  padding: 0;
  margin: 18px 0;
}

.lecture-exo-list li {
  counter-increment: exo;
  position: relative;
  padding: 14px 0 14px 44px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  font-size: 15.5px;
  line-height: 1.8;
  color: #cfd0cc;
  overflow-wrap: break-word;
  word-break: break-word;
  min-width: 0;
}

.lecture-exo-list li:last-child { border-bottom: none; }

.lecture-exo-list li::before {
  content: counter(exo) ".";
  position: absolute;
  left: 0;
  top: 14px;
  font-family: 'Playfair Display', serif;
  font-size: 15px;
  font-weight: 700;
  color: #60a5fa;
  min-width: 28px;
}

.lecture-exo-list li em {
  color: var(--text-dim);
  font-style: italic;
  font-size: 14px;
}

.lecture-exo-extra {
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px dashed rgba(255,255,255,0.08);
}

/* CTA fin exo / corr */
.lecture-exo-cta {
  margin: 56px 0 24px;
  padding: 36px 20px 28px;
  text-align: center;
  border-top: 1px solid rgba(255,255,255,0.06);
  min-width: 0;
}

.lecture-exo-cta-text {
  font-size: 15px;
  color: #9a9a92;
  margin: 0 auto 20px;
  font-style: italic;
  line-height: 1.7;
  max-width: 480px;
  overflow-wrap: break-word;
}

.lecture-exo-cta-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 13px 30px;
  border-radius: 100px;
  background: linear-gradient(135deg, var(--accent-bright), var(--accent));
  color: #0A0A0A;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.02em;
  text-decoration: none;
  transition: all 0.25s cubic-bezier(0.25,1,0.5,1);
  border: none;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(224,184,74,0.2);
  max-width: 100%;
}

.lecture-exo-cta-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 28px rgba(224,184,74,0.35);
}

.lecture-exo-cta-btn i { font-size: 13px; }

.lecture-corr-cta .lecture-exo-cta-btn {
  background: linear-gradient(135deg, #4ade80, #2D7D5A);
  box-shadow: 0 4px 20px rgba(74,222,128,0.2);
}

.lecture-corr-cta .lecture-exo-cta-btn:hover {
  box-shadow: 0 8px 28px rgba(74,222,128,0.35);
}

.lecture-exo-cta-btn-back {
  background: transparent;
  color: #b8b8b0;
  border: 1px solid rgba(255,255,255,0.1);
  box-shadow: none;
}

.lecture-exo-cta-btn-back:hover {
  background: rgba(255,255,255,0.03);
  color: var(--text-light);
  border-color: rgba(224,184,74,0.3);
  box-shadow: none;
  transform: translateY(-2px);
}

/* ============================================================
   CORRECTIONS — format compact
   ============================================================ */
.lecture-corr-item {
  padding: 22px 0 24px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  min-width: 0;
  max-width: 100%;
  box-sizing: border-box;
}

.lecture-corr-item:last-child { border-bottom: none; }

.lecture-corr-head {
  display: flex;
  align-items: baseline;
  gap: 14px;
  margin-bottom: 14px;
  flex-wrap: wrap;
  min-width: 0;
}

.lecture-corr-num {
  flex-shrink: 0;
  font-family: 'Playfair Display', serif;
  font-size: 18px;
  font-weight: 700;
  color: #4ade80;
  opacity: 0.8;
  line-height: 1.2;
  min-width: 24px;
  letter-spacing: -0.01em;
}

.lecture-corr-q {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 16.5px;
  font-weight: 600;
  color: var(--text-light);
  margin: 0;
  line-height: 1.4;
  overflow-wrap: break-word;
  word-break: break-word;
  min-width: 0;
}

.lecture-corr-ans {
  display: block;
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 16px;
  font-weight: 500;
  color: #4ade80;
  margin: 0 0 14px 0;
  padding-left: 38px;
  line-height: 1.5;
  overflow-wrap: break-word;
  word-break: break-word;
}

.lecture-corr-ans::before {
  content: '→ ';
  color: #4ade80;
  opacity: 0.6;
  margin-right: 4px;
}

.lecture-corr-body {
  padding-left: 38px;
  min-width: 0;
  overflow-wrap: break-word;
  word-break: break-word;
}

.lecture-corr-body p {
  margin: 0 0 10px;
  font-size: 15px;
  line-height: 1.8;
  color: #cfd0cc;
  overflow-wrap: break-word;
  word-break: break-word;
}

.lecture-corr-body p:last-child { margin-bottom: 0; }
.lecture-corr-body p strong { color: var(--text-light); font-weight: 600; }

.lecture-corr-body .math {
  white-space: normal;
  overflow-wrap: anywhere;
}

.lecture-corr-note {
  margin: 12px 0 0;
  padding: 8px 0 8px 14px;
  border-left: 2px solid #f87171;
  font-size: 13.5px;
  line-height: 1.7;
  color: #b0b0a8;
  font-style: italic;
  overflow-wrap: break-word;
  word-break: break-word;
}

.lecture-corr-note::before {
  content: '⚠ ';
  color: #f87171;
  font-style: normal;
  font-weight: 700;
  margin-right: 4px;
}

.lecture-corr-note strong {
  color: var(--text-light);
  font-style: normal;
}

.lecture-corr-link {
  display: block;
  margin: 12px 0 0;
  padding-left: 38px;
  font-size: 12px;
  color: #6a6a62;

  border-color: rgba(224, 184, 74, 0.3);

}

/* Animation pulse pendant la lecture */
.tts-btn.speaking i {
  animation: ttsPulse 1.2s ease-in-out infinite;
}

@keyframes ttsPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* Barre de progression de lecture */
.tts-progress {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: rgba(96, 165, 250, 0.1);
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

  opacity: 1;
}

.tts-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #60a5fa, #E0B84A);
  width: 0%;

  box-shadow: 0 0 12px rgba(96, 165, 250, 0.5);
}

  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js"
    }
  }
  </script>

  <script type="module">
  // ================================================================
// LECTURE — VERSION COMPLÈTE AVEC TEXT-TO-SPEECH
// ================================================================

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

// ================================================================
// CONFIG FIREBASE
// ================================================================
const firebaseConfig = {
  apiKey: "AIzaSyDHscOXw3rLuhV6z1Cny-bdYCumqpnG7QE",
  authDomain: "arvexa-fbf10.firebaseapp.com",
  projectId: "arvexa-fbf10",
  storageBucket: "arvexa-fbf10.firebasestorage.app",
  messagingSenderId: "920108330053",
  appId: "1:920108330053:web:f532d71cbc2c824bc7472c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

try {
  await setPersistence(auth, browserLocalPersistence);
} catch (e) {}

// ================================================================
// URL PARAMS
// ================================================================
const params = new URLSearchParams(window.location.search);
const subject = params.get('subject') || 'mathematiques';
const chapter = parseInt(params.get('chapter')) || 0;
const tab = params.get('tab') || 'cours';
const partIndex = parseInt(params.get('part')) || 0;

// ================================================================
// DOM
// ================================================================
const contentBody = document.getElementById('contentBody');
const pageTitle = document.querySelector('#pageTitle span');
const backBtn = document.getElementById('backBtn');
const notesBtn = document.getElementById('notesBtn');
const notesDot = document.getElementById('notesDot');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const partCounter = document.getElementById('partCounter');

// Modal notes
const notesModal = document.getElementById('notesModal');
const modalClose = document.getElementById('modalClose');
const modalCancel = document.getElementById('modalCancel');
const modalSave = document.getElementById('modalSave');
const notesTextarea = document.getElementById('notesTextarea');
const modalSub = document.getElementById('modalSub');
const noteSaved = document.getElementById('noteSaved');

// TTS
const ttsBtn = document.getElementById('ttsBtn');
const ttsProgress = document.getElementById('ttsProgress');
const ttsProgressFill = document.getElementById('ttsProgressFill');

// ================================================================
// GESTION DES LECTURES + NOTES
// ================================================================
const READ_KEY = 'arvexa_read_parts';
const NOTES_KEY = 'arvexa_notes';

function getReadParts() {
  try { return JSON.parse(localStorage.getItem(READ_KEY) || '[]'); }
  catch(e) { return []; }
}

function markPartAsRead() {
  const key = `${subject}_${chapter}_${tab}_${partIndex}`;
  const readParts = getReadParts();
  if (!readParts.includes(key)) {
    readParts.push(key);
    localStorage.setItem(READ_KEY, JSON.stringify(readParts));
  }
}

function getNotesKey() {
  return `${subject}_${chapter}_${tab}_${partIndex}`;
}

function loadNotes() {
  try {
    const notes = JSON.parse(localStorage.getItem(NOTES_KEY) || '{}');
    const key = getNotesKey();
    if (notes[key]) {
      notesTextarea.value = notes[key];
      notesDot.classList.add('show');
    } else {
      notesTextarea.value = '';
      notesDot.classList.remove('show');
    }
  } catch(e) {}
}

function saveNotes() {
  try {
    const notes = JSON.parse(localStorage.getItem(NOTES_KEY) || '{}');
    const key = getNotesKey();
    const text = notesTextarea.value.trim();
    if (text) {
      notes[key] = text;
      notesDot.classList.add('show');
    } else {
      delete notes[key];
      notesDot.classList.remove('show');
    }
    localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
    noteSaved.classList.add('show');
    setTimeout(() => noteSaved.classList.remove('show'), 2000);
  } catch(e) {}
}

// ================================================================
// ÉTAT
// ================================================================
let parts = [];
let currentIndex = partIndex;
let isPremium = false;

// ================================================================
// VÉRIFICATION PREMIUM
// ================================================================
function checkAccess() {
  try {
    const userData = JSON.parse(localStorage.getItem('arvexa_user_data') || '{}');
    isPremium = userData.premium === true || userData.isUnlocked === true || userData.hasDeposited === true;
  } catch(e) {}

  const isFree = chapter === 0;
  const isCorrection = tab === 'corrections';

  if (!isFree && !isPremium) {
    showBlocked();
    return false;
  }

  if (isCorrection && !isFree && !isPremium) {
    showBlocked('🔒 Correction Premium', 'Les corrections sont réservées aux abonnés Premium.');
    return false;
  }

  return true;
}

function showBlocked(title = '🔒 Chapitre Premium', message = 'Ce chapitre est réservé aux abonnés Premium.') {
  contentBody.innerHTML = `
    <div class="premium-blocked">
      <div class="premium-blocked-icon"><i class="fas fa-lock"></i></div>
      <h2>${title}</h2>
      <p>${message}</p>
      <a href="abonnement.html" class="btn-premium">Voir les offres</a>
    </div>
  `;
  pageTitle.textContent = '🔒 Verrouillé';
  document.title = 'ARVEXA - Verrouillé';
  prevBtn.style.display = 'none';
  nextBtn.style.display = 'none';
  partCounter.style.display = 'none';
  notesBtn.style.display = 'none';
  if (ttsBtn) ttsBtn.style.display = 'none';
}

// ================================================================
// CHARGEMENT DU CONTENU
// ================================================================
function loadContent() {
  if (!checkAccess()) return;

  const suffix = tab === 'cours' ? 'cours' : (tab === 'exercices' ? 'exo' : 'corr');
  const manifestPath = `cours/${subject}/ch${chapter}_${suffix}.json`;

  contentBody.innerHTML = `
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Chargement du contenu...</p>
    </div>
  `;

  fetch(manifestPath)
    .then(r => { if (!r.ok) throw new Error('Manifest non trouvé'); return r.json(); })
    .then(data => {
      parts = data.parts || [];
      if (currentIndex >= parts.length) currentIndex = 0;
      renderPart();
    })
    .catch(() => {
      contentBody.innerHTML = `
        <div class="empty-state">
          <div class="es-icon"><i class="fas fa-exclamation-triangle"></i></div>
          <h4>Contenu non disponible</h4>
          <p>Le contenu de cette section n'est pas encore disponible.</p>
        </div>
      `;
      pageTitle.textContent = 'Contenu indisponible';
      prevBtn.style.display = 'none';
      nextBtn.style.display = 'none';
      partCounter.style.display = 'none';
    });
}

function renderPart() {
  if (!parts || parts.length === 0) {
    contentBody.innerHTML = `
      <div class="empty-state">
        <div class="es-icon"><i class="fas fa-folder-open"></i></div>
        <h4>Aucune partie disponible</h4>
        <p>Le contenu de cette section n'est pas encore disponible.</p>
      </div>
    `;
    return;
  }

  if (currentIndex >= parts.length || currentIndex < 0) {
    currentIndex = 0;
  }

  const part = parts[currentIndex];
  if (!part) {
    contentBody.innerHTML = `
      <div class="empty-state">
        <div class="es-icon"><i class="fas fa-exclamation-triangle"></i></div>
        <h4>Partie introuvable</h4>
        <p>La partie demandée n'existe pas.</p>
      </div>
    `;
    return;
  }

  // Stopper la lecture TTS si en cours
  stopTTS();

  // Mettre à jour le titre
  pageTitle.textContent = part.title || 'Partie ' + (currentIndex + 1);
  document.title = 'ARVEXA - ' + (part.title || 'Lecture');

  // Mettre à jour le compteur
  partCounter.textContent = `${currentIndex + 1} / ${parts.length}`;

  // Boutons de navigation
  prevBtn.disabled = currentIndex === 0;
  nextBtn.disabled = currentIndex >= parts.length - 1;

  // Sous-titre du modal
  modalSub.textContent = `${part.title || 'Partie ' + (currentIndex + 1)} — ${subject.charAt(0).toUpperCase() + subject.slice(1)}`;

  // Charger le fichier
  const filePath = `cours/${subject}/${part.file}`;
  contentBody.innerHTML = `
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Chargement...</p>
    </div>
  `;

  fetch(filePath)
    .then(r => { if (!r.ok) throw new Error('Fichier non trouvé'); return r.text(); })
    .then(html => {
      contentBody.innerHTML = html;
      markPartAsRead();
      loadNotes();
    })
    .catch(() => {
      contentBody.innerHTML = `
        <div class="empty-state">
          <div class="es-icon"><i class="fas fa-file-lines"></i></div>
          <h4>Contenu non disponible</h4>
          <p>Le fichier <strong>${part.file}</strong> n'a pas été trouvé.</p>
        </div>
      `;
    });
}

// ================================================================
// NAVIGATION
// ================================================================
function goToPrev() {
  if (currentIndex > 0) {
    currentIndex--;
    if (notesTextarea.value.trim()) saveNotes();
    renderPart();
  }
}

function goToNext() {
  if (currentIndex < parts.length - 1) {
    currentIndex++;
    if (notesTextarea.value.trim()) saveNotes();
    renderPart();
  }
}

// ================================================================
// MODAL NOTES
// ================================================================
function openModal() {
  notesModal.classList.add('show');
  document.body.style.overflow = 'hidden';
  notesTextarea.focus();
}

function closeModal() {
  notesModal.classList.remove('show');
  document.body.style.overflow = '';
}

// ================================================================
// ÉVÉNEMENTS
// ================================================================
backBtn.addEventListener('click', () => {
  window.location.href = `chapitre.html?subject=${subject}&chapter=${chapter}&tab=${tab}`;
});

prevBtn.addEventListener('click', goToPrev);
nextBtn.addEventListener('click', goToNext);

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' && !prevBtn.disabled) goToPrev();
  if (e.key === 'ArrowRight' && !nextBtn.disabled) goToNext();
  if (e.key === 'Escape') closeModal();
});

notesBtn.addEventListener('click', openModal);
modalClose.addEventListener('click', closeModal);
modalCancel.addEventListener('click', closeModal);
notesModal.addEventListener('click', (e) => {
  if (e.target === notesModal) closeModal();
});

modalSave.addEventListener('click', () => {
  saveNotes();
  closeModal();
});

// ================================================================
// TEXT-TO-SPEECH (Web Speech API)
// ================================================================

// Détection du support
const TTS_SUPPORTED = typeof window !== 'undefined'
  && 'speechSynthesis' in window
  && typeof window.SpeechSynthesisUtterance === 'function';

const tts = {
  synth: TTS_SUPPORTED ? window.speechSynthesis : null,
  utterance: null,
  chunks: [],
  currentChunk: 0,
  isSpeaking: false,
  isPaused: false,
  voice: null,
  lang: 'fr-FR'
};

// Masquer le bouton si API non supportée
if (!TTS_SUPPORTED && ttsBtn) {
  ttsBtn.style.display = 'none';
  console.warn('⚠️ Web Speech API non supportée sur ce navigateur.');
}

// ================================================================
// CHARGEMENT DE LA VOIX
// ================================================================
function loadVoice() {
  if (!TTS_SUPPORTED || !tts.synth) return;
  try {
    const voices = tts.synth.getVoices();
    if (!voices || voices.length === 0) return;

    tts.voice = voices.find(v => v.lang === 'fr-FR' && v.localService)
             || voices.find(v => v.lang === 'fr-FR')
             || voices.find(v => v.lang && v.lang.startsWith('fr'))
             || null;
  } catch (e) {
    console.warn('Erreur lors du chargement des voix :', e);
  }
}

loadVoice();

if (TTS_SUPPORTED && tts.synth && typeof tts.synth.onvoiceschanged !== 'undefined') {
  tts.synth.onvoiceschanged = loadVoice;
}

if (TTS_SUPPORTED) {
  setTimeout(loadVoice, 500);
  setTimeout(loadVoice, 1500);
}

// ================================================================
// NETTOYAGE DU TEXTE
// ================================================================
function stripEmojis(text) {
  return text.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}\u{FE0F}\u{1F000}-\u{1F2FF}]/gu, ' ');
}

function replaceMathSymbols(text) {
  const replacements = [
    [/\bi²\b/g, 'i au carré'],
    [/\bi³\b/g, 'i au cube'],
    [/\bi⁴\b/g, 'i puissance quatre'],
    [/\biⁿ\b/g, 'i puissance n'],
    [/\bi\^\(n mod 4\)/gi, 'i puissance n modulo 4'],
    [/Re\s*\(\s*z\s*\)/g, 'partie réelle de z'],
    [/Im\s*\(\s*z\s*\)/g, 'partie imaginaire de z'],
    [/√\s*\(([^)]+)\)/g, 'racine de $1'],
    [/√(\d+)/g, 'racine de $1'],
    [/√/g, 'racine de '],
    [/∈/g, ' appartient à '],
    [/⊂/g, ' inclus dans '],
    [/≤/g, ' inférieur ou égal à '],
    [/≥/g, ' supérieur ou égal à '],
    [/≠/g, ' différent de '],
    [/≡/g, ' congru à '],
    [/⟺/g, ' si et seulement si '],
    [/⟹/g, ' implique '],
    [/×/g, ' fois '],
    [/·/g, ' fois '],
    [/÷/g, ' divisé par '],
    [/−/g, ' moins '],
    [/ℝ/g, ' R '],
    [/ℂ/g, ' C '],
    [/ℕ/g, ' N '],
    [/ℤ/g, ' Z '],
    [/ℚ/g, ' Q '],
    [/∞/g, ' infini '],
    [/\bmod\b/gi, ' modulo '],
    [/\s*=\s*/g, ' égale '],
  ];
  let result = text;
  for (const [pattern, replacement] of replacements) {
    result = result.replace(pattern, replacement);
  }
  return result;
}

function cleanText(text) {
  if (!text) return '';
  let t = text;
  t = stripEmojis(t);
  t = replaceMathSymbols(t);
  t = t.replace(/\s+/g, ' ').trim();
  return t;
}

// ================================================================
// EXTRACTION DU CONTENU À LIRE
// ================================================================
function extractReadableContent() {
  const container = document.querySelector('#contentBody .lecture-container');
  if (!container) return [];

  const chunks = [];

  // 1. Titre principal uniquement
  const heroTitle = container.querySelector('.lecture-hero-title, .lecture-part-title');
  if (heroTitle) {
    const t = cleanText(heroTitle.textContent);
    if (t) chunks.push(t);
  }

  // 2. Parcourir les sections
  const sections = container.querySelectorAll('.lecture-section');
  sections.forEach(section => {
    const sectionEyebrow = section.querySelector('.lecture-section-eyebrow');
    const sectionTitle = section.querySelector('.lecture-section-title');
    let headText = '';
    if (sectionEyebrow) headText += cleanText(sectionEyebrow.textContent) + '. ';
    if (sectionTitle) headText += cleanText(sectionTitle.textContent) + '.';
    if (headText) chunks.push(headText);

    const body = section.querySelector('.lecture-section-body');
    if (!body) return;

    // Récupérer les éléments dans l'ordre du DOM
    const selector = [
      '.lecture-text',
      '.lecture-list li',
      '.lecture-callout',
      '.lecture-card',
      '.lecture-aside',
      '.lecture-formula-hero',
      '.lecture-formula-box',
      '.lecture-rule',
      '.lecture-example',
      '.lecture-step',
      '.lecture-subtitle',
      '.lecture-exo-list li',
      '.lecture-corr-item'
    ].join(', ');

    const allElements = body.querySelectorAll(selector);
    const seen = new Set();

    allElements.forEach(el => {
      if (seen.has(el)) return;
      let isNested = false;
      seen.forEach(prev => {
        if (prev.contains(el) || el.contains(prev)) isNested = true;
      });
      if (isNested) return;
      seen.add(el);

      let text = '';

      if (el.classList.contains('lecture-formula-hero')) {
        const label = el.querySelector('.lecture-formula-hero-label');
        const main = el.querySelector('.lecture-formula-hero-main');
        const desc = el.querySelector('.lecture-formula-hero-desc');
        if (label) text += cleanText(label.textContent) + '. ';
        if (main) text += cleanText(main.textContent) + '. ';
        if (desc) text += cleanText(desc.textContent) + '. ';
      }
      else if (el.classList.contains('lecture-formula-box')) {
        const main = el.querySelector('.lecture-formula-main');
        const desc = el.querySelector('.lecture-formula-desc');
        if (main) text += cleanText(main.textContent) + '. ';
        if (desc) text += cleanText(desc.textContent) + '. ';
      }
      else if (el.classList.contains('lecture-rule')) {
        const label = el.querySelector('.lecture-rule-label');
        const bodyEl = el.querySelector('.lecture-rule-body');
        if (label) text += cleanText(label.textContent) + '. ';
        if (bodyEl) text += cleanText(bodyEl.textContent) + '. ';
      }
      else if (el.classList.contains('lecture-example')) {
        const label = el.querySelector('.lecture-example-label');
        const content = el.querySelector('.lecture-example-content');
        if (label) text += cleanText(label.textContent) + '. ';
        if (content) text += cleanText(content.textContent) + '. ';
      }
      else if (el.classList.contains('lecture-callout')) {
        const title = el.querySelector('.lecture-callout-title, .lecture-callout-label');
        const bodyEl = el.querySelector('.lecture-callout-body, .lecture-callout-content');
        if (title) text += cleanText(title.textContent) + '. ';
        if (bodyEl) text += cleanText(bodyEl.textContent) + '. ';
      }
      else if (el.classList.contains('lecture-card')) {
        const label = el.querySelector('.lecture-card-label');
        const content = el.querySelector('.lecture-card-content');
        if (label) text += cleanText(label.textContent) + '. ';
        if (content) text += cleanText(content.textContent) + '. ';
      }
      else if (el.classList.contains('lecture-aside')) {
        const label = el.querySelector('.lecture-aside-label');
        const content = el.querySelector('.lecture-aside-content');
        if (label) text += cleanText(label.textContent) + '. ';
        if (content) text += cleanText(content.textContent) + '. ';
      }
      else if (el.classList.contains('lecture-corr-item')) {
        const q = el.querySelector('.lecture-corr-q');
        const ans = el.querySelector('.lecture-corr-ans');
        const bodyEl = el.querySelector('.lecture-corr-body');
        if (q) text += 'Question. ' + cleanText(q.textContent) + '. ';
        if (ans) text += 'Réponse. ' + cleanText(ans.textContent) + '. ';
        if (bodyEl) text += cleanText(bodyEl.textContent) + '. ';
      }
      else {
        text = cleanText(el.textContent);
      }

      if (text) chunks.push(text);
    });
  });

  // 3. Récap
  const recap = container.querySelector('.lecture-recap');
  if (recap) {
    const title = recap.querySelector('.lecture-recap-title');
    if (title) chunks.push(cleanText(title.textContent));
    recap.querySelectorAll('.lecture-recap-list li').forEach(li => {
      const t = cleanText(li.textContent);
      if (t) chunks.push(t);
    });
  }

  // 4. Fin
  const end = container.querySelector('.lecture-end-text');
  if (end) chunks.push(cleanText(end.textContent));

  return chunks.filter(c => c.length > 0);
}

// ================================================================
// LECTURE
// ================================================================
function updateProgress() {
  if (tts.chunks.length === 0) return;
  const percent = (tts.currentChunk / tts.chunks.length) * 100;
  ttsProgressFill.style.width = percent + '%';
}

function speakChunk(index) {
  if (index >= tts.chunks.length) {
    stopTTS();
    return;
  }

  tts.currentChunk = index;
  const text = tts.chunks[index];

  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = tts.lang;
  if (tts.voice) utt.voice = tts.voice;
  utt.rate = 0.95;
  utt.pitch = 1;
  utt.volume = 1;

  utt.onend = () => {
    if (tts.isSpeaking && !tts.isPaused) {
      speakChunk(index + 1);
    }
  };

  utt.onerror = (e) => {
    if (e.error !== 'interrupted' && e.error !== 'canceled') {
      console.warn('TTS error:', e.error);
    }
  };

  tts.utterance = utt;
  updateProgress();
  tts.synth.speak(utt);
}

function startTTS() {
  if (!TTS_SUPPORTED || !tts.synth) {
    alert('La synthèse vocale n\'est pas disponible sur ce navigateur.');
    return;
  }

  tts.synth.cancel();

  tts.chunks = extractReadableContent();
  tts.currentChunk = 0;

  if (tts.chunks.length === 0) {
    return;
  }

  tts.isSpeaking = true;
  tts.isPaused = false;

  ttsBtn.classList.add('speaking');
  ttsBtn.classList.remove('paused');
  ttsBtn.querySelector('i').className = 'fas fa-pause';
  ttsBtn.querySelector('span').textContent = 'Pause';
  ttsProgress.classList.add('active');

  speakChunk(0);
}

function pauseTTS() {
  if (!tts.isSpeaking || tts.isPaused) return;
  tts.synth.pause();
  tts.isPaused = true;

  ttsBtn.classList.remove('speaking');
  ttsBtn.classList.add('paused');
  ttsBtn.querySelector('i').className = 'fas fa-play';
  ttsBtn.querySelector('span').textContent = 'Reprendre';
}

function resumeTTS() {
  if (!tts.isSpeaking || !tts.isPaused) return;
  tts.synth.resume();
  tts.isPaused = false;

  ttsBtn.classList.add('speaking');
  ttsBtn.classList.remove('paused');
  ttsBtn.querySelector('i').className = 'fas fa-pause';
  ttsBtn.querySelector('span').textContent = 'Pause';
}

function stopTTS() {
  if (tts.synth) {
    try { tts.synth.cancel(); } catch(e) {}
  }
  tts.isSpeaking = false;
  tts.isPaused = false;
  tts.utterance = null;
  tts.chunks = [];
  tts.currentChunk = 0;

  if (ttsBtn) {
    ttsBtn.classList.remove('speaking', 'paused');
    ttsBtn.querySelector('i').className = 'fas fa-volume-up';
    ttsBtn.querySelector('span').textContent = 'Écouter';
  }
  if (ttsProgress) ttsProgress.classList.remove('active');
  if (ttsProgressFill) ttsProgressFill.style.width = '0%';
}

// ================================================================
// ÉVÉNEMENTS TTS
// ================================================================
if (ttsBtn) {
  ttsBtn.addEventListener('click', () => {
    if (!tts.isSpeaking) {
      startTTS();
    } else if (tts.isPaused) {
      resumeTTS();
    } else {
      pauseTTS();
    }
  });

  // Long press pour stop
  let longPressTimer = null;

  const startLongPress = () => {
    longPressTimer = setTimeout(() => {
      stopTTS();
      longPressTimer = null;
    }, 700);
  };

  const cancelLongPress = () => {
    if (longPressTimer) {
      clearTimeout(longPressTimer);
      longPressTimer = null;
    }
  };

  ttsBtn.addEventListener('mousedown', startLongPress);
  ttsBtn.addEventListener('mouseup', cancelLongPress);
  ttsBtn.addEventListener('mouseleave', cancelLongPress);

  ttsBtn.addEventListener('touchstart', startLongPress, { passive: true });
  ttsBtn.addEventListener('touchend', cancelLongPress);
  ttsBtn.addEventListener('touchcancel', cancelLongPress);
}

// Stop au déchargement
window.addEventListener('beforeunload', () => {
  if (TTS_SUPPORTED && tts.synth) {
    try { tts.synth.cancel(); } catch(e) {}
  }
});

// Stop au changement de contenu (via MutationObserver)
if (contentBody) {
  const observer = new MutationObserver(() => {
    if (tts.isSpeaking) {
      stopTTS();
    }
  });
  observer.observe(contentBody, { childList: true });
}

// ================================================================
// AUTH
// ================================================================
onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = 'login.html';
    return;
  }
  loadContent();
});
