<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta name="theme-color" content="#0A0A0A">

  <style>
    /* ============================================================
       ROOT — Design system ARVEXa
       ============================================================ */
    :root {
      --primary: #1A3A2A;
      --primary-dark: #0A1A12;
      --primary-light: #2A5A3A;
      --accent: #B8860B;
      --accent-bright: #E0B84A;
      --accent-dim: rgba(184, 134, 11, 0.08);
      --success: #2D7D5A;
      --danger: #B85C3A;
      --bg-dark: #0A0A0A;
      --bg-surface: #141414;
      --bg-card: rgba(20, 20, 20, 0.7);
      --text-light: #F5F0E8;
      --text-dim: #8A8A7A;
      --text-muted: #5A5A4A;
      --card-border: rgba(184, 134, 11, 0.08);
      --transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --radius: 16px;
      --sidebar-width: 240px;
      --header-height: 64px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html { scroll-behavior: smooth; width: 100%; overflow-x: hidden; }

    body {
      font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      width: 100%;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      display: flex;
    }

    .gradient-bg {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
      background: radial-gradient(ellipse 40% 30% at 30% 15%, rgba(26, 58, 42, 0.16) 0%, transparent 70%),
                  radial-gradient(ellipse 35% 25% at 75% 85%, rgba(184, 134, 11, 0.05) 0%, transparent 60%),
                  linear-gradient(180deg, #0A0A0A 0%, #060606 100%);
    }
    .glow {
      position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: -1;
      opacity: 0.15; animation: glowMove 10s ease-in-out infinite alternate;
    }
    .glow-1 { width: 350px; height: 350px; background: rgba(26,58,42,0.18); top: -80px; right: -80px; }
    .glow-2 { width: 200px; height: 200px; background: rgba(184,134,11,0.05); bottom: 0; left: 0; animation-delay: -4s; }
    .glow-3 { width: 250px; height: 250px; background: rgba(26,58,42,0.1); top: 30%; left: 60%; transform: translate(-50%,-50%); animation-delay: -8s; }
    @keyframes glowMove { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(30px,-20px) scale(1.1); } }

    .sidebar-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background: rgba(0,0,0,0.6); z-index: 99; opacity: 0; transition: opacity 0.3s ease;
    }
    .sidebar-overlay.active { display: block; opacity: 1; }

    /* ============================================================
       SIDEBAR
       ============================================================ */
    .sidebar {
      position: fixed; top: 0; left: -280px; width: 280px; height: 100vh;
      background: rgba(10, 10, 10, 0.97); backdrop-filter: blur(16px);
      border-right: 1px solid rgba(184, 134, 11, 0.06);
      padding: 24px 16px; display: flex; flex-direction: column; z-index: 100;
      overflow-y: auto; transition: left 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .sidebar.open { left: 0; }
    .sidebar .logo {
      display: flex; align-items: center; text-decoration: none; color: var(--text-light);
      font-size: 20px; font-weight: 700; font-family: 'Playfair Display', 'Georgia', serif;
      letter-spacing: 2px; padding-bottom: 20px; margin-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .sidebar .logo span {
      background: linear-gradient(90deg, var(--accent), var(--accent-bright), var(--accent));
      background-size: 200% auto; -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; font-style: italic; animation: shimmerText 4s linear infinite;
    }
    @keyframes shimmerText { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
    .sidebar .nav { flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .sidebar .nav a {
      display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 10px;
      color: var(--text-dim); text-decoration: none; transition: var(--transition);
      font-size: 13px; font-weight: 500;
    }
    .sidebar .nav a i { width: 20px; text-align: center; font-size: 15px; }
    .sidebar .nav a:hover { color: var(--text-light); background: rgba(255,255,255,0.03); }
    .sidebar .nav a.active { color: var(--text-light); background: rgba(184, 134, 11, 0.08); border: 1px solid rgba(184, 134, 11, 0.08); }
    .sidebar .nav a.active i { color: var(--accent); }
    .sidebar .nav-divider { height: 1px; background: rgba(255,255,255,0.04); margin: 6px 0; }
    .sidebar .nav-bottom { margin-top: auto; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.04); }
    .sidebar .nav-bottom a { color: var(--text-muted); font-size: 12px; }
    .sidebar .nav-bottom a:hover { color: var(--text-dim); }

    /* ============================================================
       MAIN CONTENT
       ============================================================ */
    .main-content { flex: 1; width: 100%; min-height: 100vh; padding-bottom: 32px; }

    .header {
      position: sticky; top: 0; z-index: 50; display: flex; align-items: center;
      justify-content: space-between; padding: 10px 16px; background: rgba(10, 10, 10, 0.92);
      backdrop-filter: blur(12px); border-bottom: 1px solid rgba(184, 134, 11, 0.06);
      gap: 12px; min-height: var(--header-height);
    }
    .header .header-left { display: flex; align-items: center; gap: 12px; }
    .header .menu-toggle {
      display: flex; align-items: center; justify-content: center; width: 36px; height: 36px;
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); background: transparent;
      color: var(--text-dim); cursor: pointer; transition: var(--transition); font-size: 16px;
    }
    .header .menu-toggle:hover { border-color: rgba(184, 134, 11, 0.14); color: var(--text-light); }
    .header .page-title { font-size: 15px; font-weight: 600; color: var(--text-light); font-family: 'Playfair Display', serif; }
    .header .page-title i { color: var(--accent-bright); margin-right: 6px; font-size: 14px; }
    .header .header-actions { display: flex; align-items: center; gap: 6px; }
    .header .header-actions button {
      width: 36px; height: 36px; border-radius: 50%; border: none; background: rgba(255,255,255,0.04);
      color: var(--text-dim); cursor: pointer; transition: var(--transition); font-size: 15px;
      display: flex; align-items: center; justify-content: center;
    }
    .header .header-actions button:hover { background: rgba(255,255,255,0.07); color: var(--text-light); }

    .container { max-width: 700px; margin: 0 auto; padding: 16px 16px 20px; }

    /* ============================================================
       NOTIFICATIONS
       ============================================================ */
    .notif-card {
      background: var(--bg-card);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    .notif-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent-bright), var(--success));
    }

    .notif-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .notif-header h2 {
      font-size: 16px;
      font-weight: 700;
      font-family: 'Playfair Display', serif;
      color: var(--text-light);
    }
    .notif-header .badge-count {
      background: var(--accent);
      color: var(--bg-dark);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 20px;
    }

    /* === PERMISSION BANNER === */
    .permission-banner {
      background: rgba(184, 134, 11, 0.06);
      border: 1px solid rgba(184, 134, 11, 0.12);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .permission-banner .pb-icon {
      font-size: 24px;
      color: var(--accent-bright);
      flex-shrink: 0;
    }
    .permission-banner .pb-text {
      flex: 1;
      font-size: 13px;
      color: var(--text-dim);
    }
    .permission-banner .pb-text strong {
      color: var(--text-light);
    }
    .btn-enable {
      padding: 8px 18px;
      border-radius: 20px;
      border: none;
      background: linear-gradient(135deg, var(--accent-bright), var(--accent));
      color: #0A0A0A;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      font-family: 'Inter', sans-serif;
      white-space: nowrap;
    }
    .btn-enable:hover {
      transform: scale(1.02);
      box-shadow: 0 4px 16px rgba(184,134,11,0.2);
    }
    .btn-enable:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .btn-enable.enabled {
      background: var(--success);
      color: #fff;
    }

    /* === NOTIFICATION ITEMS === */
    .notif-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 500px;
      overflow-y: auto;
    }
    .notif-list::-webkit-scrollbar { width: 3px; }
    .notif-list::-webkit-scrollbar-thumb { background: rgba(184,134,11,0.2); border-radius: 10px; }

    .notif-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 14px;
      background: rgba(255,255,255,0.02);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.04);
      transition: var(--transition);
    }
    .notif-item:hover {
      background: rgba(255,255,255,0.04);
    }
    .notif-item .ni-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 16px;
      background: rgba(184,134,11,0.08);
      color: var(--accent-bright);
    }
    .notif-item .ni-icon.info { background: rgba(45,125,90,0.08); color: var(--success); }
    .notif-item .ni-icon.warning { background: rgba(212,160,23,0.08); color: #D4A017; }
    .notif-item .ni-icon.success { background: rgba(26,188,156,0.08); color: #1ABC9C; }
    .notif-item .ni-icon.danger { background: rgba(184,92,58,0.08); color: var(--danger); }

    .notif-item .ni-content { flex: 1; min-width: 0; }
    .notif-item .ni-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-light);
    }
    .notif-item .ni-text {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 2px;
      line-height: 1.5;
    }
    .notif-item .ni-time {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .notif-item .ni-time i { font-size: 9px; }

    .notif-item .ni-status {
      font-size: 8px;
      padding: 2px 8px;
      border-radius: 10px;
      background: rgba(45,125,90,0.08);
      color: var(--success);
      font-weight: 600;
      flex-shrink: 0;
      margin-left: 4px;
    }
    .notif-item .ni-status.unread {
      background: rgba(184,134,11,0.08);
      color: var(--accent-bright);
    }

    /* === EMPTY STATE === */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .empty-state i {
      font-size: 48px;
      color: var(--text-muted);
      opacity: 0.3;
    }
    .empty-state h4 {
      font-size: 16px;
      color: var(--text-dim);
      font-weight: 600;
    }
    .empty-state p {
      font-size: 13px;
      color: var(--text-muted);
      max-width: 280px;
    }

    /* === TOAST === */
    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
      padding: 12px 20px; border-radius: 12px; background: var(--bg-card); backdrop-filter: blur(16px);
      border: 1px solid var(--card-border); color: var(--text-light); font-size: 13px; z-index: 300;
      opacity: 0; transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1); max-width: 90%; text-align: center; box-shadow: var(--shadow);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: rgba(45, 125, 90, 0.25); }
    .toast.error { border-color: rgba(184, 92, 58, 0.3); }
    .toast .toast-icon { margin-right: 8px; }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (min-width: 768px) {
      .sidebar { left: 0; display: flex; }
      .sidebar-overlay { display: none !important; }
      .main-content { margin-left: var(--sidebar-width); }
      .header .menu-toggle { display: none; }
    }

    @media (max-width: 767px) {
      .sidebar { left: -280px; }
      .sidebar.open { left: 0; }
      .container { padding: 12px 12px 20px; }
    }

    @media (max-width: 480px) {
      .permission-banner { flex-direction: column; text-align: center; }
      .btn-enable { width: 100%; justify-content: center; }
      .notif-item { padding: 10px 12px; }
      .notif-item .ni-icon { width: 30px; height: 30px; font-size: 13px; }
    }

    a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(184, 134, 11, 0.25); border-radius: 10px; }
  </style>
</head>

function showToast(message, type = 'info') {
  toastMessage.textContent = message;
  toast.className = `toast ${type}`;
  toastIcon.className = type === 'success' ? 'fas fa-check-circle' : 'fas fa-exclamation-circle';
  toast.classList.add('show');
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => toast.classList.remove('show'), 4000);
}

function formatTime(timestamp) {
  if (!timestamp) return 'À l\'instant';
  const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
  const now = new Date();
  const diff = Math.floor((now - date) / 60000);

  if (diff < 1) return 'À l\'instant';
  if (diff < 60) return `Il y a ${diff} min`;
  if (diff < 1440) return `Il y a ${Math.floor(diff / 60)}h`;
  return date.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
}

function getIcon(type) {
  const icons = {
    'info': 'fa-info-circle',
    'success': 'fa-check-circle',
    'warning': 'fa-exclamation-triangle',
    'danger': 'fa-times-circle',
    'new_chapter': 'fa-book-open',
    'new_exercise': 'fa-pen-to-square',
    'premium': 'fa-crown',
    'update': 'fa-rotate'
  };
  return icons[type] || 'fa-bell';
}

function getIconClass(type) {
  const classes = {
    'info': 'info',
    'success': 'success',
    'warning': 'warning',
    'danger': 'danger',
    'new_chapter': 'success',
    'new_exercise': 'info',
    'premium': 'warning',
    'update': 'info'
  };
  return classes[type] || 'info';
}

// ================================================================

function checkNotificationSupport() {
  // Vérifier si le navigateur supporte les notifications
  if (typeof Notification === 'undefined') {
    if (permissionBanner) {
      permissionBanner.innerHTML = `
        <span class="pb-icon"><i class="fas fa-bell-slash"></i></span>
        <span class="pb-text">
          <strong>Notifications non supportées</strong><br>
          Votre navigateur ne supporte pas les notifications push. Utilisez Chrome ou Edge.
        </span>
      `;
      permissionBanner.style.opacity = '0.6';
    }
    return false;
  }

  // Vérifier si le Service Worker est supporté
  if (!('serviceWorker' in navigator)) {
    if (permissionBanner) {
      permissionBanner.innerHTML = `
        <span class="pb-icon"><i class="fas fa-bell-slash"></i></span>
        <span class="pb-text">
          <strong>Service Worker non supporté</strong><br>
          Votre navigateur ne supporte pas les Service Workers.
        </span>
      `;
      permissionBanner.style.opacity = '0.6';
    }
    return false;
  }

  return true;
}

// ================================================================
// RENDU DES NOTIFICATIONS
// ================================================================

function renderNotifications() {
  if (!notifList) return;

  if (notifications.length === 0) {
    notifList.innerHTML = `
      <div class="empty-state">
        <i class="fas fa-bell-slash"></i>
        <h4>Aucune notification</h4>
        <p>Vous serez notifié lorsque de nouveaux contenus seront disponibles.</p>
      </div>
    `;
    notifCount.textContent = '0';
    if (notifBadge) notifBadge.style.display = 'none';
    return;
  }

  // Trier par date (plus récent en premier)
  const sorted = [...notifications].sort((a, b) => {
    const da = a.createdAt?.toDate?.() || new Date(a.createdAt || 0);
    const db = b.createdAt?.toDate?.() || new Date(b.createdAt || 0);
    return db - da;
  });

  const unreadCount = sorted.filter(n => !n.read).length;
  notifCount.textContent = sorted.length;
  if (notifBadge) {
    notifBadge.style.display = unreadCount > 0 ? 'block' : 'none';
  }

  notifList.innerHTML = sorted.map(notif => {
    const icon = getIcon(notif.type);
    const iconClass = getIconClass(notif.type);
    const time = formatTime(notif.createdAt);
    const statusClass = notif.read ? '' : 'unread';

    return `
      <div class="notif-item" data-id="${notif.id}" onclick="window.markAsRead('${notif.id}')">
        <div class="ni-icon ${iconClass}">
          <i class="fas ${icon}"></i>
        </div>
        <div class="ni-content">
          <div class="ni-title">
            ${escapeHtml(notif.title)}
            <span class="ni-status ${statusClass}">${notif.read ? '✅ Lu' : '🔴 Nouveau'}</span>
          </div>
          <div class="ni-text">${escapeHtml(notif.body)}</div>
          <div class="ni-time"><i class="fas fa-clock"></i> ${time}</div>
        </div>
      </div>
    `;
  }).join('');

  // Marquer comme lues automatiquement après affichage
  if (unreadCount > 0) {
    setTimeout(() => markAllAsRead(), 5000);
  }
}

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ================================================================
// MARQUER COMME LU
// ================================================================

window.markAsRead = async function(notifId) {
  if (!currentUser) return;
  try {
    const notifRef = doc(db, 'users', currentUser.uid, 'notifications', notifId);
    await updateDoc(notifRef, { read: true });
  } catch (e) {
    console.warn('Erreur marquage lecture:', e);
  }
};

async function markAllAsRead() {
  if (!currentUser) return;
  try {
    const unread = notifications.filter(n => !n.read);
    for (const n of unread) {
      const notifRef = doc(db, 'users', currentUser.uid, 'notifications', n.id);
      await updateDoc(notifRef, { read: true });
    }
  } catch (e) {
    console.warn('Erreur marquage lecture:', e);
  }
}

// ================================================================
// FIREBASE CLOUD MESSAGING
// ================================================================

async function requestNotificationPermission() {
  try {
    // Vérifier le support
    if (typeof Notification === 'undefined') {
      showToast('⚠️ Votre navigateur ne supporte pas les notifications.', 'warning');
      return false;
    }

    const permission = await Notification.requestPermission();

    if (permission === 'granted') {
      const token = await registerFCMToken();
      if (token) {
        showToast('✅ Notifications activées !', 'success');
        updatePermissionUI(true);
        return true;
      } else {
        showToast('⚠️ Impossible d\'obtenir le token FCM.', 'warning');
        return false;
      }
    } else {
      showToast('⚠️ Vous avez refusé les notifications.', 'warning');
      updatePermissionUI(false);
      return false;
    }
  } catch (error) {
    console.error('Erreur permission:', error);
    showToast('❌ Erreur lors de l\'activation: ' + error.message, 'error');
    return false;
  }
}

async function registerFCMToken() {
  if (!currentUser) {
    console.warn('⏳ Utilisateur non connecté');
    return null;
  }

  try {
    // Enregistrer le Service Worker d'abord
    let swRegistration;
    if ('serviceWorker' in navigator) {
      swRegistration = await navigator.serviceWorker.register('/ARVEXA-SCHOOL/firebase-messaging-sw.js');
      console.log('✅ Service Worker enregistré');
    } else {
      console.warn('⚠️ Service Worker non supporté');
      return null;
    }

    // Récupérer le token FCM
    const token = await getToken(messaging, {
      vapidKey: VAPID_KEY,
      serviceWorkerRegistration: swRegistration
    });

    console.log('📱 FCM Token:', token);

    // Sauvegarder le token dans Firestore
    const tokenRef = doc(db, 'users', currentUser.uid, 'fcm', 'tokens');
    await setDoc(tokenRef, {
      tokens: [token],
      updatedAt: new Date().toISOString()
    }, { merge: true });

    // Sauvegarder dans localStorage
    localStorage.setItem('fcm_token', token);
    localStorage.setItem('fcm_enabled', 'true');

    return token;
  } catch (error) {
    console.error('Erreur récupération token:', error);

    // Gérer les erreurs spécifiques
    if (error.code === 'messaging/permission-blocked') {
      showToast('⚠️ Les notifications sont bloquées. Activez-les dans les paramètres du navigateur.', 'warning');
    } else if (error.code === 'messaging/unsupported-browser') {
      showToast('⚠️ Navigateur non supporté. Utilisez Chrome ou Edge.', 'warning');
    } else {
      showToast('❌ Erreur: ' + error.message, 'error');
    }
    return null;
  }
}

function updatePermissionUI(enabled) {
  if (!permissionBanner || !enableBtn) return;
  if (enabled) {
    permissionBanner.style.display = 'none';
    enableBtn.textContent = '✅ Activé';
    enableBtn.className = 'btn-enable enabled';
    enableBtn.disabled = true;
  } else {
    permissionBanner.style.display = 'flex';
    enableBtn.textContent = '🔔 Activer les notifications';
    enableBtn.className = 'btn-enable';
    enableBtn.disabled = false;
  }
}

// ================================================================
// ÉCOUTE DES NOTIFICATIONS (Firestore)
// ================================================================

function listenNotifications(userId) {
  if (unsubscribeNotifications) {
    unsubscribeNotifications();
    unsubscribeNotifications = null;
  }

  if (!userId) return;

  const notifRef = collection(db, 'users', userId, 'notifications');
  const q = query(notifRef);

  unsubscribeNotifications = onSnapshot(q, (snapshot) => {
    notifications = [];
    snapshot.forEach(doc => {
      notifications.push({ id: doc.id, ...doc.data() });
    });
    renderNotifications();
  }, (error) => {
    console.warn('Erreur écoute notifications:', error);
  });
}

// ================================================================
// ÉCOUTE DES MESSAGES FCM (quand l'app est ouverte)
// ================================================================

function listenFCMessages() {
  onMessage(messaging, (payload) => {
    console.log('📩 Message FCM reçu (app ouverte):', payload);

    const { title, body, type, link } = payload.data || {};

    // Ajouter à Firestore si l'utilisateur est connecté
    if (currentUser && title) {
      const notifRef = doc(collection(db, 'users', currentUser.uid, 'notifications'));
      setDoc(notifRef, {
        title: title || 'Nouvelle notification',
        body: body || '',
        type: type || 'info',
        link: link || null,
        read: false,
        createdAt: new Date().toISOString()
      }).catch(e => console.warn('Erreur sauvegarde notif:', e));
    }

    // Afficher un toast si l'app est visible
    if (title && document.visibilityState === 'visible') {
      showToast(`🔔 ${title}`, 'info');
    }
  });
}

// ================================================================
// ENVOYER UNE NOTIFICATION DE TEST (admin)
// ================================================================

window.sendTestNotification = async function() {
  if (!currentUser) {
    showToast('⚠️ Vous devez être connecté', 'error');
    return;
  }

  try {
    const notifRef = doc(collection(db, 'users', currentUser.uid, 'notifications'));
    await setDoc(notifRef, {
      title: '🎉 Bienvenue sur ARVEXA School !',
      body: 'Vous êtes maintenant prêt à recevoir les notifications.',
      type: 'success',
      link: '/index.html',
      read: false,
      createdAt: new Date().toISOString()
    });
    showToast('✅ Notification de test envoyée !', 'success');
  } catch (error) {
    console.error('Erreur envoi test:', error);
    showToast('❌ Erreur: ' + error.message, 'error');
  }
};

// ================================================================
// INIT
// ================================================================

function initNotifications(user) {
  currentUser = user;

  // Vérifier le support des notifications
  const supported = checkNotificationSupport();
  if (!supported) return;

  // Vérifier si les notifications sont déjà activées
  const fcmEnabled = localStorage.getItem('fcm_enabled') === 'true';
  const fcmToken = localStorage.getItem('fcm_token');

  if (fcmEnabled && fcmToken) {
    updatePermissionUI(true);
  } else {
    // Vérifier si la permission est déjà accordée mais token manquant
    if (Notification.permission === 'granted') {
      registerFCMToken();
      updatePermissionUI(true);
    } else {
      updatePermissionUI(false);
    }
  }

  // Écouter les notifications Firestore
  if (user) {
    listenNotifications(user.uid);
    listenFCMessages();
  }
}

// ================================================================
// ÉVÉNEMENTS
// ================================================================

// Activer les notifications
if (enableBtn) {
  enableBtn.addEventListener('click', async () => {
    // Vérifier le support avant de demander
    if (typeof Notification === 'undefined') {
      showToast('⚠️ Votre navigateur ne supporte pas les notifications.', 'warning');
      return;
    }
    if (!('serviceWorker' in navigator)) {
      showToast('⚠️ Service Worker non supporté.', 'warning');
      return;
    }

    const granted = await requestNotificationPermission();
    if (granted) {
      updatePermissionUI(true);
    }
  });
}

// Déconnexion
document.getElementById('logoutBtn')?.addEventListener('click', async (e) => {
  e.preventDefault();
  try {
    await logout();
    window.location.href = 'login.html';
  } catch (error) {
    showToast('Erreur de déconnexion.', 'error');
  }
});

// Menu toggle
document.getElementById('menuToggle')?.addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('active');
});

document.getElementById('sidebarOverlay')?.addEventListener('click', () => {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('active');
});

document.getElementById('notifBtn')?.addEventListener('click', () => {
  window.location.href = 'notifications.html';
});

// ================================================================
// PROTECTION + CHARGEMENT
// ================================================================

protectPage(async (user) => {
  console.log('🔔 Notifications - Utilisateur:', user?.uid);
  if (user) {
    initNotifications(user);
  }
});

console.log('🔔 ARVEXA School — Page Notifications avec FCM');

// Exposer les fonctions utiles pour le debug
window.testNotif = window.sendTestNotification;
</script>
